<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="robots" content="noindex">
<title>Mein Projekt · nutz die Sonne</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='6' fill='%230B0B0B'/%3E%3Ccircle cx='15' cy='13' r='6' fill='%23F4DB02'/%3E%3Crect x='5' y='20' width='20' height='5' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050608;--panel:rgba(18,21,26,.72);--panel2:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--line2:rgba(244,219,2,.35);--sun:#F4DB02;--sun-g:rgba(244,219,2,.55);--tx:#EDEFF2;--mu:#8A93A0;--ok:#3DDC84;--bad:#FF6B6B;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100%}
body{overflow-x:hidden}
/* Hintergrund: Lichtschein, Raster, schwebende Teilchen */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 35% at 70% 0%,rgba(244,219,2,.16),transparent 70%),radial-gradient(35% 30% at 0% 100%,rgba(60,120,255,.10),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,#000 30%,transparent 100%);animation:gridmove 30s linear infinite}
.bg i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--sun);box-shadow:0 0 8px var(--sun);opacity:.0;animation:float 12s linear infinite}
@keyframes drift{to{transform:translate(-4%,3%) scale(1.06)}}@keyframes gridmove{to{background-position:44px 44px}}
@keyframes float{0%{opacity:0;transform:translateY(0)}10%{opacity:.7}90%{opacity:.5}100%{opacity:0;transform:translateY(-70vh)}}
/* Kopf */
.top{position:sticky;top:0;z-index:5;padding:12px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(5,6,8,.6);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{height:40px;width:auto;display:block;background:#fff;border-radius:10px;padding:3px 8px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 24px rgba(244,219,2,.18)}
.wm{font:700 18px/1 'Space Grotesk',sans-serif}.wm span{color:var(--sun)}
.top .sp{flex:1}.live{font:500 12px/1 'JetBrains Mono',monospace;color:var(--mu);display:flex;align-items:center;gap:7px;letter-spacing:.08em}
[hidden]{display:none!important}.live b{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
.top button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}.top button:hover{border-color:var(--sun);color:var(--sun)}
main{max-width:1120px;margin:0 auto;padding:26px 16px 40px}
/* Kopfbereich Projekt */
.hero{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.ey{font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.22em;color:var(--sun);text-transform:uppercase}
.hero h1{font:700 clamp(30px,6vw,56px)/1.02 'Space Grotesk',sans-serif;margin:10px 0 8px;letter-spacing:-.02em;background:linear-gradient(100deg,#fff 30%,var(--sun) 60%,#fff 90%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.meta{color:var(--mu);font-size:15px}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hud div{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 14px;min-width:120px;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.hud div:nth-child(2){animation-delay:.08s}.hud div:nth-child(3){animation-delay:.16s}
.hud small{display:block;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--mu);text-transform:uppercase;margin-bottom:6px}.hud b{font:700 22px/1 'Space Grotesk',sans-serif}.hud b em{font-style:normal;color:var(--sun)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 14px}.tabs button{font:500 14px/1 Inter,sans-serif;border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:999px;padding:10px 16px;cursor:pointer;transition:.25s}
.tabs button:hover{border-color:var(--line2)}.tabs button.on{background:var(--sun);color:#000;border-color:var(--sun);box-shadow:0 0 22px rgba(244,219,2,.45)}
.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:20px;align-items:start}@media(max-width:880px){.grid{grid-template-columns:1fr}}
/* Skizzen-Panel mit HUD-Ecken und Scan-Linie */
.stage{position:relative;border-radius:20px;padding:14px;background:radial-gradient(120% 90% at 50% 20%,rgba(244,219,2,.06),transparent 60%),var(--panel);border:1px solid var(--line);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.stage::before,.stage::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--sun);opacity:.8;pointer-events:none}
.stage::before{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}.stage::after{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.scan{position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(244,219,2,.04) 60%,rgba(244,219,2,.14) 98%,transparent);pointer-events:none;animation:scan 5.5s cubic-bezier(.5,0,.5,1) infinite}
@keyframes scan{0%{top:-120px}70%,100%{top:100%}}
.stage .cap{position:absolute;left:18px;bottom:14px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--mu);text-transform:uppercase;pointer-events:none}
/* Liste */
.hint{font-size:14px;color:var(--mu);margin:2px 0 12px}
.item{position:relative;display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:inherit;cursor:pointer;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.item::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(244,219,2,.12),transparent);transform:translateX(-100%);transition:transform .6s}
.item:hover,.item:focus-visible,.item.on{border-color:var(--line2);transform:translateX(4px);box-shadow:0 0 0 1px rgba(244,219,2,.15),0 10px 30px rgba(0,0,0,.4);outline:none}.item:hover::before{transform:translateX(100%)}
.item .n{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 'Space Grotesk',sans-serif;color:var(--sun);border:1.5px solid var(--sun);box-shadow:0 0 12px rgba(244,219,2,.35),inset 0 0 8px rgba(244,219,2,.2)}
.item .t{flex:1;min-width:0}.item .s{font:500 11px/1.4 'JetBrains Mono',monospace;letter-spacing:.06em;color:var(--mu);margin-top:3px;text-transform:uppercase}.item .s.has{color:var(--ok)}
.item .ar{color:var(--mu);transition:.25s}.item:hover .ar{color:var(--sun);transform:translateX(3px)}
/* Info-Fenster */
dialog{border:1px solid var(--line2);border-radius:20px;padding:0;max-width:min(540px,calc(100vw - 32px));width:100%;background:rgba(12,14,18,.92);color:var(--tx);box-shadow:0 0 0 1px rgba(244,219,2,.1),0 0 60px rgba(244,219,2,.18),0 40px 100px rgba(0,0,0,.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
dialog[open]{animation:pop .45s cubic-bezier(.2,1.2,.3,1)}dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.dlg-h{position:relative;padding:20px 22px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.dlg-h::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--sun),transparent);animation:line 2.4s ease-in-out infinite}
@keyframes line{0%,100%{opacity:.3}50%{opacity:1}}
.dlg-h b{font:700 22px/1.15 'Space Grotesk',sans-serif;flex:1}.dlg-h .n{width:36px;height:36px;border-radius:50%;background:var(--sun);color:#000;font:700 16px/1 'Space Grotesk',sans-serif;display:grid;place-items:center;box-shadow:0 0 20px var(--sun-g)}
.dlg-ey{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--sun);text-transform:uppercase;padding:14px 22px 0}
.dlg-b{padding:10px 22px 8px;white-space:pre-line;min-height:3em;font-size:16px}.dlg-b .cur{display:inline-block;width:8px;height:1.1em;background:var(--sun);vertical-align:-3px;margin-left:2px;animation:blink .8s steps(1) infinite}
.dlg-f{padding:10px 22px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mu);font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.06em}
.btn{font:600 15px/1 Inter,sans-serif;border:0;border-radius:12px;padding:13px 18px;background:var(--sun);color:#000;cursor:pointer;transition:.2s;box-shadow:0 0 0 rgba(244,219,2,0)}.btn:hover{box-shadow:0 0 24px rgba(244,219,2,.5);transform:translateY(-1px)}
.btn.ghost{background:none;color:var(--mu);box-shadow:none;padding:6px;font-weight:500;text-decoration:underline;text-underline-offset:3px}.btn.ghost:hover{color:var(--sun);transform:none}
/* Anmeldung */
.auth{position:relative;max-width:440px;margin:7vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 40px 100px rgba(0,0,0,.6);animation:up .8s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.auth::before{content:"";position:absolute;inset:-1px;border-radius:22px;padding:1px;background:linear-gradient(130deg,rgba(244,219,2,.7),transparent 35%,transparent 65%,rgba(244,219,2,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.auth h1{font:700 30px/1.1 'Space Grotesk',sans-serif;margin:8px 0 6px}.auth .sub{color:var(--mu);font-size:14px}
.auth label{display:flex;flex-direction:column;gap:6px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-top:16px}
.auth input[type=email],.auth input[type=password]{font:16px Inter,sans-serif;letter-spacing:0;text-transform:none;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);color:var(--tx);transition:.2s}
.auth input:focus{outline:none;border-color:var(--sun);box-shadow:0 0 0 3px rgba(244,219,2,.15),0 0 20px rgba(244,219,2,.15)}
.auth .row{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.consent{flex-direction:row!important;align-items:flex-start;gap:12px!important;background:rgba(244,219,2,.07);border:1px solid rgba(244,219,2,.25);border-radius:12px;padding:12px 14px;font:13px/1.5 Inter,sans-serif!important;letter-spacing:0!important;text-transform:none!important;color:var(--tx)!important}.consent input{margin-top:2px;width:18px;height:18px;flex:none;accent-color:#F4DB02}
.msg{font-size:14px;min-height:1.3em;margin-top:12px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.empty{text-align:center;padding:60px 16px;color:var(--mu)}.empty h2{color:var(--tx);font:700 26px/1.2 'Space Grotesk',sans-serif}
.loader{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--sun);animation:spin 1s linear infinite;box-shadow:0 0 20px rgba(244,219,2,.2)}@keyframes spin{to{transform:rotate(360deg)}}
footer{max-width:1120px;margin:0 auto;padding:0 16px 30px;color:var(--mu);font-size:12px}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bg i{display:none}}
</style>
</head>

<script>
/*KV3D-START*/
/* ========== 3-D-Skizzen (isometrisch, im Anschnitt) für die Kunden-Ansicht ==========
   Gleicher Code in der App und auf der Kunden-Seite (kunde.html, wird beim Build herauskopiert).
   Szene = {type, n, comps:{key:{st:'klick'|'grau'|'aus', label}}}. Klickbare Teile gelb, alles andere schwarz-grau-weiß. */
const KV3D=(()=>{
  const CO=0.8660254, K=12, f1=v=>Math.round(v*10)/10;
  const escX=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TYPES={
    haus:{l:'Einfamilienhaus mit PV',comps:[['module','PV-Module','klick'],['zaehler','Zählerschrank','klick'],['wr','Wechselrichter','klick'],['speicher','Batteriespeicher','klick'],['wallbox','Wallbox','aus'],['wp','Wärmepumpe','aus']]},
    gewerbe:{l:'Gewerbedach / Halle',comps:[['module','PV-Module auf dem Dach','klick'],['hv','Hauptverteilung & Zähler','klick'],['wr','Wechselrichter','klick'],['speicher','Batteriespeicher','aus'],['lader','Ladepunkte','aus']]},
    solarpark:{l:'Solarpark (Freifläche)',comps:[['module','Modultische','klick'],['wr','Wechselrichter','klick'],['kabel','Kabeltrasse','klick'],['zaun','Zaun & Zufahrt','grau'],['trafo','Trafostation','klick'],['uest','Übergabestation','klick']]},
    trafo:{l:'Trafostation (Anschnitt)',comps:[['ms','Mittelspannungs-Schaltanlage','klick'],['trafo','Transformator','klick'],['ns','Niederspannungs-Verteilung','klick'],['lueft','Lüftung','grau'],['kabel','Kabelanschlüsse','klick']]},
    uebergabe:{l:'Übergabestation (Anschnitt)',comps:[['msfeld','Mittelspannungs-Schaltfelder','klick'],['mess','Messfeld & Zähler','klick'],['schutz','Schutztechnik','klick'],['fernwirk','Fernwirkanlage','klick'],['kabel','Kabelanschluss Netz','grau']]},
    bess:{l:'Batteriespeicher-Container (Anschnitt)',comps:[['racks','Batterie-Racks','klick'],['ems','Energiemanagement (EMS)','klick'],['brand','Brandschutz','grau'],['klima','Klimatisierung','grau'],['pcs','Wechselrichter (PCS)','klick'],['trafo','Transformator','klick']]},
    ladepark:{l:'Ladepark',comps:[['lader','Ladesäulen','klick'],['verteiler','Unterverteilung','klick'],['netz','Netzanschluss & Zähler','klick'],['kabel','Kabelwege','grau']]}
  };
  TYPES.foto={l:'Foto-Skizze',comps:[]};
  // Teile einer Szene: bei Foto-Skizzen die selbst markierten Bereiche, sonst die festen Bausteine
  const defs=s=>s&&s.type==='foto'?(s.spots||[]).map((p,i)=>[p.id,'Bereich '+(i+1),'klick']):(TYPES[s&&s.type]||TYPES.haus).comps;
  const st=(s,k)=>{ const c=((s&&s.comps)||{})[k]; if(c&&c.st) return c.st; const d=defs(s).find(x=>x[0]===k); return d?d[2]:'grau'; };
  const lab=(s,k,pub)=>{ const c=((s&&s.comps)||{})[k]||{}, d=defs(s).find(x=>x[0]===k); return (pub?c.label:(c.label||''))||(d?d[1]:k); };
  // Reihenfolge der klickbaren Teile = Nummern in der Skizze
  const clickList=s=>defs(s).filter(([k])=>st(s,k)==='klick').map(([k],i)=>({k,n:i+1,label:lab(s,k)}));
  // Foto-Skizze: Bild 1:1 (als Skizze umgerechnet) + markierte Bereiche; o.img = Bildadresse, o.blob = Ablage-ID (App), o.draw = Markier-Modus
  const PCSS=`.kvph{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}.kvph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
.kvph>svg{position:absolute;inset:0;width:100%;height:100%}.kvph.draw>svg{cursor:crosshair;touch-action:none}
.kvph .sp{fill:rgba(244,219,2,.30);stroke:#D9BF00;stroke-width:3;vector-effect:non-scaling-stroke}.kvph .kc:hover .sp,.kvph .kc.sel .sp{fill:rgba(244,219,2,.5);stroke:#111}
.kvph .tmp{fill:rgba(244,219,2,.25);stroke:#111;stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.kvph.dk{background:#000}.kvph.dk>img{filter:invert(1) grayscale(1) contrast(1.15) brightness(.85)}
.kvph.dk .sp{fill:rgba(244,219,2,.16);stroke:#F4DB02;stroke-width:2.5}.kvph.dk .kc.k{animation:kvGlow 3.2s ease-in-out infinite}.kvph.dk .kc:hover .sp,.kvph.dk .kc.sel .sp{fill:rgba(244,219,2,.32)}`;
  function photo(s,o){ const w=+s.w||1000, h=+s.h||750, VH=Math.round(1000*h/w), R=Math.max(16,Math.min(30,Math.max(1000,VH)/42)), dk=o.theme==='dark';
    const sp=Object.fromEntries((s.spots||[]).map(p=>[p.id,p]));
    const rects=clickList(s).map(({k,n,label})=>{ const p=sp[k]; if(!p) return ''; const x=p.x*1000, y=p.y*VH, ww=Math.max(4,p.w*1000), hh=Math.max(4,p.h*VH), cx=Math.min(1000-R-2,Math.max(R+2,x+R*.2)), cy=Math.max(R+2,y-R*.2);
      return `<g class="kc k${o.sel===k?' sel':''}" data-c="${k}" tabindex="0" role="button" aria-label="${escX(label)}"><rect class="sp" x="${f1(x)}" y="${f1(y)}" width="${f1(ww)}" height="${f1(hh)}" rx="6"/></g><g class="bd${o.sel===k?' sel':''}" data-c="${k}" role="button" tabindex="-1" aria-label="${escX(label)}"><circle class="pr" cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R)}" style="animation-delay:${(n*.37%2.6).toFixed(2)}s"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R)}" style="stroke-width:3"/><text x="${f1(cx)}" y="${f1(cy)}" style="font-size:${f1(R*1.15)}px">${n}</text></g>`; }).join('');
    const src=o.img?`src="${escX(o.img)}"`:o.blob?`data-blob="${escX(o.blob)}"`:'';
    return `<div class="kvph${dk?' dk':''}${o.draw?' draw':''}" style="aspect-ratio:${w}/${h}"><style>${PCSS}</style><img ${src} alt="" draggable="false"><svg class="kv3d${dk?' dk':''}" viewBox="0 0 1000 ${VH}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${escX(s.title||'Foto-Skizze')}"><style>${CSS}</style><rect class="bg0" x="0" y="0" width="1000" height="${VH}" fill="transparent"/>${rects}</svg></div>`; }
  function ctx(s){
    const out=[], pts=[], anch={};
    const pr=(x,y,z)=>{ const X=(x-y)*CO*K, Y=((x+y)*.5-z)*K; pts.push([X,Y]); return f1(X)+','+f1(Y); };
    const c={
      st:k=>st(s,k), on:k=>st(s,k)!=='aus',
      poly(ps,cl){ out.push('<polygon class="'+cl+'" points="'+ps.map(p=>pr(p[0],p[1],p[2])).join(' ')+'"/>'); },
      line(a,b,cl){ const A=pr(...a).split(','), B=pr(...b).split(','); out.push(`<line class="${cl||'ln'}" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"/>`); },
      path(ps,cl){ out.push('<polyline class="'+(cl||'cab')+'" points="'+ps.map(p=>pr(p[0],p[1],p[2])).join(' ')+'"/>'); },
      box(x,y,z,w,d,h,m){ m=m||'b'; c.poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],m+' t'); c.poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],m+' l'); c.poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],m+' r'); },
      // Fläche (4 Ecken: hinten-links, hinten-rechts, vorne-rechts, vorne-links) in Module aufteilen
      grid(a,b,cc,d,cols,rows,m,gap){ gap=gap==null?.07:gap; const L=(p,q,t)=>p.map((v,i)=>v+(q[i]-v)*t), at=(u,v)=>L(L(a,b,u),L(d,cc,u),v);
        for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){ const u0=(i+gap)/cols,u1=(i+1-gap)/cols,v0=(j+gap)/rows,v1=(j+1-gap)/rows; c.poly([at(u0,v0),at(u1,v0),at(u1,v1),at(u0,v1)],(m||'d')+' t'); } },
      // Fläche auf der linken (y = const) bzw. rechten (x = const) Seite, z. B. Fenster, Display
      fy(y,x0,x1,z0,z1,cl){ c.poly([[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],cl||'w'); },
      fx(x,y0,y1,z0,z1,cl){ c.poly([[x,y0,z0],[x,y1,z0],[x,y1,z1],[x,y0,z1]],cl||'w'); },
      g(k,fn){ if(k&&st(s,k)==='aus') return; const kl=k&&st(s,k)==='klick'; out.push(kl?`<g class="kc k" data-c="${k}" tabindex="0" role="button" aria-label="${escX(lab(s,k))}">`:'<g>'); fn(); out.push('</g>'); },
      anchor(k,x,y,z){ if(!anch[k]) anch[k]=[x,y,z]; },
      // offener Raum: Boden, Rück- und Seitenwand; vorne/rechts nur gestrichelte Schnittkante
      room(x,y,w,d,h){ c.box(x,y,0,w,d,.25,'b'); c.box(x,y,.25,w,.25,h,'b'); c.box(x,y+.25,.25,.25,d-.25,h,'b');
        c.path([[x+.25,y+d,.25+h],[x+w,y+d,.25+h],[x+w,y+.25,.25+h]],'cut'); c.line([x+w,y+d,.25],[x+w,y+d,.25+h],'cut'); },
      out, pts, anch
    };
    return c;
  }
  const DRAW={
    haus(c,s){ const n=Math.max(6,Math.min(24,+s.n||12)), cols=Math.max(3,Math.min(9,Math.round(n/2))), rows=n>18?3:2;
      c.poly([[-3,-3,0],[25,-3,0],[25,14,0],[-3,14,0]],'gnd');
      c.box(0,0,0,11,8,5,'b'); c.fy(8,1.3,2.9,1.6,3.4); c.fy(8,4.6,6,0,2.4,'w2'); c.fy(8,7.8,9.6,1.6,3.4); c.fx(11,1.5,3.1,1.6,3.4);
      const rh=3.2, o=.6, zr=y=>5+rh-(y-4)*rh/4;
