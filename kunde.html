<html lang="de">
<head>

<title>Mein Projekt · nutz die Sonne</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Work+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0B;--sun:#F4DB02;--sun2:#FFF6B0;--bg:#F5F5F2;--card:#fff;--line:#E3E3DE;--muted:#6B6B66;--bad:#B3261E;--ok:#2E7D4A;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
a{color:inherit}
.top{background:#fff;color:var(--ink);padding:10px 16px;border-bottom:4px solid var(--sun)}.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{height:46px;width:auto;display:block}.wm{font:800 18px/1 'Work Sans',sans-serif;letter-spacing:.02em}.wm span{background:var(--sun);color:var(--ink);padding:1px 5px}
.top .sp{flex:1}.top button{background:none;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
.hero h1{font:800 clamp(24px,5vw,36px)/1.15 'Work Sans',sans-serif;margin:6px 0 4px}.hero .ey{display:inline-block;background:var(--sun);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.hero .meta{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}.tabs button{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}.tabs button.on{background:var(--ink);color:var(--sun)}
.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(240px,1fr);gap:18px;align-items:start}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.hint{font-size:14px;color:var(--muted);margin:0 0 8px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.item:hover,.item:focus-visible{border-color:var(--ink);outline:none}.item .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sun);font-weight:700;display:grid;place-items:center;border:2px solid var(--sun)}
.item .t{flex:1;min-width:0}.item .s{font-size:13px;color:var(--muted)}
dialog{border:0;border-radius:18px;padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(11,11,11,.55)}
.dlg-h{background:var(--ink);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}.dlg-h b{font:800 19px/1.2 'Work Sans',sans-serif;flex:1}.dlg-h .n{width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--ink);font-weight:700;display:grid;place-items:center}
.dlg-b{padding:16px 18px 6px;white-space:pre-line}.dlg-f{padding:8px 18px 16px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--ink);color:#fff;cursor:pointer}.btn.sun{background:var(--sun);color:var(--ink)}.btn.ghost{background:none;color:var(--ink);text-decoration:underline;padding:6px}
.auth{max-width:420px;margin:6vh auto 0;background:#fff;border-radius:18px;padding:26px;border:1px solid var(--line)}.auth h1{font:800 24px/1.2 'Work Sans',sans-serif;margin:0 0 6px}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#444;margin-top:12px}.auth input[type=email],.auth input[type=password]{font:inherit;padding:11px 12px;border:1.5px solid #ccc;border-radius:10px;background:#fff;color:var(--ink)}
.auth input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--sun2)}.auth .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.consent{flex-direction:row!important;align-items:flex-start;gap:10px!important;background:var(--sun2);border-radius:10px;padding:10px 12px;font-size:13px!important;color:var(--ink)!important}.consent input{margin-top:3px;width:18px;height:18px;flex:none}
.msg{font-size:14px;min-height:1.3em;margin-top:10px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
footer{max-width:1080px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}
</style>
</head>

<script>
/*KV3D-START*/
/* ========== 3-D-Skizzen (isometrisch, im Anschnitt) für die Kunden-Ansicht ==========
   Gleicher Code in der App und auf der Kunden-Seite (kunde.html, wird beim Build herauskopiert).
   Szene = {type, n, comps:{key:{st:'klick'|'grau'|'aus', label}}}. Klickbare Teile gelb, alles andere schwarz-grau-weiß. */
const KV3D=(()=>{
  const CO=0.8660254, K=12, f1=v=>Math.round(v*10)/10;
  const escX=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TYPES={
    haus:{l:'Einfamilienhaus mit PV',comps:[['module','PV-Module','klick'],['zaehler','Zählerschrank','klick'],['wr','Wechselrichter','klick'],['speicher','Batteriespeicher','klick'],['wallbox','Wallbox','aus'],['wp','Wärmepumpe','aus']]},
    gewerbe:{l:'Gewerbedach / Halle',comps:[['module','PV-Module auf dem Dach','klick'],['hv','Hauptverteilung & Zähler','klick'],['wr','Wechselrichter','klick'],['speicher','Batteriespeicher','aus'],['lader','Ladepunkte','aus']]},
    solarpark:{l:'Solarpark (Freifläche)',comps:[['module','Modultische','klick'],['wr','Wechselrichter','klick'],['kabel','Kabeltrasse','klick'],['zaun','Zaun & Zufahrt','grau'],['trafo','Trafostation','klick'],['uest','Übergabestation','klick']]},
    trafo:{l:'Trafostation (Anschnitt)',comps:[['ms','Mittelspannungs-Schaltanlage','klick'],['trafo','Transformator','klick'],['ns','Niederspannungs-Verteilung','klick'],['lueft','Lüftung','grau'],['kabel','Kabelanschlüsse','klick']]},
    uebergabe:{l:'Übergabestation (Anschnitt)',comps:[['msfeld','Mittelspannungs-Schaltfelder','klick'],['mess','Messfeld & Zähler','klick'],['schutz','Schutztechnik','klick'],['fernwirk','Fernwirkanlage','klick'],['kabel','Kabelanschluss Netz','grau']]},
    bess:{l:'Batteriespeicher-Container (Anschnitt)',comps:[['racks','Batterie-Racks','klick'],['ems','Energiemanagement (EMS)','klick'],['brand','Brandschutz','grau'],['klima','Klimatisierung','grau'],['pcs','Wechselrichter (PCS)','klick'],['trafo','Transformator','klick']]},
    ladepark:{l:'Ladepark',comps:[['lader','Ladesäulen','klick'],['verteiler','Unterverteilung','klick'],['netz','Netzanschluss & Zähler','klick'],['kabel','Kabelwege','grau']]}
  };
  const st=(s,k)=>{ const c=((s&&s.comps)||{})[k]; if(c&&c.st) return c.st; const d=(TYPES[s.type]||TYPES.haus).comps.find(x=>x[0]===k); return d?d[2]:'grau'; };
  const lab=(s,k,pub)=>{ const c=((s&&s.comps)||{})[k]||{}, d=(TYPES[s.type]||TYPES.haus).comps.find(x=>x[0]===k); return (pub?c.label:(c.label||''))||(d?d[1]:k); };
  // Reihenfolge der klickbaren Teile = Nummern in der Skizze
  const clickList=s=>(TYPES[s.type]||TYPES.haus).comps.filter(([k])=>st(s,k)==='klick').map(([k],i)=>({k,n:i+1,label:lab(s,k)}));
  function ctx(s){
    const out=[], pts=[], anch={};
    const pr=(x,y,z)=>{ const X=(x-y)*CO*K, Y=((x+y)*.5-z)*K; pts.push([X,Y]); return f1(X)+','+f1(Y); };
    const c={
      st:k=>st(s,k), on:k=>st(s,k)!=='aus',
      poly(ps,cl){ out.push('<polygon class="'+cl+'" points="'+ps.map(p=>pr(p[0],p[1],p[2])).join(' ')+'"/>'); },
      line(a,b,cl){ const A=pr(...a).split(','), B=pr(...b).split(','); out.push(`<line class="${cl||'ln'}" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"/>`); },
      path(ps,cl){ out.push('<polyline class="'+(cl||'cab')+'" points="'+ps.map(p=>pr(p[0],p[1],p[2])).join(' ')+'"/>'); },
      box(x,y,z,w,d,h,m){ m=m||'b'; c.poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],m+' t'); c.poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],m+' l'); c.poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],m+' r'); },
      // Fläche (4 Ecken: hinten-links, hinten-rechts, vorne-rechts, vorne-links) in Module aufteilen
      grid(a,b,cc,d,cols,rows,m,gap){ gap=gap==null?.07:gap; const L=(p,q,t)=>p.map((v,i)=>v+(q[i]-v)*t), at=(u,v)=>L(L(a,b,u),L(d,cc,u),v);
        for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){ const u0=(i+gap)/cols,u1=(i+1-gap)/cols,v0=(j+gap)/rows,v1=(j+1-gap)/rows; c.poly([at(u0,v0),at(u1,v0),at(u1,v1),at(u0,v1)],(m||'d')+' t'); } },
      // Fläche auf der linken (y = const) bzw. rechten (x = const) Seite, z. B. Fenster, Display
      fy(y,x0,x1,z0,z1,cl){ c.poly([[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],cl||'w'); },
      fx(x,y0,y1,z0,z1,cl){ c.poly([[x,y0,z0],[x,y1,z0],[x,y1,z1],[x,y0,z1]],cl||'w'); },
      g(k,fn){ if(k&&st(s,k)==='aus') return; const kl=k&&st(s,k)==='klick'; out.push(kl?`<g class="kc k" data-c="${k}" tabindex="0" role="button" aria-label="${escX(lab(s,k))}">`:'<g>'); fn(); out.push('</g>'); },
      anchor(k,x,y,z){ if(!anch[k]) anch[k]=[x,y,z]; },
      // offener Raum: Boden, Rück- und Seitenwand; vorne/rechts nur gestrichelte Schnittkante
      room(x,y,w,d,h){ c.box(x,y,0,w,d,.25,'b'); c.box(x,y,.25,w,.25,h,'b'); c.box(x,y+.25,.25,.25,d-.25,h,'b');
        c.path([[x+.25,y+d,.25+h],[x+w,y+d,.25+h],[x+w,y+.25,.25+h]],'cut'); c.line([x+w,y+d,.25],[x+w,y+d,.25+h],'cut'); },
      out, pts, anch
    };
    return c;
  }
  const DRAW={
    haus(c,s){ const n=Math.max(6,Math.min(24,+s.n||12)), cols=Math.max(3,Math.min(9,Math.round(n/2))), rows=n>18?3:2;
      c.poly([[-3,-3,0],[25,-3,0],[25,14,0],[-3,14,0]],'gnd');

    ${reg?`<label class="consent"><input id="ok" type="checkbox"><span><b>Datenschutzhinweis:</b> ${DSGVO} Ich bin damit einverstanden.</span></label>`:''}
    <div class="row"><button class="btn" type="submit">${np?'Speichern':reg?'Konto anlegen':reset?'Link senden':'Anmelden'}</button>
      ${np?'':`<span>${reg||reset?'<button type="button" class="btn ghost" data-m="">Zur Anmeldung</button>':'<button type="button" class="btn ghost" data-m="reg">Konto anlegen</button><button type="button" class="btn ghost" data-m="reset">Passwort vergessen?</button>'}</span>`}</div>
    <div class="msg ${note&&note.ok?'ok':'err'}" id="msg" role="status">${esc(note&&note.t||'')}</div></form>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>auth(b.dataset.m));
  const msg=(t,ok)=>{ const m=$('#msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); };
  app.querySelector('form').onsubmit=async e=>{ e.preventDefault(); const em=($('#em')||{}).value, pw=($('#pw')||{}).value, pw2=($('#pw2')||{}).value;
    if(np){ if(!pw||pw.length<8) return msg('Bitte mindestens 8 Zeichen.'); if(pw!==pw2) return msg('Die Passwörter stimmen nicht überein.'); const {error}=await SB.auth.updateUser({password:pw}); if(error) return msg(error.message); history.replaceState(null,'',here()); return load(); }
    if(!em||!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)) return msg('Bitte eine gültige E-Mail-Adresse eingeben.');
    if(reset){ const {error}=await SB.auth.resetPasswordForEmail(em,{redirectTo:here()}); if(error) return msg(error.message); return msg('Falls ein Konto existiert, kommt gleich eine E-Mail mit einem Link.',true); }
    if(reg){ if(!pw||pw.length<8) return msg('Bitte mindestens 8 Zeichen.'); if(pw!==pw2) return msg('Die Passwörter stimmen nicht überein.'); if(!$('#ok').checked) return msg('Bitte den Datenschutzhinweis bestätigen.');
      const {error}=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:here(),data:{kunde:true,consent_at:new Date().toISOString(),consent_text:DSGVO}}});
      if(error) return msg(/registered|exists/i.test(error.message)?'Für diese Adresse gibt es schon ein Konto. Bitte anmelden oder „Passwort vergessen?“ nutzen.':error.message);
      return auth('',{t:'Fast geschafft: Bitte klicken Sie auf den Bestätigungslink in der E-Mail, die wir Ihnen gerade geschickt haben. Danach können Sie sich hier anmelden.',ok:true}); }
    msg('Anmelden …',true); const {error}=await SB.auth.signInWithPassword({email:em,password:pw});
    if(error) return msg(/confirm/i.test(error.message)?'Bitte zuerst den Bestätigungslink in Ihrer E-Mail anklicken.':/invalid/i.test(error.message)?'E-Mail oder Passwort falsch.':error.message);
    load(); };
  setTimeout(()=>{ const i=app.querySelector('input'); if(i) i.focus(); },50);
}
async function load(){
  const {data:{session}}=await SB.auth.getSession(); if(!session) return auth('');
  $('#out').hidden=false;
  const {data,error}=await SB.from('portal').select('id,data,updated_at').order('updated_at',{ascending:false});
  if(error){ app.innerHTML=`<div class="empty">Die Projektseite ist gerade nicht erreichbar. Bitte später noch einmal versuchen.</div>`; return; }
  ROWS=(data||[]).filter(r=>r.data&&Array.isArray(r.data.scenes)&&r.data.scenes.length);
  if(!ROWS.length){ app.innerHTML=`<div class="empty"><h2 style="color:var(--ink)">Noch kein Projekt freigegeben</h2>Für ${esc(session.user.email)} ist noch keine Projektseite freigeschaltet. Bitte melden Sie sich bei uns – wir schalten Sie frei.</div>`; return; }
  P=0; SC=0; show();
}
function show(){ const r=ROWS[P], d=r.data, s=d.scenes[Math.min(SC,d.scenes.length-1)], list=KV3D.clickList({type:s.type,comps:s.comps});
  app.innerHTML=`${ROWS.length>1?`<div class="tabs" aria-label="Ihre Projekte">${ROWS.map((x,i)=>`<button data-p="${i}" class="${i===P?'on':''}">${esc(x.data.name)}</button>`).join('')}</div>`:''}
    <section class="hero"><span class="ey">Ihr Projekt</span><h1>${esc(d.name)}</h1><div class="meta">${esc([d.place,'Stand '+fmt(r.updated_at||d.stand)].filter(Boolean).join(' · '))}</div></section>
    ${d.scenes.length>1?`<div class="tabs" role="tablist">${d.scenes.map((x,i)=>`<button role="tab" aria-selected="${i===SC}" data-s="${i}" class="${i===SC?'on':''}">${esc(x.title)}</button>`).join('')}</div>`:'<div style="height:14px"></div>'}
    <div class="grid"><div class="card" id="pic">${KV3D.svg({type:s.type,n:s.n,comps:s.comps,title:s.title})}</div>
      <div><p class="hint">Tippen Sie auf ein gelb markiertes Teil oder eine Nummer – dann sehen Sie, was es macht und wie der Stand ist.</p>
      ${list.map(x=>{ const c=s.comps[x.k]||{}; return `<button class="item" data-c="${x.k}"><span class="n">${x.n}</span><span class="t"><b>${esc(c.label||x.label)}</b><div class="s">${c.text?'Info'+(c.at?' vom '+fmt(c.at):''):'noch keine Info'}</div></span><span aria-hidden="true">›</span></button>`; }).join('')}</div></div>`;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ P=+b.dataset.p; SC=0; show(); });
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ SC=+b.dataset.s; show(); });
  app.querySelectorAll('[data-c]').forEach(b=>{ b.addEventListener('click',()=>open(s,b.dataset.c,list)); if(b.closest('svg')) b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(s,b.dataset.c,list); } }); });
}
function open(s,k,list){ const c=s.comps[k]||{}, x=list.find(y=>y.k===k); if(!x) return;
  $('#dN').textContent=x.n; $('#dT').textContent=c.label||x.label; $('#dB').textContent=c.text||'Zu diesem Teil gibt es noch keine Informationen. Wir ergänzen sie, sobald es Neuigkeiten gibt.'; $('#dS').textContent=c.at?'Stand '+fmt(c.at):'';
  const d=$('#dlg'); if(d.showModal) d.showModal(); else d.setAttribute('open',''); }
$('#dX').onclick=()=>$('#dlg').close(); $('#dlg').addEventListener('click',e=>{ if(e.target.id==='dlg') $('#dlg').close(); });
$('#out').onclick=async()=>{ await SB.auth.signOut(); $('#out').hidden=true; auth(''); };
SB.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY') auth('newpw'); });
if(/type=recovery/.test(location.hash)) auth('newpw'); else load();
})();
</script>
</body>
