/* ========== Globale Suche (Startseite) ========== */
function gsearch(q){
  q=String(q||'').trim().toLowerCase(); if(q.length<2) return [];
  const terms=q.split(/\s+/), hit=s=>{ const x=String(s||'').toLowerCase(); return terms.every(t=>x.includes(t)); };
  const snip=(s)=>{ const x=String(s||''), i=x.toLowerCase().indexOf(terms[0]); return i<0?x.slice(0,110):(i>40?'…':'')+x.slice(Math.max(0,i-40),i+90).replace(/\s+/g,' ')+'…'; };
  const out=[];
  arr('projects').forEach(p=>{ const meta=[p.name,p.nr,p.place,p.customer,p.contact,p.pl,p.vnb].join(' '), notes=[p.scope,p.questions,p.notes,p.updates].join('\n');
    if(hit(meta)) out.push({g:'Projekte',t:p.name,m:[p.nr,p.place,CATS[catOf(p)]].filter(Boolean).join(' · '),act:'openProject',id:p.id});
    else if(hit(meta+' '+notes)) out.push({g:'Notizen',t:p.name,m:snip(notes),act:'openAt',id:p.id,at:'status'}); });
  arr('tasks').forEach(t=>{ const s=[t.title,t.notes,t.ext,t.who,projName(t.pid),...(t.upd2||[]).map(u=>u.t)].join(' '); if(hit(s)) out.push({g:'To-Dos',t:(t.done?'✓ ':'')+t.title,m:[projName(t.pid)||(t.pool?'Allgemein':''),t.who?shortWho(t.who):'',t.due?fmtD(t.due):''].filter(Boolean).join(' · '),act:'editTask',id:t.id}); });
  Object.values(S.priv||{}).forEach(t=>{ if(hit([t.title,t.firm,t.notes].join(' '))) out.push({g:'Private To-Dos',t:t.title,m:t.firm||'',act:'nav',v:'private'}); });
  arr('orders').forEach(o=>{ const s=[o.supplier,o.no,o.buyer,projName(o.pid),...(o.items||[]).map(i=>[i.art,i.artNr].join(' '))].join(' '); if(hit(s)) out.push({g:'Bestellungen',t:(o.supplier||'Bestellung')+(o.no?' · '+o.no:''),m:[projName(o.pid),fmtD(o.ordered),orderState(o).k].filter(Boolean).join(' · '),act:'editOrder',id:o.id}); });
  allFiles().forEach(f=>{ if(hit([f.name,f.orig,f.from,f.subject,f.text,projName(f.pid)].join(' '))) out.push({g:'Dateien',t:f.name,m:[FILE_KINDS[f.kind],projName(f.pid),fmtD(f.date)].filter(Boolean).join(' · '),act:f.virtual?f.vact:f.asset?'fileAsset':'fileOpen',id:f.virtual?f.vid:f.asset?f.asset:f.id}); });
  arr('stock').forEach(s=>{ if(hit([s.art,s.artNr,s.loc].join(' '))) out.push({g:'Lager',t:s.art,m:[s.artNr,s.loc,'Bestand '+qn(s.qty)+' '+(s.unit||'')].filter(Boolean).join(' · '),act:'stockHist',id:s.id}); });
  arr('events').forEach(e=>{ if(hit([e.title,e.place,e.notes,projName(e.pid)].join(' '))) out.push({g:'Termine',t:e.title,m:[fmtD(e.date),projName(e.pid)].filter(Boolean).join(' · '),act:'editEvent',id:e.id}); });
  arr('plan').forEach(w=>(w.entries||[]).forEach((e,i)=>{ if(hit([e.t,e.note,e.who,projName(e.pid)].join(' '))) out.push({g:'Wochenplanung',t:e.t,m:[fmtD(e.d),e.who?shortWho(e.who):'',projName(e.pid)].filter(Boolean).join(' · '),act:'editPlan',id:w.id+'|'+i}); }));
  arr('reports').forEach(r=>{ if(hit([projName(r.pid),r.work,r.plan,r.address].join(' '))) out.push({g:'Tagesrapporte',t:projName(r.pid)||'Rapport',m:fmtD(r.date),act:'editReport',id:r.id}); });
  arr('picks').forEach(k=>{ if(hit([projName(k.pid),k.who,...(k.items||[]).map(i=>i.art)].join(' '))) out.push({g:'Kommissionierung',t:'Liste '+(projName(k.pid)||''),m:[fmtD(k.date),PICK_ST[k.status]].join(' · '),act:'openPick',id:k.id}); });
  return out;
}
function gsearchHtml(q){
  const res=gsearch(q); if(String(q||'').trim().length<2) return '';
  if(!res.length) return '<div class="gs-none">Nichts gefunden.</div>';
  const groups={}; ['Projekte','To-Dos','Notizen','Bestellungen','Dateien','Lager','Termine','Wochenplanung','Tagesrapporte','Kommissionierung','Private To-Dos'].forEach(g=>groups[g]=[]); res.forEach(r=>{ (groups[r.g]=groups[r.g]||[]).push(r); });
  return Object.entries(groups).filter(([,l])=>l.length).map(([g,l])=>`<div class="gs-g"><div class="gs-h">${esc(g)} <span class="mono">${l.length}</span></div>${l.slice(0,8).map(r=>`<button type="button" class="gs-r" data-act="${r.act}" data-id="${esc(r.id||'')}" ${r.at?`data-at="${r.at}"`:''} ${r.v?`data-v="${r.v}"`:''}><b>${esc(r.t)}</b><span>${esc(r.m||'')}</span></button>`).join('')}${l.length>8?`<div class="small muted" style="padding:4px 10px">+ ${l.length-8} weitere – Suche genauer eingeben</div>`:''}</div>`).join('');
}

function askRun(q){
  q=fixNames(String(q||'').trim()).replace(/[.!]+$/,''); if(q.length<2) return;
  const words=q.split(/\s+/).length, res=gsearch(q);
  if(SAMPLE&&(words>=3||/\?$/.test(q)||!res.length)) return askAI(q);
  if(res.length){ const r=res[0]; A[r.act]&&A[r.act]({id:r.id,at:r.at,v:r.v}); return; }
  toast('Nichts gefunden.');
}

// KI-Stimme: Antworten laut vorlesen (Sprachausgabe des Browsers, deutsche Stimme; Schalter 🔊 im Suchfeld, pro Gerät gemerkt)

// Beste deutsche Stimme: die neuronalen „Natural“-Stimmen (Edge), dann Google, dann Online-Stimmen
function speakVoice(){ const vs=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang)); return vs.find(v=>/natural/i.test(v.name)&&/seraphina|katja|amala|florian|conrad/i.test(v.name))||vs.find(v=>/natural/i.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs.find(v=>/online/i.test(v.name)||v.localService===false)||vs.find(v=>/katja|anna|petra|helena/i.test(v.name))||vs[0]||null; }
// Text sprechbar machen: keine Zeichen/Emojis, Daten ausgeschrieben, Abkürzungen aufgelöst, Aufzählungen als ruhiger Satzfluss
const SPK_MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function speakPrep(t){
  return String(t).replace(/\*\*/g,'').replace(/[„“"»«]/g,'').replace(/[\u{1F300}-\u{1FAFF}☀-➿️↗☐✓✕■]/gu,'')
    .replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g,(m,y,mo,d)=>+d+'. '+SPK_MON[+mo-1])
    .replace(/\b(?:Mo|Di|Mi|Do|Fr|Sa|So)\.?\s+(?=\d{1,2}\.\d{1,2}\.)/g,'')
    .replace(/\b(\d{1,2})\.(\d{1,2})\.(?:\d{2,4})?(?!\d)/g,(m,d,mo)=>+mo>=1&&+mo<=12?+d+'. '+SPK_MON[+mo-1]:m)
    .replace(/\bz\.\s?B\./g,'zum Beispiel').replace(/\bca\./g,'circa').replace(/\bggf\./g,'gegebenenfalls').replace(/\bbzw\./g,'beziehungsweise').replace(/\bu\.\s?a\./g,'unter anderem').replace(/\binkl\./g,'inklusive').replace(/\bNr\./g,'Nummer')
    .replace(/\bkWp\b/g,'Kilowatt-Peak').replace(/\bkWh\b/g,'Kilowattstunden').replace(/\bkW\b/g,'Kilowatt').replace(/\bMWp\b/g,'Megawatt-Peak').replace(/\bPV\b/g,'Photovoltaik').replace(/\bWR\b/g,'Wechselrichter')
    .replace(/(\d)\s*%/g,'$1 Prozent').replace(/(\d)\s*€/g,'$1 Euro').replace(/\s*\/\s*/g,', ').replace(/\s*[–—]\s*/g,', ').replace(/\s*·\s*/g,', ')
    .split('\n').map(l=>l.replace(/^\s*[-•*]\s+/,'').trim()).filter(Boolean).map(l=>/[.!?:;,]$/.test(l)?l:l+'.').join(' ')
    .replace(/:\s*\./g,':').replace(/\s{2,}/g,' ').trim(); }
// In Satz-Stücke teilen (Chrome bricht lange Texte sonst nach ~15 s ab) und ohne Pause nacheinander sprechen
function speak(t){ if(!CAN_SPEAK||!t) return; speechSynthesis.cancel();
  const go=()=>{ const v=speakVoice(), parts=[]; let cur=''; speakPrep(t).split(/(?<=[.!?;:])\s+/).forEach(s=>{ if((cur+' '+s).length>230&&cur){ parts.push(cur); cur=s; } else cur=cur?cur+' '+s:s; }); if(cur) parts.push(cur);
    parts.forEach(p=>{ const u=new SpeechSynthesisUtterance(p); u.lang='de-DE'; if(v) u.voice=v; u.rate=v&&/natural|google/i.test(v.name)?1.08:1.12; u.pitch=1; speechSynthesis.speak(u); }); };
  if(speechSynthesis.getVoices().length) go(); else { let done=false; const once=()=>{ if(done) return; done=true; go(); }; speechSynthesis.addEventListener('voiceschanged',once,{once:true}); setTimeout(once,600); } }
function speakStop(){ try{ CAN_SPEAK&&speechSynthesis.cancel(); }catch(e){} }
if(CAN_SPEAK) try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){}

// Diagramme als SVG: Balken, Linie, Torte
function aicChart(c){
  if(!c||!Array.isArray(c.labels)||!Array.isArray(c.series)||!c.series.length) return '';
  const L=c.labels.slice(0,24).map(String), SR=c.series.slice(0,4).map(s=>({name:String(s.name||''),data:L.map((_,i)=>+((s.data||[])[i])||0)}));
  const COL=['var(--sun)','var(--ink)','#8a96a3','#e08a2c'], unit=c.unit?' '+c.unit:'', fmt=v=>(Math.round(v*10)/10).toLocaleString('de-DE')+unit;
  const head=c.title?`<div class="aic-ct">${esc(c.title)}</div>`:'';
  const leg=(items)=>`<div class="aic-lg">${items.map(([n,col])=>`<span><i style="background:${col}"></i>${esc(n)}</span>`).join('')}</div>`;
  if(c.type==='pie'){ const v=SR[0].data, tot=v.reduce((a,b)=>a+b,0)||1, PC=['var(--sun)','var(--ink)','#8a96a3','#e08a2c','#5b9bd5','#9bbb59','#c0504d','#8064a2'];
    let a0=-Math.PI/2; const arcs=v.map((x,i)=>{ const a1=a0+x/tot*2*Math.PI, big=a1-a0>Math.PI?1:0, p=(a)=>[80+70*Math.cos(a),80+70*Math.sin(a)].map(n=>n.toFixed(1)).join(' ');
      const d=x>=tot?'M 80 10 A 70 70 0 1 1 79.9 10 Z':`M 80 80 L ${p(a0)} A 70 70 0 ${big} 1 ${p(a1)} Z`; a0=a1; return `<path d="${d}" style="fill:${PC[i%PC.length]}" stroke="var(--surface)" stroke-width="2"><title>${esc(L[i])}: ${fmt(x)}</title></path>`; }).join('');
    return `<div class="aic-ch">${head}<svg viewBox="0 0 160 160" class="aic-pie" role="img" aria-label="${esc(c.title||'Diagramm')}">${arcs}</svg>${leg(L.map((l,i)=>[l+': '+fmt(v[i])+' ('+Math.round(v[i]/tot*100)+' %)',PC[i%PC.length]]))}</div>`; }
  const W=340,H=190,pl=36,pb=44,pt=10, iw=W-pl-6, ih=H-pb-pt, max=Math.max(1,...SR.flatMap(s=>s.data)), step=Math.pow(10,Math.floor(Math.log10(max))), top=Math.ceil(max/step)*step, y=v=>pt+ih-(v/top)*ih, gw=iw/L.length;
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-6}" y1="${y(top*f)}" y2="${y(top*f)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(top*f)+3}" text-anchor="end" class="aic-ax">${(Math.round(top*f*10)/10).toLocaleString('de-DE')}</text>`).join('');
  const xl=L.map((l,i)=>{ const x=pl+gw*i+gw/2, s=l.length>10?l.slice(0,9)+'…':l; return L.length>6?`<text x="${x}" y="${H-pb+12}" transform="rotate(-35 ${x} ${H-pb+12})" text-anchor="end" class="aic-ax">${esc(s)}</text>`:`<text x="${x}" y="${H-pb+14}" text-anchor="middle" class="aic-ax">${esc(s)}</text>`; }).join('');
  let marks='';
  if(c.type==='line') marks=SR.map((s,k)=>`<polyline fill="none" stroke="${COL[k]}" stroke-width="2.5" points="${s.data.map((v,i)=>(pl+gw*i+gw/2).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>${s.data.map((v,i)=>`<circle cx="${pl+gw*i+gw/2}" cy="${y(v)}" r="3" fill="${COL[k]}"><title>${esc(L[i])}: ${fmt(v)}</title></circle>`).join('')}`).join('');
  else { const bw=Math.min(28,gw*.8/SR.length); marks=SR.map((s,k)=>s.data.map((v,i)=>{ const x=pl+gw*i+(gw-bw*SR.length)/2+bw*k; return `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(pt+ih-y(v)).toFixed(1)}" rx="2" style="fill:${COL[k]}"><title>${esc(L[i])}${s.name?' · '+esc(s.name):''}: ${fmt(v)}</title></rect>${SR.length===1&&L.length<=12?`<text x="${(x+bw/2).toFixed(1)}" y="${(y(v)-3).toFixed(1)}" text-anchor="middle" class="aic-val">${(Math.round(v*10)/10).toLocaleString('de-DE')}</text>`:''}`; }).join('')).join(''); }
  return `<div class="aic-ch">${head}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'Diagramm')}">${grid}${marks}${xl}</svg>${SR.length>1?leg(SR.map((s,k)=>[s.name,COL[k]])):''}</div>`;
}

let DICT=null;
const DICT_END=/\s*\b(fertig|abschicken)\s*[.!]?\s*$/i;
function dictate(btn,onLive,onDone){
  if(!SRec) return null; if(MEET_ON){ toast('Während einer Meeting-Mitschrift ist das Mikrofon belegt.'); return null; }
  let stop=false, ended=false, buf='', rec=null;
  const finish=send=>{ if(ended) return; ended=true; stop=true; try{ rec&&rec.stop(); }catch(e){} DICT=null; if(btn){ btn.classList.remove('on'); btn.textContent='🎙'; }
    const t=fixNames(buf.replace(DICT_END,'').trim()); onLive(t); if(send&&t) onDone(t); };
  const run=()=>{ rec=new SRec(); rec.lang='de-DE'; rec.continuous=true; rec.interimResults=true;
    rec.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) buf+=(buf?' ':'')+r[0].transcript.trim(); else interim+=r[0].transcript; }
      const all=(buf+(interim?' '+interim:'')).trim(); if(DICT_END.test(all)){ buf=all; finish(true); return; } onLive(fixNames(all)); };
    rec.onerror=e=>{ if(['not-allowed','service-not-allowed'].includes(e.error)){ toast('Kein Zugriff aufs Mikrofon – bitte im Browser erlauben.'); finish(false); } };
    rec.onend=()=>{ if(!stop){ try{ run(); }catch(e){ finish(true); } } }; // Browser beendet nach Pausen von selbst → einfach weiter zuhören
    rec.start(); };
  try{ run(); }catch(e){ toast('Mikrofon konnte nicht gestartet werden.'); return null; }
  if(btn){ btn.classList.add('on'); btn.textContent='■'; }
  DICT={finish,btn}; return DICT; }

async function readMail(files,text){
  const f=[...(files||[])].find(x=>/\.(msg|eml)$/i.test(x.name||'')||x.type==='message/rfc822');
  if(f){ const ab=await f.arrayBuffer(); let m=null;
    if(/\.msg$/i.test(f.name)){ try{ m=parseMsg(ab); }catch(e){} if(!m){ const l=parseMsgLoose(ab); m={...l,att:[]}; } } else m=parseEml(ab);
    return {subject:m.subject||f.name,from:m.from||'',date:m.date||'',text:String(m.text||''),att:(m.att||[]).map(a=>a.name),file:f}; }
  const t=String(text||'').trim(); if(t.length<20) return null; const lines=t.split('\n');
  const val=rx=>(lines.find(l=>rx.test(l))||'').replace(/^[^:]+:\s*/,'');
  return {subject:val(/^(Betreff|Subject)\s*:/i)||lines[0].slice(0,90),from:val(/^(Von|From)\s*:/i),date:'',text:t,att:[]};
}
// Kopierter Text ohne Mailkopf mit mehreren kurzen Zeilen = Aufgabenliste
const isTodoList=t=>{ const ls=String(t||'').split('\n').map(l=>l.trim()).filter(Boolean); return ls.length>=2&&!/^(Von|From|Betreff|Subject|An|To)\s*:/im.test(t)&&ls.filter(l=>l.length<=180).length>=ls.length*0.8; };
async function mailToTodos(files,text){

  m.kind='mail'; return analyzeTodos(m,files,txt);
}

// Lokale Erkennung ohne Claude: jede Zeile ein To-Do, Projekt/Kürzel/Frist aus der Zeile
function localListTodos(text,defPid){
  const byK={}; staff().forEach(s=>{ byK[shortWho(s.name).toLowerCase()]=shortWho(s.name); });
  return String(text).split('\n').map(l=>l.replace(/^\s*([-–•*·]|\d+[.)]|\[\s?\])\s*/,'').trim()).filter(l=>l.length>=3).slice(0,40).map(l=>{
    const who=(l.match(/\b[\wÄÖÜäöüß]{2,5}\b/g)||[]).map(x=>byK[x.toLowerCase()]).find(Boolean)||'';
    const dm=l.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/); let due=''; if(dm){ const y=dm[3]?(dm[3].length===2?'20'+dm[3]:dm[3]):TODAY().slice(0,4); due=y+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0'); if(!dm[3]&&due<TODAY()) due=(+y+1)+due.slice(4); }
    const mp=matchProject(l); return {title:l.slice(0,160),who,due,ext:'',projectId:mp.pid||nameOnlyProject(l)||defPid||''}; });

function nameOnlyProject(line){ const tw=words(String(line).toLowerCase()), STOP=new Set(['firma','herr','frau','kunde','montage','angebot','termin','anrufen']);

  const act=hits.filter(p=>['laufend','planung'].includes(catOf(p))); return act.length===1?act[0].id:hits.length===1?hits[0].id:'';
}
async function analyzeTodos(m,files,txt){
  const isMail=m.kind==='mail', ctx=[m.subject,m.from,m.text,m.att.join(' ')].join('\n'), rule=isMail?matchProject(ctx):{pid:'',why:''};
  let r=null;
  if(SAMPLE){ toast(isMail?'Claude liest die Mail …':'Claude ordnet die To-Dos zu …');
    const plist=arr('projects').filter(p=>['laufend','planung','onhold'].includes(catOf(p))).map(p=>`${p.id} | ${p.name} | ${p.nr||''} | ${String(p.place||'').replace(/\n/g,' ')} | ${p.customer||''}`).join('\n');
    const roster=staff().map(s=>`${shortWho(s.name)} = ${s.name.replace(/\s*\([^)]*\)$/,'')} (${ROLES[s.role]||s.role})`).join('\n');
    const src=isMail?`E-Mail an einen Solar-Installationsbetrieb (nutz die Sonne GmbH; PV, Speicher, Ladesäulen).\nVon: ${m.from}\nBetreff: ${m.subject}${m.att.length?'\nAnhänge: '+m.att.join(', '):''}\nText:\n"""${m.text.slice(0,6000)}"""`
      :`Liste von Aufgaben (Stichpunkte, Notizen) aus einem Solar-Installationsbetrieb (nutz die Sonne GmbH; PV, Speicher, Ladesäulen):\n"""${m.text.slice(0,6000)}"""`;
    const prompt=`Heute ist ${TODAY()}. ${src}
Projekte (ID | Name | Nummer | Ort | Kunde):\n${plist}
Mitarbeiter (Kürzel = Name, Rolle):\n${roster}\nNamen genau so schreiben wie in dieser Liste (z. B. Marc immer mit c).
${isMail?`1) Gehört die Mail insgesamt zu einem Projekt? Nur bei eindeutigem Bezug. Lager/Büro ohne Kundenbezug: "intern". Sonst "".
2) Welche Aufgaben ergeben sich für UNS (Anfragen beantworten, Unterlagen schicken, Termin bestätigen, Rechnung prüfen, Rückruf, Material bestellen …)? Keine Aufgaben für den Absender, reine Infos = keine Aufgabe.`
:`1) Jede Zeile/jeder Stichpunkt ist in der Regel ein eigenes To-Do (zusammengehörige Zeilen zusammenfassen, Überschriften sind keine To-Dos). Formuliere jedes als kurze Aufgabe im Imperativ.`}
3) Ordne JEDES To-Do einzeln einem Projekt zu ("projectId"), wenn Projektname, Kunde, Ort oder Nummer im To-Do (oder bei einer Mail eindeutig in der Mail) vorkommen; Lager/Büro/Werkstatt: "intern"; sonst "".
4) Zuständig: nur ein Kürzel aus der Liste, wenn genannt oder klar aus der Rolle; sonst "". Frist nur, wenn genannt oder klar ableitbar.
Bereits offene To-Dos (ID | Aufgabe | Projekt | Wer):
${arr('tasks').filter(x=>!x.done).slice(0,150).map(x=>x.id+' | '+x.title+' | '+(projName(x.pid)||'-')+' | '+(x.who?shortWho(x.who):'-')).join('\n')||'-'}
5) Prüfe für JEDES To-Do, ob es mit einem bereits offenen To-Do zusammenhängt (gleiche Sache, Rückmeldung dazu, Fortschritt, Erledigung). Dann "relatedId" = dessen ID und "relation": "update" (neue Info/Fortschritt zum bestehenden To-Do – kein neues To-Do nötig), "erledigt" (die Mail/der Text sagt, dass das bestehende To-Do erledigt ist) oder "neu" (hängt zusammen, ist aber eine eigene neue Aufgabe). Kein Zusammenhang: relatedId "". Bei "update"/"erledigt" darf title die neue Info kurz zusammenfassen. Nur bei echtem inhaltlichem Zusammenhang, nicht nur weil dasselbe Projekt.
Antworte nur mit JSON: {"projectId":"","why":"kurz","summary":"1 Satz","todos":[{"title":"kurz, Imperativ","projectId":"","who":"Kürzel oder leer","due":"YYYY-MM-DD oder leer","prio":"dringend|hoch|normal|niedrig (dringend nur bei Frist in den nächsten Tagen, Baustellenstillstand, Netzbetreiber-/Behördenfrist oder ausdrücklich „dringend“)","ext":"Firma, falls extern, sonst leer","relatedId":"ID oder leer","relation":"update|erledigt|neu"}]}`;
    try{ r=await SAMPLE.json(prompt,{modelTier:'default'}); }catch(e){ if(e&&e.code&&e.code!=='cancelled') toast(SAMPLE_ERR[e.code]||'Claude nicht erreichbar – einfache Erkennung.'); } }
  const okP=id=>id&&(S.projects[id]||id===INTERN)?id:'';
  const pidAI=okP(r&&r.projectId);
  const pid=pidAI||rule.pid||'', why=pidAI?'Claude: '+String(r.why||''):rule.why||'';
  let todos=r&&Array.isArray(r.todos)?r.todos:isMail?localTodos(m.text).map(t=>({...t,projectId:matchProject(t.title).pid||pid})):localListTodos(m.text,'');
  todos=todos.filter(t=>t&&String(t.title||'').trim()).slice(0,isMail?10:40).map(t=>({...t,projectId:okP(t.projectId)||(isMail?pid:'')}));
  // Zusammenhang mit bestehenden offenen To-Dos: Claude-Vorschlag, sonst Wortvergleich
  todos.forEach(t=>{ const ok=t.relatedId&&S.tasks[t.relatedId]&&!S.tasks[t.relatedId].done; const fr=ok?null:findRelated(t); t.rel=ok?t.relatedId:fr?fr.id:''; t.relation=ok&&['update','erledigt','neu'].includes(t.relation)?t.relation:fr?(fr.strong?'update':'neu'):''; t.relBy=ok?'Claude':fr?'Wortvergleich':''; });
  showMailTodos(m,pid,why,todos,r&&r.summary||'',files,txt);
}
const TOK_STOP=new Set(['bitte','noch','und','oder','für','mit','beim','dass','eine','einen','nach','über','wegen','anrufen','nachfragen','klären','prüfen','machen','erledigen','schicken','senden','bestellen','projekt','kunde','termin','heute','morgen']);
const toks=s=>new Set((String(s||'').toLowerCase().match(/[a-zäöüß0-9-]{4,}/g)||[]).filter(w=>!TOK_STOP.has(w)).map(w=>w.slice(0,7)));
// Rückgabe {id, strong}: schwacher Treffer wird nur angezeigt (Standard: neues To-Do), starker als Update vorgeschlagen
function findRelated(t){ const pw=t.projectId&&S.projects[t.projectId]?toks(S.projects[t.projectId].name):new Set(); const a=new Set([...toks(t.title)].filter(w=>!pw.has(w))); if(!a.size) return null; let best=null;
  arr('tasks').filter(x=>!x.done&&x.id!==t.id).forEach(x=>{ if(t.projectId&&x.pid&&x.pid!==t.projectId) return; const bt=toks(x.title), b=new Set([...bt,...toks(x.notes)]); let c=0; a.forEach(w=>{ if(b.has(w)) c++; }); if(!c) return;
    const same=!!(t.projectId&&x.pid===t.projectId), sc=c/Math.max(1,Math.min(a.size,bt.size||1))+(same?0.2:0);
    const strong=(c>=2&&sc>=0.5)||(same&&sc>=0.7); if(strong||(same&&c>=1)) if(!best||sc>best.sc) best={id:x.id,sc,strong}; });
  return best; }

"""${all.slice(0,7000)}"""
Projekte (ID | Name | Nummer | Ort | Kunde):\n${plist}

Was ist das? Wähle genau einen Typ:
- "bestellung"/"ab"/"rechnung": Bestellung, Auftragsbestätigung oder Rechnung eines LIEFERANTEN an uns (Material/Dienstleistung, die wir einkaufen)
- "lieferschein": Lieferschein / Warenbegleitschein zu einer Lieferung an uns
- "todos": Text/Mail, aus der sich vor allem Aufgaben für uns ergeben, oder eine Aufgabenliste
- "notiz": Stand/Info zu einem Projekt ohne konkrete Aufgabe (z. B. Baustellenbericht, Gesprächsnotiz)
- "angebot": Angebot (von uns an Kunden oder von Lieferanten an uns), "korrespondenz": sonstige Mail ohne Aufgaben, "plan", "foto", "vertrag", "sonst"
Ordne ein Projekt zu, wenn eindeutig (Projektname, Nummer, Kommission, Adresse, Kunde); Lager/Büro: "intern"; sonst "". Bei Lieferschein/AB/Rechnung: passende offene Bestellung (orderId), falls Lieferant + Nummer/Positionen passen, sonst "".
Prüfe außerdem: Ist das eine Rückmeldung, ein Fortschritt oder eine Erledigung zu einem der offenen To-Dos (gleiche Sache, nicht nur gleiches Projekt)? Dann in "related" aufnehmen: relation "update" (neue Info) oder "erledigt" (die Sache ist damit erledigt), update = 1 kurzer Satz, was neu ist. Sonst related leer.

// Lager und Bestellungen werden über Bezeichnung bzw. Artikel-Nr. zugeordnet; Ergebnis je Zeichnen zwischengespeichert
let ART_IX=null, ART_IX_SIG='';
function artIndex(){ const st=arr('stock'), od=arr('orders'), sig=st.length+'|'+od.length+'|'+st.reduce((a,s)=>a+(+s.qty||0),0)+'|'+od.reduce((a,o)=>a+(o.items||[]).reduce((b,i)=>b+(+i.recv||0),0),0)+'|'+od.map(o=>o.status).join('');
  if(ART_IX&&ART_IX_SIG===sig) return ART_IX; const m={stock:{},weg:{}}, add=(o,key,v)=>{ if(key) (o[key]=o[key]||[]).push(v); };
  st.forEach(s=>{ add(m.stock,stNorm(s.art),s); if(s.artNr) add(m.stock,'#'+s.artNr,s); });
  od.filter(o=>orderState(o).open).forEach(o=>(o.items||[]).forEach(i=>{ const n=Math.max(0,(+i.qty||0)-(+i.recv||0)); if(n>0){ const v={o,i,n}; add(m.weg,stNorm(i.art),v); if(i.artNr) add(m.weg,'#'+i.artNr,v); } }));
  ART_IX_SIG=sig; return ART_IX=m; }
function artInfo(a){ const ix=artIndex(), k=stNorm(a.name), pick=o=>[...new Set([...(o[k]||[]),...(a.nr&&o['#'+a.nr]||[]),...(a.supNr&&o['#'+a.supNr]||[])])];
  const stocks=pick(ix.stock), wegs=pick(ix.weg), lager=stocks.reduce((s,x)=>s+(+x.qty||0),0), weg=wegs.reduce((s,x)=>s+x.n,0);

// Zahlungsbewegungen (Bank/Kasse): bezahlte Ausgaben (−), Einnahmen (+), Zahlungseingänge auf Rechnungen (+), importierte Bankzeilen
function finMoves(){ const out=[];

  return out.sort((a,b)=>String(b.d).localeCompare(String(a.d))); }
const finBal=acc=>r2((+((FCFG().open||{})[acc])||0)+finMoves().filter(m=>m.acc===acc&&!(m.ref&&m.ref.kind==='bank'&&m.ref.match)).reduce((a,m)=>a+m.amt,0));

// Umsatzsteuer eines Zeitraums (Soll-Versteuerung: nach Rechnungsdatum; Ist: nach Zahlung)
function finUst(from,to){ const ist=FCFG().ust==='ist', k={81:0,'81s':0,86:0,'86s':0,87:0,60:0,84:0,85:0,66:0,67:0}, inR=d=>d&&d>=from&&d<=to;
  arr('sales').filter(s=>isInv(s.type)&&s.nr).forEach(s=>{ const m=saleBy(s); let f=0;
    if(ist){ const pd=(s.paid||[]).filter(p=>inR(p.d)).reduce((a,p)=>a+(+p.amt||0),0); f=m.gross?pd/m.gross:0; } else f=inR(s.date)?1:0; // Ist: anteilig nach Zahlungseingang
    if(!f) return; Object.entries(m.by).forEach(([c,x])=>{ if(c==='19'){ k[81]+=x.net*f; k['81s']+=x.vat*f; } else if(c==='7'){ k[86]+=x.net*f; k['86s']+=x.vat*f; } else if(c==='0p') k[87]+=x.net*f; else if(c==='0r') k[60]+=x.net*f; }); });
  finAll().forEach(f=>{ const d=ist?f.paidDate:f.date; if(!inR(d)) return; const n=+f.net||0, v=+f.vat||0;
    if(f.kind==='einnahme'&&f.cat!=='einlage'){ if(+f.vatRate===19){ k[81]+=n; k['81s']+=v; } else if(+f.vatRate===7){ k[86]+=n; k['86s']+=v; } }
    if(f.kind==='ausgabe'&&f.cat!=='privat'){ if(f.rc){ const t=r2(n*0.19); k[84]+=n; k[85]+=t; k[67]+=t; } else k[66]+=v; } });
  Object.keys(k).forEach(x=>k[x]=r2(k[x])); k[83]=r2(k['81s']+k['86s']+k[85]-k[66]-k[67]); return k; }
// Abschreibung (linear, monatsgenau im Anschaffungsjahr; GWG bis 800 € netto sofort)
function finAfa(a,y){ const cost=+a.cost||0, life=Math.max(1,+a.life||1), sy=+String(a.date).slice(0,4), sm=+String(a.date).slice(5,7)||1; if(!cost||!sy||y<sy) return {afa:0,rest:cost};
  if(cost<=800) return {afa:y===sy?cost:0,rest:0}; const per=cost/life; let rest=cost;
  for(let yy=sy; yy<=y; yy++){ let x=yy===sy?per*(13-sm)/12:per; if(a.disposal&&+String(a.disposal).slice(0,4)<yy) x=0; x=Math.min(x,rest); rest=r2(rest-x); if(yy===y) return {afa:r2(x),rest}; } return {afa:0,rest}; }

function finJournal(from,to){ const J=[], soll=FCFG().ust!=='ist', inR=d=>d&&d>=from&&d<=to, bu=(rate,auto)=>auto?'':(+rate===19?'9':+rate===7?'8':'');
  arr('sales').filter(s=>isInv(s.type)&&s.nr).forEach(s=>{ const m=saleBy(s);
    if(inR(s.date)) Object.entries(m.by).forEach(([c,x])=>{ const acc=c==='19'?s.acc19||'8400':c==='7'?s.acc7||'8300':c==='0p'?s.acc0||'8338':c==='0r'?'8337':s.acc0||'8200'; J.push({d:s.date,beleg:s.nr,txt:SALE_T[s.type][0]+' '+((s.cust&&s.cust.name)||''),amt:r2(x.net+x.vat),konto:'1400',gegen:acc,bu:'',vat:x.vat}); });
    (s.paid||[]).forEach(p=>{ if(inR(p.d)) J.push({d:p.d,beleg:s.nr,txt:'Zahlung '+((s.cust&&s.cust.name)||''),amt:+p.amt,konto:p.acc==='Kasse'?'1000':'1200',gegen:'1400',bu:''}); }); });
  finAll().forEach(f=>{ const C=f.kind==='ausgabe'?FIN_CAT[f.cat]||FIN_CAT.sonst:FIN_INC[f.cat]||FIN_INC.sonst, geld=f.acc==='Kasse'?'1000':'1200', g=+f.gross||0;
    if(f.kind==='ausgabe'){ if(soll&&inR(f.date)) J.push({d:f.date,beleg:f.docNr||'',txt:(f.partner||'')+' '+(f.text||''),amt:g,konto:C[1],gegen:'1600',bu:f.rc?'94':bu(f.vatRate,C[2]),vat:+f.vat||0});
      if(f.paidDate&&inR(f.paidDate)) J.push(soll?{d:f.paidDate,beleg:f.docNr||'',txt:'Zahlung '+(f.partner||''),amt:g,konto:'1600',gegen:geld,bu:''}:{d:f.paidDate,beleg:f.docNr||'',txt:(f.partner||'')+' '+(f.text||''),amt:g,konto:C[1],gegen:geld,bu:f.rc?'94':bu(f.vatRate,C[2]),vat:+f.vat||0}); }
    if(f.kind==='einnahme'&&(f.paidDate||f.date)&&inR(f.paidDate||f.date)) J.push({d:f.paidDate||f.date,beleg:f.docNr||'',txt:(f.partner||'')+' '+(f.text||''),amt:g,konto:geld,gegen:C[1],bu:+f.vatRate===19&&!C[2]?'3':+f.vatRate===7&&!C[2]?'2':'',vat:+f.vat||0}); });
  const y=+from.slice(0,4); if(to>=y+'-12-31') arr('anlagen').forEach(a=>{ const x=finAfa(a,y); if(x.afa>0) J.push({d:y+'-12-31',beleg:'AfA',txt:'Abschreibung '+a.name,amt:x.afa,konto:'4830',gegen:(a.cat||'0420'),bu:''}); });
  return J.sort((a,b)=>String(a.d).localeCompare(String(b.d))); }

async function finCsvImport(file){ const txt=await file.text(), lines=txt.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return toast('Datei ist leer.');
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',', split=l=>{ const o=[]; let c='',q=false; for(const ch of l){ if(ch==='"'){ q=!q; continue; } if(ch===sep&&!q){ o.push(c); c=''; } else c+=ch; } o.push(c); return o.map(x=>x.trim()); };
  let hi=lines.findIndex(l=>/datum|date/i.test(l)&&/betrag|amount/i.test(l)); if(hi<0) hi=0; const H=split(lines[hi]).map(h=>h.toLowerCase()), col=rx=>H.findIndex(h=>rx.test(h));
  const cD=col(/buchungstag|buchungsdatum|^datum|date/), cA=col(/betrag|amount|umsatz/), cN=col(/empf|zahlungspflichtig|auftraggeber|name|counterparty|beg[üu]nstigt/), cT=col(/verwendung|zweck|reference|beschreibung|description|text/);
  if(cD<0||cA<0) return toast('Spalten „Datum“ und „Betrag“ nicht gefunden.');
  const num=s=>{ s=String(s||'').replace(/[^\d,.\-]/g,''); if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); return +s||0; }, dt=s=>{ const m=String(s).match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if(m) return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); const i=String(s).match(/(\d{4})-(\d{2})-(\d{2})/); return i?i[0]:''; };
  let n=0, auto=0, skip=0; const have=new Set(finAll().filter(f=>f.kind==='bank').map(f=>f.fp));
  for(const l of lines.slice(hi+1)){ const c=split(l), d=dt(c[cD]), amt=num(c[cA]); if(!d||!amt) continue; const name=cN>=0?c[cN]:'', ref=cT>=0?c[cT]:''; const fp='b|'+d+'|'+amt+'|'+ref.slice(0,60); if(have.has(fp)){ skip++; continue; }
    const f={id:uid(),kind:'bank',date:d,gross:r2(amt),partner:name,text:ref,acc:'Bank',fp,src:file.name}; const m=finAutoMatch(f); if(m){ f.match=m; auto++; } put('fin',f); have.add(fp); n++; }
  toast(n+' Bankumsätze importiert · '+auto+' automatisch zugeordnet'+(skip?' · '+skip+' schon vorhanden':'')); }

/* ========== Verkauf ↔ Projekt: Status, Tagesnotiz und To-Dos automatisch nachziehen ========== */
// Jede Änderung an einem Verkaufsbeleg läuft über salePut(). Gehört er zu einem Projekt, wird dort
//  1) der passende Statusschritt gesetzt, 2) ein Eintrag in die Tagesnotiz geschrieben und
//  3) geprüft, ob ein offenes To-Do damit erledigt ist (Rückfrage mit vorausgewählten Haken).
const SALE_MS={angebot:{versendet:3,angenommen:7},auftrag:{created:7},abschlag:{created:9,bezahlt:10},rechnung:{created:24,bezahlt:25}};
const SALE_TODO_RX={angebot:/angebot/i,auftrag:/auftrag|auftragsbest/i,lieferschein:/lieferschein|ausliefer/i,abschlag:/abschlag|anzahlung/i,rechnung:/rechnung|abrechn/i};
const TODO_SEND_RX=/schick|send|raus|versend|übermitt|zuschick/i;
const TODO_DO_RX=/erstell|schreib|schick|send|stell|mach|raus|fertig|vorbereit|ausstell|versend/i, TODO_PAY_RX=/bezahl|zahlung|eingang|überwies|ueberwies|offen|nachhak|mahn|erinner/i;
function salePut(v){ const prev=S.sales&&S.sales[v.id]?clone(S.sales[v.id]):null; put('sales',v); if(v.fromLs&&v.nr) v.fromLs.forEach(id=>{ const l=S.sales[id]; if(l&&!l.invoiced) put('sales',{...clone(l),invoiced:v.id,status:'erledigt'}); }); try{ saleEvents(prev,v); }catch(e){ console.warn(e); } }
function saleEvents(prev,v){ if(!v||!v.pid||!S.projects[v.pid]) return; const T=SALE_T[v.type][0], nr=v.nr||'', ev=[];
  const created=v.nr&&(!prev||!prev.nr), st=prev&&prev.status!==v.status?v.status:'', paidNew=(v.paid||[]).length>((prev&&prev.paid)||[]).length;
  const m=saleSums(v), amt=isInv(v.type)?m.pay:m.gross;
  if(created) ev.push({k:'created',txt:T+' '+nr+' erstellt'+(v.type==='lieferschein'?'':isInv(v.type)?' ('+euro(amt)+' brutto)':' (netto '+euro(m.net)+')')});
  if(st&&!created&&!['entwurf','offen'].includes(st)) ev.push({k:st,txt:T+' '+nr+': '+(SALE_ST[st]||[st])[0]});
  if(paidNew){ const p=v.paid[v.paid.length-1]; ev.push({k:'pay',txt:'Zahlung '+euro(p.amt)+' zu '+T+' '+nr+' eingegangen'+(v.status==='bezahlt'?' – vollständig bezahlt':', offen noch '+euro(m.open))}); }
  if(paidNew&&v.status==='bezahlt'&&!(prev&&prev.status==='bezahlt')) ev.push({k:'bezahlt',silent:1});
  if(!ev.length) return;
  // 1) Status + 2) Tagesnotiz in einem Schritt speichern
  const p=clone(S.projects[v.pid]), map=SALE_MS[v.type]||{}, msgs=[]; let steps=[];
  ev.forEach(e=>{ let n=map[e.k]; if(v.type==='abschlag'&&e.k==='created'&&(p.ms||{}).m9) n=22; if(v.type==='angebot'&&e.k==='created') n=0; if(n&&!(p.ms||{})['m'+n]){ const msg=applyMs(p,n,TODAY()); steps.push(PIPE[n-1]); if(msg) msgs.push(msg); } });
  const lines=ev.filter(e=>!e.silent).map(e=>e.txt); if(steps.length) lines.push('Status: '+steps.join(', '));
  if(lines.length){ p.notes=(p.notes?p.notes.replace(/\s+$/,'')+'\n':'')+nowStamp()+' ('+meK()+'): '+lines.join(' · '); delete p.now; delete p.nowD; }
  put('projects',p); if(steps.length) toast('Projekt „'+p.name.slice(0,30)+'“: '+steps.join(', ')+(msgs.length?' · '+msgs.join(' '):''));
  // 3) Offene To-Dos, die damit erledigt sein könnten
  const keys=ev.map(e=>e.k), rx=SALE_TODO_RX[v.type==='storno'?'rechnung':v.type];
  const todos=arr('tasks').filter(t=>t.pid===v.pid&&!t.done).filter(t=>{ const s=(t.title+' '+(t.notes||'')); const msN=steps.length&&t.ms&&steps.includes(PIPE[t.ms-1]);
    if(msN) return true; if(!rx||!rx.test(s)) return false; if(keys.includes('pay')||keys.includes('bezahlt')) return TODO_PAY_RX.test(s); if(v.type==='angebot'&&!keys.includes('versendet')&&TODO_SEND_RX.test(s)) return false; // Angebot schicken: erst beim Versenden
    return TODO_DO_RX.test(s)&&!TODO_PAY_RX.test(s); });
  if(todos.length) setTimeout(()=>saleTodoAsk(v,todos,lines[0]||T+' '+nr),SHEET?900:200); }
function saleTodoAsk(v,todos,why){ const go=()=>{ if(SHEET){ setTimeout(go,800); return; }
  openSheet({title:'To-Do damit erledigt?',html:`<div class="fld full"><div class="small muted" style="margin-bottom:8px">${esc(why)} – im Projekt „${esc(projName(v.pid))}“ sind diese To-Dos noch offen:</div>${todos.map((t,i)=>`<label class="mt-opt" style="padding:4px 0"><input type="checkbox" class="ck" id="std_${i}" checked><span><b>${esc(t.title)}</b>${t.who?` <span class="small muted">· ${esc(shortWho(t.who))}</span>`:''}</span></label>`).join('')}<div class="small muted" style="margin-top:6px">Abgehakte To-Dos werden als erledigt markiert, mit Vermerk in der Tagesnotiz.</div></div>`,saveLabel:'Als erledigt markieren',
    onSave:()=>{ const done=todos.filter((t,i)=>$('#std_'+i).checked); if(!done.length) return; const note=why;
      done.forEach(t=>put('tasks',{...clone(S.tasks[t.id]||t),done:true,doneAt:new Date().toISOString(),doneBy:meK(),doneNote:'erledigt durch: '+note}));
      const p=clone(S.projects[v.pid]); if(p){ p.notes=(p.notes?p.notes.replace(/\s+$/,'')+'\n':'')+nowStamp()+' ('+meK()+'): ✓ Erledigt: '+done.map(t=>t.title).join(', ')+' – '+note; put('projects',p); }
      toast(done.length+' To-Do'+(done.length>1?'s':'')+' erledigt.'); }}); };
  go(); }

/* ========== Neue To-Dos immer gegen bestehende prüfen (Formular, Notizfeld, Sprache, KI-Chat, Meeting, Belege – auch am Handy) ========== */
// put() meldet jedes neu angelegte To-Do hier an. Nach kurzer Sammelpause (mehrere auf einmal) werden alle geprüft:
// erst per Stichwort-Abgleich (findRelated), mit KI zusätzlich nach Sinn. Gibt es Bezug, kommt EIN Fenster mit Vorschlag je To-Do.
let REL_Q=[], REL_T=null;
function relQueue(id){ REL_Q.push(id); clearTimeout(REL_T); REL_T=setTimeout(relRun,1500); }
async function relRun(){ const ids=[...new Set(REL_Q)]; REL_Q=[]; const news=ids.map(id=>S.tasks[id]).filter(t=>t&&!t.done); if(!news.length) return; const found=[];
  for(const t of news){ const kw=findRelated({id:t.id,title:t.title+' '+(t.notes||''),projectId:t.pid}); if(kw&&kw.strong&&S.tasks[kw.id]) found.push({t,x:S.tasks[kw.id],why:'ähnliche Begriffe',how:'update'}); }
  if(SAMPLE){ const rest=news.filter(t=>!found.some(f=>f.t.id===t.id)); if(rest.length) try{
      const pool=arr('tasks').filter(x=>!x.done&&!news.some(n=>n.id===x.id)&&(rest.some(t=>t.pid&&x.pid===t.pid)||!x.pid||rest.some(t=>!t.pid))).sort((a,b)=>String(b.upd||b.at||'').localeCompare(String(a.upd||a.at||''))).slice(0,80);
      if(pool.length){ const r=await SAMPLE.json(`In einer Projekt-App (Solar-Installationsbetrieb) wurden gerade neue To-Dos angelegt. Prüfe für jedes, ob es inhaltlich zu einem BESTEHENDEN offenen To-Do gehört (gleiche Sache, Fortschritt, Ergebnis, Doppelung). Nur bei klarem Bezug – im Zweifel nicht.

  if(!SRec) return toast('Dieser Browser kann nicht mitschreiben – bitte Chrome oder Edge verwenden.'); if(MEET_ON) return toast('Während einer Meeting-Mitschrift ist das Mikrofon belegt.');
  let fin='';
  const r=new SRec(); r.lang='de-DE'; r.continuous=true; r.interimResults=true; SV_REC=r;
  r.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i]; if(res.isFinal) fin+=(fin?' ':'')+res[0].transcript.trim(); else interim+=res[0].transcript; }
    const ta=$('#sv_tx'); if(!ta){ SV_REC=null; try{ r.stop(); }catch(e){} return; } const all=(fin+(interim?' '+interim:'')).trim();
    if(DICT_END.test(all)){ if(!ta.dataset.edited) ta.value=all.replace(DICT_END,''); const b=document.querySelector('#scrim button[type=submit]'); if(b) b.click(); return; } // „Fertig“ = abschicken
    if(!ta.dataset.edited) ta.value=all; };
  r.onerror=e=>{ if(['not-allowed','service-not-allowed'].includes(e.error)) toast('Kein Zugriff aufs Mikrofon – bitte im Browser erlauben.'); };
  r.onend=()=>{ if(SV_REC!==r) return; if(!$('#sv_tx')){ SV_REC=null; return; } try{ r.start(); }catch(e){} }; // Fenster zu → Mikrofon aus
  const stop=()=>{ const x=SV_REC; SV_REC=null; try{ x&&x.stop(); }catch(e){} };
  openSheet({title:'🎙 Sprich einfach drauflos',wide:1,html:`<div class="fld full"><div class="sv-rec"><span class="rec-dot"></span><span class="small">Mikrofon ist an – z. B. „Bei Apollo muss MK bis Freitag Stork anrufen, und für Heimatblick brauchen wir noch 300 Meter Solarkabel.“</span></div>
    <textarea id="sv_tx" class="inp" rows="6" style="width:100%;margin-top:8px" placeholder="Hier erscheint, was du sagst – du kannst es auch korrigieren." oninput="this.dataset.edited=1"></textarea></div>`,saveLabel:'Fertig – zuordnen',
    onSave:()=>{ const t=($('#sv_tx').value||'').trim(); stop(); if(t.length<3){ toast('Es wurde nichts erkannt.'); return; } setTimeout(()=>smartDrop([],t),60); }});
  const cl=()=>stop(); setTimeout(()=>{ const sc=$('#scrim'); if(sc) sc.querySelectorAll('[data-act=closeSheet]').forEach(b=>b.addEventListener('click',cl)); },50);
  try{ r.start(); }catch(e){ SV_REC=null; toast('Mikrofon konnte nicht gestartet werden.'); }
}

/* ========== Diktieren in jedes Textfeld: Mikrofon-Knopf am aktiven Feld, Claude macht den Text sauber ========== */
// Ein schwebender Knopf folgt dem Feld mit Fokus (statt in jedes Formular einen eigenen einzubauen).
const VOICE_OK=t=>t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&['text','search',''].includes((t.getAttribute('type')||'').toLowerCase())))&&!t.readOnly&&!t.disabled&&t.id!=='mt_tx'&&t.id!=='gSearch'&&t.id!=='sv_tx'&&t.id!=='aic_tx';
let VOICE_EL=null, VOICE_REC=null, VOICE_BUF='', VOICE_BASE='', VOICE_POS=0;
const voiceBtn=(()=>{ const b=document.createElement('button'); b.type='button'; b.className='vm-btn'; b.title='Diktieren (Mikrofon)'; b.setAttribute('aria-label','Diktieren'); b.textContent='🎙'; b.hidden=true; document.body.appendChild(b); return b; })();
function voicePlace(){ const t=VOICE_EL; if(!t||!document.body.contains(t)||!SRec){ if(!VOICE_REC) voiceBtn.hidden=true; return; }
  const r=t.getBoundingClientRect(); if(!r.width||r.bottom<0||r.top>innerHeight){ voiceBtn.hidden=true; return; }
  voiceBtn.hidden=false; const tall=t.tagName==='TEXTAREA'&&r.height>48; voiceBtn.style.top=(tall?r.bottom-34:r.top+(r.height-28)/2)+'px'; voiceBtn.style.left=(r.right-34)+'px'; }
// Nur zeigen, wenn die Person selbst ins Feld geklickt/getippt hat – nicht, wenn die App den Cursor nach dem Neuzeichnen zurücksetzt
let VOICE_USER=0; document.addEventListener('pointerdown',()=>{ VOICE_USER=Date.now(); },true); document.addEventListener('keydown',e=>{ if(e.key==='Tab') VOICE_USER=Date.now(); },true);
document.addEventListener('focusin',e=>{ if(VOICE_REC) return; if(VOICE_OK(e.target)&&Date.now()-VOICE_USER<800){ VOICE_EL=e.target; voicePlace(); } else if(e.target!==voiceBtn&&!(VOICE_OK(e.target)&&!voiceBtn.hidden)){ VOICE_EL=null; voiceBtn.hidden=true; } });
document.addEventListener('focusout',e=>{ setTimeout(()=>{ if(!VOICE_REC&&document.activeElement!==VOICE_EL&&document.activeElement!==voiceBtn){ voiceBtn.hidden=true; } },150); });
window.addEventListener('scroll',()=>voicePlace(),true); window.addEventListener('resize',()=>voicePlace());
// Nach dem Neuzeichnen: Knopf nur am tatsächlich aktiven Textfeld, sonst ausblenden (kein „hängender“ Knopf)
function voiceAfterRender(){ try{ if(VOICE_REC) return; const a=document.activeElement, wasShown=!voiceBtn.hidden;
  if(wasShown&&VOICE_OK(a)){ VOICE_EL=a; voicePlace(); } else { VOICE_EL=null; voiceBtn.hidden=true; } }catch(e){} } // vor dem Laden des Diktat-Codes: nichts tun
setInterval(()=>{ if(typeof voiceBtn==='undefined'||VOICE_REC||voiceBtn.hidden) return; const a=document.activeElement; if(!VOICE_EL||!document.body.contains(VOICE_EL)||a!==VOICE_EL) voiceAfterRender(); },800);
voiceBtn.addEventListener('mousedown',e=>e.preventDefault()); // Fokus im Feld lassen
voiceBtn.addEventListener('click',()=>{ VOICE_REC?voiceStop():voiceStart(); });
function voiceLabel(t){ const f=t.closest('.fld,.info-f,label'); const l=f&&f.querySelector('label,span,.eyebrow'); return ((l&&l.textContent)||t.getAttribute('aria-label')||t.placeholder||'Text').trim().slice(0,80); }
function voiceStart(){
  const t=VOICE_EL; if(!t||!SRec) return; if(MEET_ON) return toast('Während einer Meeting-Mitschrift ist das Mikrofon belegt.');
  const r=new SRec(); r.lang='de-DE'; r.continuous=true; r.interimResults=true; VOICE_REC=r; VOICE_BUF='';
  VOICE_BASE=t.value; VOICE_POS=typeof t.selectionStart==='number'?t.selectionStart:t.value.length;
  r.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i]; if(res.isFinal) VOICE_BUF+=(VOICE_BUF?' ':'')+res[0].transcript.trim(); else interim+=res[0].transcript; }
    const live=(VOICE_BUF+(interim?' '+interim:'')).trim();
    if(DICT_END.test(live)){ VOICE_BUF=live.replace(DICT_END,''); t.value=voiceJoin(VOICE_BASE,VOICE_POS,VOICE_BUF); voiceStop(); return; } // „Fertig“ beendet das Diktat
    t.value=voiceJoin(VOICE_BASE,VOICE_POS,live); voicePlace(); };
  r.onerror=e=>{ if(['not-allowed','service-not-allowed'].includes(e.error)){ toast('Kein Zugriff aufs Mikrofon – bitte im Browser erlauben.'); voiceStop(); } };
  r.onend=()=>{ if(VOICE_REC===r){ try{ r.start(); }catch(e){ voiceStop(); } } }; // Pause ≠ Ende: weiter zuhören bis ■ oder „Fertig“
  try{ r.start(); }catch(e){ VOICE_REC=null; return toast('Mikrofon konnte nicht gestartet werden.'); }
  voiceBtn.classList.add('on'); voiceBtn.textContent='■'; voiceBtn.title='Diktat beenden'; toast('Sprich jetzt – zum Beenden „Fertig“ sagen oder ■ tippen.');
}
const voiceJoin=(base,pos,ins)=>{ if(!ins) return base; const a=base.slice(0,pos), b=base.slice(pos); return a+(a&&!/\s$/.test(a)?' ':'')+ins+(b&&!/^\s/.test(b)?' ':'')+b; };
async function voiceStop(){
  const r=VOICE_REC, t=VOICE_EL; VOICE_REC=null; try{ r&&r.stop(); }catch(e){} voiceBtn.classList.remove('on'); voiceBtn.textContent='🎙'; voiceBtn.title='Diktieren (Mikrofon)';
  const raw=VOICE_BUF.trim(); if(!t) return; if(!raw){ t.value=VOICE_BASE; return; }
  let out=fixNames(raw);
  if(SAMPLE){ voiceBtn.textContent='…'; t.classList.add('vm-busy');
    const single=t.tagName!=='TEXTAREA';
    try{ const res=await SAMPLE(`Diktierte Spracheingabe für das Feld „${voiceLabel(t)}“ in der Projekt-App eines Solar-Installationsbetriebs (nutz die Sonne GmbH: PV-Anlagen, Speicher, Ladesäulen, Netzbetreiber wie Westnetz, Begriffe wie Wechselrichter, kWp, Zählerschrank, DC/AC, Inbetriebnahme, MaStR).
Namen genau so schreiben wie in der Mitarbeiterliste (z. B. Marc immer mit c). Mitarbeiter-Kürzel: ${staff().map(s=>shortWho(s.name)+' = '+s.name.replace(/\s*\([^)]*\)$/,'')).join(', ')}. Projekte: ${arr('projects').filter(p=>['laufend','planung'].includes(catOf(p))).map(p=>p.name).slice(0,60).join('; ')}.
Rohtext (Spracherkennung, ohne Satzzeichen, evtl. Hörfehler): """${raw.slice(0,4000)}"""
Mach daraus sauberen, sinnvollen Text: Satzzeichen und Groß-/Kleinschreibung, offensichtliche Hörfehler und Fachbegriffe/Namen/Projekte korrigieren, Füllwörter („äh“, „also“) weg, Zahlen, Daten und Uhrzeiten als Ziffern, Mitarbeiter als Kürzel wenn genannt. Nichts dazuerfinden, Inhalt nicht weglassen.${single?' Es ist ein einzeiliges Feld: kurz und knapp, eine Zeile.':' Mehrere Gedanken gern als kurze Sätze oder Stichpunkte.'} Antworte nur mit dem fertigen Text.`,{modelTier:'quick',cache:false});
      const c=fixNames(String(res&&res.text||'').trim().replace(/^["„]|["“]$/g,'')); if(c) out=c; }
    catch(e){} t.classList.remove('vm-busy'); voiceBtn.textContent='🎙'; }
  if(t.tagName!=='TEXTAREA') out=out.replace(/\s*\n+\s*/g,' ');
  t.value=voiceJoin(VOICE_BASE,VOICE_POS,out); const end=VOICE_POS+(t.value.length-VOICE_BASE.length);
  try{ t.focus(); t.setSelectionRange(end,end); }catch(e){}
  t.dispatchEvent(new Event('input',{bubbles:true})); t.dispatchEvent(new Event('change',{bubbles:true}));
  VOICE_EL=t; voicePlace();
}

/* ========== Projekt-Tagebuch: eine Notiz pro Tag, fortlaufend wie in der Excel ========== */
// Der Text bleibt in p.notes / p.updates. Dazu kommen automatisch die To-Dos des Projekts an ihrem Tag (neu angelegt, Updates, erledigt).
//   p.noteLinks[taskId]='JJJJ-MM-TT'  To-Do per Ziehen mit der Tages-Notiz verknüpft → erscheint dort mit allen Updates
//   p.dayHeads[tag]={t,h}             Überschrift von Claude (h = Prüfsumme des Tagesinhalts; ändert sich der Tag, kommt eine neue)
const dIso=s=>{ const m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/); if(!m) return ''; const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):TODAY().slice(0,4); return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); };
const tmOfIso=a=>{ if(String(a||'').length<=10) return ''; const x=new Date(a); return isNaN(x)?'':String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0'); };
function diaryDays(p){
  const days={}, day=d=>(days[d]=days[d]||{d,items:[],links:[]}), add=(d,e)=>day(d).items.push(e);
  ['notes','updates'].forEach(k=>noteBlocks(p[k]).forEach((b,i)=>{ const np=noteParts(b); if(np.text) add(dIso(np.d),{kind:'note',k,i,tm:np.tm,by:np.by,text:np.text}); }));
  arr('tasks').filter(t=>t.pid===p.id).forEach(t=>{
    const cd=t.created||String(t.at||'').slice(0,10);
    if(cd) add(cd,{kind:'new',task:t,tm:String(t.at||'').slice(0,10)===cd?tmOfIso(t.at):'',by:t.by||''});
    (t.upd2||[]).forEach(u=>{ if(u.d) add(u.d,{kind:'upd',task:t,tm:updTime(u),by:u.by||'',text:u.t}); });
    // Abhaken über das Projekt schreibt schon eine Notiz – dann nicht doppelt
    if(t.done&&t.doneAt){ const dd=String(t.doneAt).slice(0,10); if(!(days[dd]?days[dd].items:[]).some(e=>e.kind==='note'&&e.text.includes(t.title))) add(dd,{kind:'done',task:t,tm:tmOfIso(t.doneAt),by:t.doneBy||'',text:t.doneNote||''}); }
  });
  Object.entries(p.noteLinks||{}).forEach(([id,d])=>{ const t=S.tasks[id]; if(t&&d) day(d).links.push(t); });
  const out=Object.values(days); out.forEach(x=>x.items.sort((a,b)=>(a.tm||'').localeCompare(b.tm||'')));
  return out.sort((a,b)=>!a.d?1:!b.d?-1:b.d.localeCompare(a.d));
}
const dyDate=d=>{ if(!d) return 'Ohne Datum'; const x=new Date(d+'T12:00'); return WD[x.getDay()]+' '+d.slice(8)+'.'+d.slice(5,7)+'.'+d.slice(2,4); };
const dyPlain=e=>e.kind==='note'?shortMailRefs(e.text):e.kind==='new'?'Neues To-Do: '+e.task.title:e.kind==='upd'?'Update zu „'+e.task.title+'“: '+e.text:'Erledigt: '+e.task.title+(e.text?' – '+e.text:'');
const dyHash=x=>strHash(x.items.map(dyPlain).join('|'));
// als Text-Link (ein <button> bricht nicht wie Fließtext um)

// Ab diesem Tag: oben die KI-Zusammenfassung des Tages, Notiz + To-Dos + Updates darunter zum Aufklappen (ältere Tage bleiben wie sie sind)
const DY_SUM_FROM='2026-10-28';
function dyCard(p,x,adm){
  const hd=(p.dayHeads||{})[x.d], notes=x.items.filter(e=>e.kind==='note'), tk=x.items.filter(e=>e.kind!=='note'), k='t'+p.id+x.d;
  const n=c=>tk.filter(e=>e.kind===c).length, sum=[n('new')?n('new')+' neu':'',n('upd')?n('upd')+' Update'+(n('upd')>1?'s':''):'',n('done')?n('done')+' erledigt':''].filter(Boolean).join(' · ');
  const head=`<div class="dy-h"><span class="dy-d">${esc(dyDate(x.d))}</span>${hd&&hd.t?`<b>${esc(hd.t)}</b>`:''}</div>`, drop=x.d?`data-drop-note="${x.d}" data-pid="${p.id}"`:'';
  if(x.d>=DY_SUM_FROM){
    const kd='d'+p.id+x.d, cnt=[notes.length?notes.length+' Notiz'+(notes.length>1?'en':''):'',sum?'To-Dos: '+sum:'',x.links.length?x.links.length+' verknüpft':''].filter(Boolean).join(' · ');
    const s=hd&&hd.s||''; // bis die neue Fassung da ist, bleibt die letzte stehen
    // Status: Rädchen = KI arbeitet, grüner Haken = fertig; ✎ = selbst bearbeiten, ✨ = KI fasst den Tag neu zusammen
    const busy=!!(DY_BUSY&&DY_BUSY.has(p.id+'|'+x.d)), st=`<span class="dy-st">${busy?'<span class="dy-spin" title="KI erstellt die Zusammenfassung …"></span>':s?`<span class="dy-ok" title="${hd.man?'Von Hand bearbeitet':'KI-Zusammenfassung fertig'}">✓</span>${hd.man?'<span class="small muted">bearbeitet</span>':''}`:''}
      <button type="button" class="icon-btn" title="Zusammenfassung selbst bearbeiten" data-act="dySumEdit" data-pid="${p.id}" data-d="${x.d}">${ic('edit')}</button>${SAMPLE?`<button type="button" class="icon-btn dy-ai" title="KI: Tag neu zusammenfassen" data-act="dySumAi" data-pid="${p.id}" data-d="${x.d}" ${busy?'disabled':''}>✨</button>`:''}</span>`;
    return `<div class="nb dy" ${drop}>${head.replace(/<\/div>$/,st+'</div>')}
      <div class="dy-sum">${s?aicMd(s):`<span class="muted">${busy?'Zusammenfassung wird erstellt …':esc(x.items.map(dyPlain).join(' · ').slice(0,220))}</span>`}</div>
      <div class="dy-tk">${dyTog(kd,'Details: '+cnt)}${dyIsOpen(kd)?`<div class="dy-list" style="margin-top:6px">${x.items.map(e=>dyItem(p,e,adm)).join('')}</div>${x.links.map(t=>dyLink(p,t,x.d)).join('')}`:''}</div></div>`;
  }
  const ed=x.d?`<span class="dy-st"><button type="button" class="icon-btn" title="Datum / Überschrift bearbeiten" data-act="dySumEdit" data-pid="${p.id}" data-d="${x.d}">${ic('edit')}</button></span>`:'';
  return `<div class="nb dy" ${drop}>${head.replace(/<\/div>$/,ed+'</div>')}
    ${notes.length?`<div class="dy-list">${notes.map(e=>dyItem(p,e,adm)).join('')}</div>`:''}
    ${tk.length?`<div class="dy-tk">${dyTog(k,'To-Dos: '+sum)}${dyIsOpen(k)?`<div class="dy-list" style="margin-top:4px">${tk.map(e=>dyItem(p,e,adm)).join('')}</div>`:''}</div>`:''}
    ${x.links.map(t=>dyLink(p,t,x.d)).join('')}</div>`;
}
function projVerlauf(p,adm){
  if(SAMPLE) setTimeout(()=>diaryHeads(p.id),400);
  const days=diaryDays(p), top=days.slice(0,5), rest=days.slice(5);
  return `<div class="nb-list">${top.map(x=>dyCard(p,x,adm)).join('')||'<div class="empty">Noch keine Notizen.</div>'}</div>
    ${rest.length||p.questions||p.scope?`<details class="nb-more" ${UI.nbAll?'open':''} data-nball="1"><summary>${rest.length?`Ältere Notizen (${rest.length} Tage)`:'Weitere Einträge'}${p.questions?' · offene Fragen':''}${p.scope?' · Auftrag':''} anzeigen</summary>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px"><div class="nb-list">${rest.map(x=>dyCard(p,x,adm)).join('')}</div>
      ${p.questions?`<div><div class="eyebrow nb-eb"><span>Zu klärende Fragen</span></div><div class="longtext">${esc(p.questions)}</div></div>`:''}${p.scope?`<div><div class="eyebrow nb-eb"><span>Auftrag Inhalt</span></div><div class="longtext">${esc(p.scope)}</div></div>`:''}</div></details>`:''}`;

// Claude: kurze Überschrift je Tag (im Hintergrund, ohne Sonne)
var DY_RUN={}, DY_TRIED={}, DY_BUSY=new Set(); // var: wird schon beim ersten Zeichnen gelesen; DY_BUSY = Tage, die gerade zusammengefasst werden
const DY_SUM_V=2; // Version der Zusammenfassung: höher setzen → neue Tage werden neu zusammengefasst
async function diaryHeads(pid,forceD){
  const p=S.projects[pid]; if(!p||!SAMPLE||DY_RUN[pid]) return; const hd=p.dayHeads||{};
  if(forceD){ const x=diaryDays(p).find(y=>y.d===forceD); if(x&&x.items.length) return diaryRun(p,[{x,h:dyHash(x)}]); return; }
  // neue Tage (mit Zusammenfassung) zuerst und allein – kleine Anfrage, schnelle Antwort; alte Überschriften danach.
  // Von Hand bearbeitete Tage (man) fasst die KI nur auf Knopfdruck (✨) neu zusammen.
  const need=diaryDays(p).filter(x=>x.d&&x.items.length).map(x=>({x,h:dyHash(x)})).filter(({x,h})=>{ const o=hd[x.d]||{}; return !o.man&&(o.h!==h||(x.d>=DY_SUM_FROM&&(!o.s||(o.v||1)<DY_SUM_V)))&&!DY_TRIED[pid+x.d+h+DY_SUM_V]; });
  const fresh=need.filter(({x})=>x.d>=DY_SUM_FROM), todo=fresh.length?fresh.slice(0,3):need.slice(0,20); if(!todo.length) return;
  todo.forEach(({x,h})=>DY_TRIED[pid+x.d+h+DY_SUM_V]=1);
  return diaryRun(p,todo);
}
async function diaryRun(p,todo){
  const pid=p.id; DY_RUN[pid]=true;
  const wantS=todo.some(({x})=>x.d>=DY_SUM_FROM); if(wantS){ todo.forEach(({x})=>{ if(x.d>=DY_SUM_FROM) DY_BUSY.add(pid+'|'+x.d); }); scheduleRender(); }
  // Inhalt des Tages vollständig: Notizen ganz, To-Dos mit allen Updates des Tages
  const dayText=x=>x.items.map(e=>(e.tm?e.tm+' ':'')+(e.by?e.by+': ':'')+dyPlain(e)).join('\n').slice(0,wantS?6000:1500);
  try{ const r=await SAMPLE.json(`Projekt „${p.name}“ eines Solar-Installationsbetriebs (PV-Anlagen, Speicher, Netzanschluss). Tagebuch je Tag (Notizen, neue To-Dos, To-Do-Updates, Erledigtes):
${todo.map(({x},i)=>`### ${i+1}. Tag ${x.d}${x.d>=DY_SUM_FROM?' [S]':''}\n${dayText(x)}`).join('\n\n')}

Gib jedem Tag eine kurze Überschrift h (2–6 Wörter, keine Personennamen, kein Datum), z. B. „Zählerschrank verdrahtet, Kran geklärt“.${wantS?`
Für Tage mit [S] zusätzlich eine Tageszusammenfassung s – präzise und VOLLSTÄNDIG im Inhalt, knapp in der Form:
- Alle Erkenntnisse und neuen Fakten des Tages (z. B. wer Eigentümer/Ansprechpartner ist, Zusagen, Absagen, Termine, Fristen, Zahlen, technische Ergebnisse, Entscheidungen, Probleme) – nichts Wichtiges weglassen.
- Danach, was offen ist / als Nächstes kommt und wer (Kürzel) dran ist.
- Form: 2–5 kurze Sätze oder Stichpunkte mit „- “, keine Füllwörter, Namen/Firmen/Zahlen/Daten exakt übernehmen, nichts erfinden, Überschrift nicht wiederholen.`:''}
Antworte nur mit JSON in derselben Reihenfolge: {"items":[{"h":"…"${wantS?',"s":"… (nur bei [S], sonst leer)"':''}}]}`,{modelTier:wantS?'default':'quick',bg:true});
    const cur=S.projects[pid]; if(!cur) return; const nh={...(cur.dayHeads||{})};
    (r&&Array.isArray(r.items)?r.items:[]).forEach((o,i)=>{ const it=todo[i]; if(!it||!o) return; const t=String(o.h||'').trim(), s=String(o.s||'').trim();
      if(t||s) nh[it.x.d]={t:(t||(nh[it.x.d]||{}).t||'').slice(0,70),h:it.h,...(it.x.d>=DY_SUM_FROM&&s?{s:s.slice(0,900),v:DY_SUM_V}:{})}; });
    cur.dayHeads=nh; if(MODE==='cloud'&&DB&&mayWrite('projects')) DB.collection('projects').doc(pid).update({dayHeads:nh}).catch(()=>{}); }
  catch(e){ if(wantS) toast('Zusammenfassung konnte gerade nicht erstellt werden – mit ✨ nochmal versuchen.'); }
  finally{ DY_RUN[pid]=false; todo.forEach(({x})=>DY_BUSY.delete(pid+'|'+x.d)); scheduleRender(); }
}
// ✎ Zusammenfassung selbst schreiben/ändern (bleibt dann stehen, bis ✨ gedrückt wird) · ✨ KI fasst den Tag neu zusammen
Object.assign(A,{
 // ✎ Tag bearbeiten: Datum (verschiebt die Notiz-Einträge dieses Tages), Überschrift und – ab DY_SUM_FROM – Zusammenfassung
 dySumEdit:d=>{ const p=S.projects[d.pid]; if(!p||!d.d) return; const o=(p.dayHeads||{})[d.d]||{}, x=diaryDays(p).find(y=>y.d===d.d), sumOn=d.d>=DY_SUM_FROM||!!o.s;
   const nNotes=x?x.items.filter(e=>e.kind==='note').length:0;
   openSheet({title:'Notiz vom '+dyDate(d.d)+' bearbeiten',wide:1,fields:[
     {k:'date',label:'Datum der Notiz',type:'date',req:1},{k:'t',label:'Überschrift',full:1},
     ...(sumOn?[{k:'s',label:'Zusammenfassung des Tages',type:'textarea',full:1,ph:'Stichpunkte mit „- “ am Zeilenanfang werden als Liste angezeigt'}]:[]),
     {k:'hint',label:'',type:'html',html:`<div class="small muted">Ein anderes Datum verschiebt ${nNotes===1?'den Notiz-Eintrag':'alle '+nNotes+' Notiz-Einträge'} dieses Tages (z. B. bei Fehlern aus der Excel-Übertragung). To-Dos und Updates behalten ihr eigenes Datum.</div>`}],
     value:{date:d.d,t:o.t||'',s:o.s||''},saveLabel:'Speichern',
     onSave:v=>{ const nd=/^\d{4}-\d{2}-\d{2}$/.test(v.date||'')?v.date:d.d, tok=nd.slice(8)+'.'+nd.slice(5,7)+'.'+nd.slice(2,4);
       vlSet(d.pid,pp=>{
         if(nd!==d.d){ ['notes','updates'].forEach(k=>{ if(!pp[k]) return; pp[k]=noteBlocks(pp[k]).map(b=>dIso(noteParts(b).d)===d.d?b.replace(/^\s*\d{1,2}\.\d{1,2}\.(?:\d{2,4})?/,tok):b).join('\n'); });
           const L={...(pp.noteLinks||{})}; Object.keys(L).forEach(id=>{ if(L[id]===d.d) L[id]=nd; }); pp.noteLinks=L; }
         const heads={...(pp.dayHeads||{})}; delete heads[d.d]; const tgt=heads[nd]||{};
         heads[nd]={...tgt,...o,t:String(v.t||'').trim().slice(0,70)||tgt.t||'',...(sumOn?{s:fixNames(String(v.s||'').trim()).slice(0,1500),v:DY_SUM_V}:{}),man:true};
         pp.dayHeads=heads; const xx=diaryDays(pp).find(y=>y.d===nd); if(xx) heads[nd].h=dyHash(xx); },nd!==d.d?'Notiz auf '+dyDate(nd)+' verschoben.':'Gespeichert.'); }}); }, dySumAi:d=>{ const p=S.projects[d.pid]; if(!p||!SAMPLE) return; if(DY_RUN[d.pid]) return toast('Die KI arbeitet gerade – gleich nochmal versuchen.');
   const o=(p.dayHeads||{})[d.d]; if(o&&o.man){ const nh={...p.dayHeads,[d.d]:{...o,man:false}}; p.dayHeads=nh; }
   diaryHeads(d.pid,d.d); },
});
function vlSet(pid,fn,msg){ const p=clone(S.projects[pid]); if(!p) return; fn(p); put('projects',p); if(msg) toast(msg); }
// To-Do auf eine Tages-Notiz gezogen → verknüpfen
function linkTaskNote(pid,id,d){ const t=S.tasks[id]; if(!t||!S.projects[pid]) return; vlSet(pid,p=>{ p.noteLinks={...(p.noteLinks||{}),[id]:d}; },'„'+t.title.slice(0,40)+'“ mit der Notiz vom '+dyDate(d)+' verknüpft.'); }
Object.assign(A,{
 dyToggle:d=>{ UI.dyOpen={...(UI.dyOpen||{}),[d.k]:!(UI.dyOpen||{})[d.k]}; render(); },
 dyUnlink:d=>vlSet(d.pid,p=>{ const l={...(p.noteLinks||{})}; delete l[d.id]; p.noteLinks=l; },'Verknüpfung gelöst.'),
});

document.addEventListener('click',e=>{ if(e.target.closest&&e.target.closest('.tu-inl')) e.stopPropagation(); },true);
Object.assign(CHG,{ qnMode:(d,el)=>{ UI.qnMode={...(UI.qnMode||{}),[d.pid]:el.value}; render(); }, prioSelCls:(d,el)=>{ el.className='inp prio-sel p-'+el.value; }, mtAllP:(d,el)=>{ if(el.value==='__keep') return; document.querySelectorAll('#mt_list .mt-p').forEach(s=>{ s.value=el.value; s.classList.toggle('none',!el.value); }); }, mtRowP:(d,el)=>el.classList.toggle('none',!el.value), todoSort:(d,el)=>{ UI.todoSort=el.value; saveUI(); render(); } });

 rdCat:d=>{ UI.rdCat=d.v; saveUI(); render(); },

 bulkTodo:()=>bulkTodoSheet(),

document.addEventListener('change',e=>{ if(e.target.id==='mtIn'){ const fl=[...(e.target.files||[])]; if(fl.length) mailToTodos(fl,''); } });

document.addEventListener('drop',e=>{ const z=e.target.closest&&e.target.closest('.mtdrop'); if(!z) return; e.preventDefault(); e.stopImmediatePropagation(); z.classList.remove('over'); mailToTodos(e.dataTransfer.files,e.dataTransfer.getData('text/plain')); },true);
document.addEventListener('paste',e=>{ if(UI.view!=='todos'||SHEET) return; const tg=e.target; if(tg&&(tg.tagName==='TEXTAREA'||tg.tagName==='INPUT')) return;
  const files=[...(e.clipboardData.files||[])], text=e.clipboardData.getData('text/plain')||''; if(!files.length&&text.trim().length<30) return; e.preventDefault(); e.stopImmediatePropagation(); mailToTodos(files,text); },true);

// Handy: im Projekt nach links/rechts wischen = nächstes/voriges Projekt (wie die Pfeile am Desktop)
(()=>{ let x0=0,y0=0,t0=0,ok=false; const NO='input,textarea,select,[contenteditable],.rail,.tbl-wrap,.chips,.sl-items,.dcols,.board,.hscroll,.sheet,#scrim,.aic,.side';
  document.addEventListener('touchstart',e=>{ ok=false; if(UI.view!=='project'||innerWidth>900||e.touches.length!==1||SHEET||document.body.classList.contains('nav-open')) return; if(e.target.closest&&e.target.closest(NO)) return;
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); ok=x0>16&&x0<innerWidth-16; },{passive:true}); // Ränder frei lassen (Zurück-Geste des Handys)
  document.addEventListener('touchend',e=>{ if(!ok) return; ok=false; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8||Date.now()-t0>700) return;
    const b=document.querySelector(dx<0?'.big-nav.r':'.big-nav.l'); if(!b||b.disabled||!b.dataset.id) return toast(dx<0?'Das ist das letzte Projekt.':'Das ist das erste Projekt.');
    const v=$('#view'); if(v){ v.classList.add(dx<0?'swipe-out-l':'swipe-out-r'); setTimeout(()=>{ v.classList.remove('swipe-out-l','swipe-out-r'); b.click(); },150); } else b.click(); },{passive:true}); })();

  const a=e.target.closest('[data-act]');
  if(a&&document.body.classList.contains('nav-open')&&a.closest('#side')&&!['navGrp','navToggle','navPin'].includes(a.dataset.act)) navDrawer(false);

  if(!['newMenu','moreMenu','newHide','newUnhide','newHidTg'].includes(a.dataset.act)) closeMenu();

document.addEventListener('change',e=>{ const a=e.target.closest('[data-chg]'); if(a&&CHG[a.dataset.chg]) CHG[a.dataset.chg]({...a.dataset},a,e); });
