const prPage=(title,sub,body,landscape)=>`<div class="pr-doc ${landscape?'pr-land':''}"><div class="pr-head"><div><div class="pr-brand"><span>NUTZ DIE</span> SONNE</div><div class="pr-sub">nutz die Sonne GmbH</div></div><div class="pr-title">${esc(title)}<div class="pr-date">${esc(sub||'')}</div></div></div>${body}<div class="pr-foot">Gedruckt ${esc(fmtD(TODAY()))}${ME?' · '+esc(meK()):''}</div></div>`;
// pages: [[title,sub,body], …] → je Seite ein eigenes Blatt
function printDoc(title,sub,body,landscape,pages){
  const html=(pages||[[title,sub,body]]).map(([t,s,b])=>prPage(t,s,b,landscape)).join('');
  let el=$('#printArea'); if(!el){ el=document.createElement('div'); el.id='printArea'; document.body.appendChild(el); }
  el.innerHTML=html; document.body.classList.add('printing'); document.body.classList.toggle('print-land',!!landscape);
  const done=()=>{ document.body.classList.remove('printing','print-land'); window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done); setTimeout(()=>window.print(),60);
}

/* ========== To-Do-Updates mit Datum ========== */
// Update-Zeitpunkt: gewaehltes Datum + Uhrzeit (eingegeben oder Zeitpunkt des Eintragens, wenn am selben Tag)
const updTime=x=>{ if(x.tm) return x.tm; if(!x.at) return ''; const a=new Date(x.at); if(isNaN(a)||iso(a)!==x.d) return ''; return String(a.getHours()).padStart(2,'0')+':'+String(a.getMinutes()).padStart(2,'0'); };
const updStamp=x=>fmtD(x.d)+(updTime(x)?' · '+updTime(x):'');
const updKey=x=>(x.d||'')+' '+(updTime(x)||'00:00')+(x.at||'');
// Letzte Aktivität eines To-Dos: neuestes Update, sonst Anlagezeitpunkt (Format JJJJ-MM-TT HH:MM)
const isoLocal=s=>{ const a=new Date(s); return isNaN(a)?'':iso(a)+' '+String(a.getHours()).padStart(2,'0')+':'+String(a.getMinutes()).padStart(2,'0'); };
const taskActKey=t=>{ const u=(t.upd2||[]).map(x=>(x.d||'')+' '+(updTime(x)||'00:00')).sort().pop()||''; const c=t.at?isoLocal(t.at):''; return u>c?u:c; };
function taskUpdList(t){ const u=(t&&t.upd2)||[]; return u.length?u.slice().sort((a,b)=>updKey(b).localeCompare(updKey(a))).map(x=>`<div class="tu"><b class="mono">${esc(updStamp(x))}</b> <span class="who-chip">${esc(x.by||'?')}</span> ${esc(x.t)}</div>`).join(''):'<div class="small muted">Noch keine Updates.</div>'; }
function taskUpdHtml(t){
  return `<div class="tu-box"><div id="tu_list">${taskUpdList(S.tasks[t.id]||t)}</div>
    <div class="tu-new"><textarea class="inp" id="tu_t" rows="4" placeholder="Was ist passiert? z. B. Westnetz angerufen, Rückruf Freitag zugesagt, Unterlagen per Mail geschickt … (Strg+Enter fügt hinzu)" aria-label="Update"></textarea><input type="date" class="inp" id="tu_d" value="${TODAY()}" aria-label="Datum"><input type="time" class="inp" id="tu_h" value="${nowStamp().slice(9)}" aria-label="Uhrzeit"><button type="button" class="btn sm pri" data-act="taskUpdAdd" data-id="${t.id}">Update hinzufügen</button></div>
    ${t.pid&&S.projects[t.pid]?'<div class="small muted">Erscheint in den Projekt-Notizen unter „Updates zu To-Dos“.</div>':''}</div>`;
}
function todoUpdBlock(p){
  const ts=arr('tasks').filter(t=>t.pid===p.id&&(t.upd2||[]).length).sort((a,b)=>(a.done-b.done)||String(((b.upd2||[]).slice(-1)[0]||{}).d||'').localeCompare(String(((a.upd2||[]).slice(-1)[0]||{}).d||'')));
  if(!ts.length) return '';
  return `<div><div class="eyebrow" style="margin-bottom:4px"><span>Updates zu To-Dos</span></div>${ts.map(t=>{ const u=t.upd2.slice().sort((a,b)=>updKey(b).localeCompare(updKey(a)));
    return `<details class="tu-d"><summary><span>${t.done?'✓':'☐'} ${esc(t.title)}</span><span class="small muted">${u.length} Update${u.length>1?'s':''} · zuletzt ${esc(updStamp(u[0]))}${t.who?' · '+esc(shortWho(t.who)):''}</span></summary>${u.map(x=>`<div class="tu"><b class="mono">${esc(updStamp(x))}</b> <span class="who-chip">${esc(x.by||'?')}</span> ${esc(x.t)}</div>`).join('')}<button type="button" class="btn ghost sm" data-act="editTask" data-id="${t.id}">To-Do öffnen</button></details>`; }).join('')}</div>`;
}

function printWeek(){

  const dd=all.some(e=>e.d===days[5])?days:days.slice(0,5), names=staff().map(s=>s.name);
  const whoOf=x=>names.includes(x.who)?x.who:x.k==='abw'?'Abwesend':'Allgemein';
  const people=[...names.filter(n=>all.some(x=>whoOf(x)===n)),...names.filter(n=>!all.some(x=>whoOf(x)===n))]; if(all.some(x=>whoOf(x)==='Allgemein')) people.push('Allgemein'); if(all.some(x=>whoOf(x)==='Abwesend')) people.unshift('Abwesend');
  const cell=(pn,d)=>all.filter(x=>x.d===d&&whoOf(x)===pn).map(x=>{ const e=x.e||{}, pj=e.pid&&S.projects[e.pid]; return `<div class="pw-e">${e.time&&!(x.multi&&!x.first)?'<b>'+esc(e.time)+'</b> ':''}${x.multi&&!x.first?'↳ ':''}${pj?'<b>'+esc(pj.name)+'</b> ':''}${esc(x.t)}</div>`; }).join('');

  const tasks=arr('tasks').filter(t=>!t.done&&t.due&&t.due<=dd[dd.length-1]).sort(byDue);
  const dl=arr('orders').filter(o=>orderState(o).open&&o.delivery&&o.delivery<=dd[dd.length-1]).sort((a,b)=>a.delivery.localeCompare(b.delivery));
  const tgt=arr('projects').filter(p=>p.target&&['laufend','planung'].includes(catOf(p))&&p.target<=addDays(ws,28)).sort((a,b)=>a.target.localeCompare(b.target));
  const body=grid+
    `<div class="pw-2"><div><h3>Fällige To-Dos (bis ${esc(fmtD(dd[dd.length-1]))})</h3>${tasks.length?`<table class="pr-tbl"><tr><th style="width:4%"></th><th>Aufgabe</th><th style="width:16%">Wer</th><th style="width:14%">Fällig</th></tr>${tasks.slice(0,25).map(t=>`<tr><td>☐</td><td>${esc(t.title)}${t.pid?'<br><small>'+esc(projName(t.pid))+'</small>':''}</td><td>${esc(t.ext?'extern: '+t.ext:t.who?shortWho(t.who):'offen')}</td><td>${esc(fmtD(t.due))}${t.due<TODAY()?' !':''}</td></tr>`).join('')}</table>`:'<p>Keine.</p>'}</div>
     <div><h3>Lieferungen</h3>${dl.length?`<table class="pr-tbl"><tr><th style="width:18%">Termin</th><th>Lieferant · Projekt</th></tr>${dl.map(o=>`<tr><td>${esc(fmtD(o.delivery))}</td><td>${esc(o.supplier||'')} · ${esc(projName(o.pid)||'–')}</td></tr>`).join('')}</table>`:'<p>Keine.</p>'}
     ${tgt.length?`<h3>Fertigstellungstermine (4 Wochen)</h3><table class="pr-tbl">${tgt.map(p=>`<tr><td style="width:18%">${esc(fmtD(p.target))}</td><td>${esc(p.name)}</td></tr>`).join('')}</table>`:''}
     <h3>Notizen</h3><div class="pr-line"></div><div class="pr-line"></div><div class="pr-line"></div></div></div>`;
  printDoc('Wochenplan KW '+kw,fmtD(ws)+' – '+fmtD(dd[dd.length-1]),body,true);

/* ========== Globale Suche (Startseite) ========== */
function gsearch(q){
  q=String(q||'').trim().toLowerCase(); if(q.length<2) return [];
  const terms=q.split(/\s+/), hit=s=>{ const x=String(s||'').toLowerCase(); return terms.every(t=>x.includes(t)); };
  const snip=(s)=>{ const x=String(s||''), i=x.toLowerCase().indexOf(terms[0]); return i<0?x.slice(0,110):(i>40?'…':'')+x.slice(Math.max(0,i-40),i+90).replace(/\s+/g,' ')+'…'; };
  const out=[];
  arr('projects').forEach(p=>{ const meta=[p.name,p.nr,p.place,p.customer,p.contact,p.pl,p.vnb].join(' '), notes=[p.scope,p.questions,p.notes,p.updates].join('\n');
    if(hit(meta)) out.push({g:'Projekte',t:p.name,m:[p.nr,p.place,CATS[catOf(p)]].filter(Boolean).join(' · '),act:'openProject',id:p.id});
    else if(hit(meta+' '+notes)) out.push({g:'Notizen',t:p.name,m:snip(notes),act:'openAt',id:p.id,at:'status'}); });
  arr('tasks').forEach(t=>{ const s=[t.title,t.notes,t.ext,t.who,projName(t.pid),...(t.upd2||[]).map(u=>u.t)].join(' '); if(hit(s)) out.push({g:'To-Dos',t:(t.done?'✓ ':'')+t.title,m:[projName(t.pid)||(t.pool?'Allgemein':''),t.who?shortWho(t.who):'',t.due?fmtD(t.due):''].filter(Boolean).join(' · '),act:'editTask',id:t.id}); });
  Object.values(S.priv||{}).forEach(t=>{ if(hit([t.title,t.firm,t.notes].join(' '))) out.push({g:'Private To-Dos',t:t.title,m:t.firm||'',act:'nav',v:'private'}); });
  arr('orders').forEach(o=>{ const s=[o.supplier,o.no,o.buyer,projName(o.pid),...(o.items||[]).map(i=>[i.art,i.artNr].join(' '))].join(' '); if(hit(s)) out.push({g:'Bestellungen',t:(o.supplier||'Bestellung')+(o.no?' · '+o.no:''),m:[projName(o.pid),fmtD(o.ordered),orderState(o).k].filter(Boolean).join(' · '),act:'editOrder',id:o.id}); });
  allFiles().forEach(f=>{ if(hit([f.name,f.orig,f.from,f.subject,f.text,projName(f.pid)].join(' '))) out.push({g:'Dateien',t:f.name,m:[FILE_KINDS[f.kind],projName(f.pid),fmtD(f.date)].filter(Boolean).join(' · '),act:f.virtual?f.vact:f.asset?'fileAsset':'fileOpen',id:f.virtual?f.vid:f.asset?f.asset:f.id}); });
  arr('stock').forEach(s=>{ if(hit([s.art,s.artNr,s.loc].join(' '))) out.push({g:'Lager',t:s.art,m:[s.artNr,s.loc,'Bestand '+qn(s.qty)+' '+(s.unit||'')].filter(Boolean).join(' · '),act:'stockHist',id:s.id}); });
  arr('events').forEach(e=>{ if(hit([e.title,e.place,e.notes,projName(e.pid)].join(' '))) out.push({g:'Termine',t:e.title,m:[fmtD(e.date),projName(e.pid)].filter(Boolean).join(' · '),act:'editEvent',id:e.id}); });
  arr('plan').forEach(w=>(w.entries||[]).forEach((e,i)=>{ if(hit([e.t,e.note,e.who,projName(e.pid)].join(' '))) out.push({g:'Wochenplanung',t:e.t,m:[fmtD(e.d),e.who?shortWho(e.who):'',projName(e.pid)].filter(Boolean).join(' · '),act:'editPlan',id:w.id+'|'+i}); }));
  arr('reports').forEach(r=>{ if(hit([projName(r.pid),r.work,r.plan,r.address].join(' '))) out.push({g:'Tagesrapporte',t:projName(r.pid)||'Rapport',m:fmtD(r.date),act:'editReport',id:r.id}); });
  arr('picks').forEach(k=>{ if(hit([projName(k.pid),k.who,...(k.items||[]).map(i=>i.art)].join(' '))) out.push({g:'Kommissionierung',t:'Liste '+(projName(k.pid)||''),m:[fmtD(k.date),PICK_ST[k.status]].join(' · '),act:'openPick',id:k.id}); });
  return out;
}
function gsearchHtml(q){
  const res=gsearch(q); if(String(q||'').trim().length<2) return '';
  if(!res.length) return '<div class="gs-none">Nichts gefunden.</div>';
  const groups={}; ['Projekte','To-Dos','Notizen','Bestellungen','Dateien','Lager','Termine','Wochenplanung','Tagesrapporte','Kommissionierung','Private To-Dos'].forEach(g=>groups[g]=[]); res.forEach(r=>{ (groups[r.g]=groups[r.g]||[]).push(r); });
  return Object.entries(groups).filter(([,l])=>l.length).map(([g,l])=>`<div class="gs-g"><div class="gs-h">${esc(g)} <span class="mono">${l.length}</span></div>${l.slice(0,8).map(r=>`<button type="button" class="gs-r" data-act="${r.act}" data-id="${esc(r.id||'')}" ${r.at?`data-at="${r.at}"`:''} ${r.v?`data-v="${r.v}"`:''}><b>${esc(r.t)}</b><span>${esc(r.m||'')}</span></button>`).join('')}${l.length>8?`<div class="small muted" style="padding:4px 10px">+ ${l.length-8} weitere – Suche genauer eingeben</div>`:''}</div>`).join('');
}

/* ========== Projekt: Materialstand ========== */
const matKey=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
function matStatus(p){
  const rows={}, get=(art,unit,artNr)=>{ const k=matKey(artNr&&String(artNr).trim()?artNr:art)||'?'; return rows[k]=rows[k]||{art,unit:unit||'Stk',artNr:artNr||'',best:0,da:0,bau:0,need:0,src:[]}; };
  arr('orders').filter(o=>o.pid===p.id).forEach(o=>(o.items||[]).forEach(it=>{ if(it.extra||!String(it.art||'').trim()) return; const r=get(it.art,it.unit,it.artNr); r.best+=+it.qty||0; r.da+=Math.min(+it.recv||0,+it.qty||0); }));
  arr('picks').filter(k=>k.pid===p.id&&k.status==='uebergeben').forEach(k=>(k.items||[]).forEach(it=>{ const r=get(it.art,it.unit,it.artNr); r.bau+=+it.qty||0; }));
  (p.need||[]).filter(n=>!n.done).forEach(n=>{ const r=get(n.art,n.unit,''); r.need+=+n.qty||0; r.src.push('Bedarf'); r.needIds=(r.needIds||[]).concat(n.id); });
  arr('reports').filter(x=>x.pid===p.id&&x.status!=='vorbereitet').forEach(x=>(x.need||[]).forEach(n=>{ if(!String(n.art||'').trim()||n.ordered) return; const r=get(n.art,n.unit,''); r.need+=+n.qty||0; r.src.push('Rapport '+fmtD(x.date)); }));
  const list=Object.values(rows).sort((a,b)=>(b.need>0)-(a.need>0)||(b.best-b.da)-(a.best-a.da)||String(a.art).localeCompare(String(b.art)));
  const sum=k=>list.filter(r=>k==='need'?r.need>0:k==='open'?r.best>r.da:k==='da'?r.da>0:r.bau>0).length;
  const cell=(v,u,cls)=>v?`<span class="${cls||''}">${qn(v)} <small>${esc(u)}</small></span>`:'<span class="muted">–</span>';
  return `<div class="card mat-st"><div class="card-h"><h3>Materialstand</h3><div class="row" style="gap:6px"><button class="btn sm" data-act="needAdd" data-pid="${p.id}">${ic('plus')}Noch zu bestellen</button>${list.some(r=>r.need>0)?`<button class="btn sun sm" data-act="needOrder" data-pid="${p.id}">${ic('box')}Bestellung daraus anlegen</button>`:''}</div></div>
    <div class="mat-kpi"><div><b>${sum('open')}</b><span>bestellt, noch nicht da</span></div><div><b>${sum('da')}</b><span>angekommen</span></div><div><b>${sum('bau')}</b><span>auf der Baustelle</span></div><div class="${sum('need')?'warn':''}"><b>${sum('need')}</b><span>noch zu bestellen</span></div></div>
    ${list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Artikel</th><th class="r">Bestellt</th><th class="r">Angekommen</th><th class="r">Auf Baustelle</th><th class="r">Noch zu bestellen</th></tr></thead><tbody>${list.map(r=>`<tr><td><b>${esc(r.art)}</b>${r.artNr?`<div class="small muted mono">${esc(r.artNr)}</div>`:''}${r.src.length?`<div class="small muted">${esc([...new Set(r.src)].join(', '))}</div>`:''}</td><td class="r num">${cell(r.best,r.unit)}</td><td class="r num">${cell(r.da,r.unit,r.best&&r.da<r.best?'warn-t':'ok-t')}</td><td class="r num">${cell(r.bau,r.unit)}</td><td class="r num">${r.need?`<span class="bad-t">${qn(r.need)} <small>${esc(r.unit)}</small></span>${(r.needIds||[]).map(id=>`<button class="icon-btn" title="Erledigt / entfernen" data-act="needDone" data-pid="${p.id}" data-id="${id}">${ic('x')}</button>`).join('')}`:'<span class="muted">–</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Noch kein Material erfasst. Bestellungen, Kommissionierlisten und „Noch zu bestellen“ erscheinen hier automatisch.</div>'}
    <div class="small muted" style="padding:8px 16px 12px">Bestellt/angekommen aus „Bestellungen & Wareneingänge“, auf der Baustelle = an die Baustelle übergebene Kommissionierlisten, noch zu bestellen = eigener Bedarf + „zusätzlich benötigtes Material“ aus Tagesrapporten.</div></div>`;
}

/* ========== Startseite: eine Ablage für alles – Claude erkennt, was es ist, und schlägt den passenden Weg vor ========== */

  order:{l:'Bestellung anlegen / ergänzen',d:'Positionen, Preise, Liefertermin auslesen (Bestellung, AB, Rechnung vom Lieferanten)'},
  delivery:{l:'Wareneingang: Lieferschein abgleichen',d:'Mit der offenen Bestellung vergleichen und zeigen, was fehlt'},
  todos:{l:'To-Dos daraus erstellen',d:'Aufgaben, Zuständige und Fristen erkennen, mit bestehenden To-Dos abgleichen'},
  note:{l:'Als Notiz ins Projekt',d:'Text als Update in die Projekt-Notizen (mit Kürzel)'},
  file:{l:'In der Datenablage ablegen',d:'Einheitlich benennen, Art und Projekt zuordnen (Mails unter Korrespondenz)'},
  none:{l:'Sonst nichts – nur die bestehenden To-Dos aktualisieren',d:'Nur die oben markierten To-Do-Updates speichern'}};
const SMART_TYPES={bestellung:'Bestellung',ab:'Auftragsbestätigung',rechnung:'Rechnung',lieferschein:'Lieferschein',todos:'Aufgaben / To-Do-Liste',notiz:'Notiz / Stand zum Projekt',angebot:'Angebot',korrespondenz:'Korrespondenz (E-Mail)',plan:'Plan / Zeichnung',foto:'Foto',vertrag:'Vertrag',sonst:'Sonstiges'};
const SMART_MAP={bestellung:'order',ab:'order',rechnung:'order',lieferschein:'delivery',todos:'todos',notiz:'note',korrespondenz:'todos',angebot:'file',plan:'file',foto:'file',vertrag:'file',sonst:'file'};

async function smartDrop(files,text){
  files=[...(files||[])]; text=String(text||'');
  if(!files.length&&isOutlookRow(text)){ toast('Outlook gibt beim Ziehen nur die Betreffzeile weiter: Mail erst auf den Desktop ziehen, dann die .msg-Datei hier ablegen – oder Mailtext kopieren und hier einfügen.'); return; }
  if(!files.length&&text.trim().length<3){ toast('Bitte eine Datei, Mail oder Text ablegen.'); return; }
  toast(SAMPLE?'Claude schaut es sich an …':'Wird erkannt …');
  // Inhalt lesen
  const f=files[0], items=[]; let mail=null, body='';
  for(const x of files.slice(0,6)){ const n=(x.name||'').toLowerCase();
    if(/\.(msg|eml)$/.test(n)||x.type==='message/rfc822'){ const m=await readMail([x],''); if(m){ mail=mail||m; items.push('E-Mail „'+m.subject+'“ von '+m.from+(m.att.length?' · Anhänge: '+m.att.join(', '):'')+'\n'+m.text.slice(0,2500)); } }
    else if(/pdf/.test(x.type)||n.endsWith('.pdf')){ const t=await pdfText(x); items.push('PDF „'+x.name+'“\n'+t.slice(0,2500)); }
    else items.push('Datei „'+x.name+'“ ('+(x.type||'unbekannt')+')'); }
  if(!files.length){ body=text.trim(); if(/^(Von|From|Betreff|Subject)\s*:/im.test(body)) mail={...(await readMail([],body)),kind:'mail'}; items.push((mail?'Kopierte E-Mail':'Kopierter Text')+':\n'+body.slice(0,3000)); }
  const all=items.join('\n\n---\n\n');
  // Lokale Vermutung
  let type=guessKind((f&&f.name)||'',all,!!mail,f&&f.type); type={mail:'korrespondenz'}[type]||type;
  if(!files.length&&!mail) type=isTodoList(body)?'todos':'notiz';
  if(/^image\//.test((f&&f.type)||'')&&/liefer|ls[-_ ]?\d/i.test(f.name)) type='lieferschein';
  let pid=matchProject(all).pid||'', orderId='', summary='', why='', related=null;
  const openOrders=arr('orders').filter(o=>orderState(o).open);
  if(SAMPLE){
    const plist=arr('projects').filter(p=>['laufend','planung','onhold'].includes(catOf(p))).map(p=>`${p.id} | ${p.name} | ${p.nr||''} | ${String(p.place||'').replace(/\n/g,' ')} | ${p.customer||''}`).join('\n');
    const olist=openOrders.slice(0,80).map(o=>`${o.id} | ${o.supplier||''} | ${o.no||''} | ${projName(o.pid)||'-'} | ${(o.items||[]).slice(0,4).map(i=>i.art).join(', ')}`).join('\n')||'-';
    const prompt=`Heute ist ${TODAY()}. Jemand bei einem Solar-Installationsbetrieb (nutz die Sonne GmbH; PV, Speicher, Ladesäulen) hat Folgendes in die App gezogen:
"""${all.slice(0,7000)}"""
Projekte (ID | Name | Nummer | Ort | Kunde):\n${plist}
Offene Bestellungen (ID | Lieferant | Bestell-Nr. | Projekt | Positionen):\n${olist}
Offene To-Dos (ID | Aufgabe | Projekt | Wer):\n${arr('tasks').filter(x=>!x.done).slice(0,150).map(x=>x.id+' | '+x.title+' | '+(projName(x.pid)||'-')+' | '+(x.who?shortWho(x.who):'-')).join('\n')||'-'}
Was ist das? Wähle genau einen Typ:
- "bestellung"/"ab"/"rechnung": Bestellung, Auftragsbestätigung oder Rechnung eines LIEFERANTEN an uns (Material/Dienstleistung, die wir einkaufen)
- "lieferschein": Lieferschein / Warenbegleitschein zu einer Lieferung an uns
- "todos": Text/Mail, aus der sich vor allem Aufgaben für uns ergeben, oder eine Aufgabenliste
- "notiz": Stand/Info zu einem Projekt ohne konkrete Aufgabe (z. B. Baustellenbericht, Gesprächsnotiz)
- "angebot": Angebot (von uns an Kunden oder von Lieferanten an uns), "korrespondenz": sonstige Mail ohne Aufgaben, "plan", "foto", "vertrag", "sonst"
Ordne ein Projekt zu, wenn eindeutig (Projektname, Nummer, Kommission, Adresse, Kunde); Lager/Büro: "intern"; sonst "". Bei Lieferschein/AB/Rechnung: passende offene Bestellung (orderId), falls Lieferant + Nummer/Positionen passen, sonst "".
Prüfe außerdem: Ist das eine Rückmeldung, ein Fortschritt oder eine Erledigung zu einem der offenen To-Dos (gleiche Sache, nicht nur gleiches Projekt)? Dann in "related" aufnehmen: relation "update" (neue Info) oder "erledigt" (die Sache ist damit erledigt), update = 1 kurzer Satz, was neu ist. Sonst related leer.
Antworte nur mit JSON: {"type":"","projectId":"","orderId":"","summary":"1 Satz, was es ist und worum es geht","why":"kurz","related":[{"id":"To-Do-ID","relation":"update|erledigt","update":"kurz"}]}`;
    try{ const r=await SAMPLE.json(prompt,{modelTier:'default'});
      if(r&&SMART_TYPES[r.type]) type=r.type; if(r&&r.projectId&&(S.projects[r.projectId]||r.projectId===INTERN)) pid=r.projectId; if(r&&r.orderId&&S.orders[r.orderId]) orderId=r.orderId; summary=r&&r.summary||''; why=r&&r.why||''; related=(r&&Array.isArray(r.related)?r.related:[]).filter(x=>x&&S.tasks[x.id]&&!S.tasks[x.id].done).slice(0,5).map(x=>({id:x.id,relation:x.relation==='erledigt'?'erledigt':'update',update:String(x.update||summary||'').slice(0,300),by:'Claude'})); }
    catch(e){ if(e&&e.code&&e.code!=='cancelled') toast(SAMPLE_ERR[e.code]||'Claude nicht erreichbar – einfache Erkennung.'); } }
  if(!orderId&&type==='lieferschein'){ const sup=openOrders.find(o=>o.supplier&&all.toLowerCase().includes(String(o.supplier).toLowerCase().split(' ')[0])&&(!pid||o.pid===pid)); if(sup) orderId=sup.id; }
  if(files.length>1&&!mail) type=type==='lieferschein'?type:'sonst';
  // Ohne Claude: Wortvergleich mit offenen To-Dos (schwache Treffer werden nur angezeigt, nicht vorausgewählt)
  if(!related){ const head=(mail?mail.subject+' '+mail.text.slice(0,300):body.slice(0,300))||(f&&f.name)||''; const fr=findRelated({title:head,projectId:pid});
    related=fr?[{id:fr.id,relation:'update',update:(mail?mail.subject:body.replace(/\s+/g,' ').slice(0,160))||'',by:'Wortvergleich',weak:!fr.strong}]:[]; }
  smartSheet({files,text,type,pid,orderId,summary,why,mail,related,many:files.length>1});
}

      ${k==='delivery'?`<select class="inp" id="sm_order" aria-label="Bestellung"><option value="">– offene Bestellung wählen –</option>${openOrders.map(o=>`<option value="${o.id}" ${o.id===c.orderId?'selected':''}>${esc((o.supplier||'Lieferant')+(o.no?' · '+o.no:'')+' · '+(projName(o.pid)||'ohne Projekt'))}</option>`).join('')}</select>`:''}</span></label>`).join('')}</div></div>`,saveLabel:'Los',
    onSave:()=>{ const act=(document.querySelector('input[name=sm_act]:checked')||{}).value, pid=$('#sm_pid').value;
      // markierte To-Do-Updates zuerst speichern (Datum + Kürzel; bei „erledigt“ abhaken und in den Projekt-Notizen vermerken)

/* ========== Meetings: Mitschrift per Mikrofon, Claude macht daraus Projekt-Notizen und To-Dos ========== */
// Spracherkennung des Browsers (Chrome/Edge). Text liegt im Speicher (MEET_TX), damit ein Neuzeichnen nichts löscht.
const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const MEET_TX={}; let MEET_REC=null, MEET_ON='', MEET_INT='', MEET_SAVE=null;
const meetTx=m=>MEET_TX[m.id]!==undefined?MEET_TX[m.id]:(m.tx||'');
function meetSave(id,silent){ const m=S.meetings&&S.meetings[id]; if(!m) return; const tx=meetTx(m); if(tx===m.tx) return; put('meetings',{...clone(m),tx}); if(!silent) toast('Mitschrift gespeichert.'); }
function meetNew(){ const m={id:uid(),title:'Meeting '+fmtD(TODAY()),date:TODAY(),time:nowStamp().slice(9),who:ME?[ME]:[],pids:[],tx:'',status:'offen'}; put('meetings',m); UI.mid=m.id; go('meetings'); }
function meetStart(id){
  if(!SRec){ toast('Dieser Browser kann nicht mitschreiben. Bitte Chrome oder Edge verwenden – oder Text eintippen/einfügen.'); return; }
  if(MEET_ON) meetStop();
  const r=new SRec(); r.lang='de-DE'; r.continuous=true; r.interimResults=true; MEET_REC=r; MEET_ON=id; MEET_INT='';
  let lastStamp='';
  r.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i], t=res[0].transcript.trim(); if(!t) continue;
      if(res.isFinal){ const st=nowStamp().slice(9); const pre=st!==lastStamp?'\n['+st+'] ':' '; lastStamp=st; const tf=fixNames(t); MEET_TX[id]=(meetTx(S.meetings[id]||{id})+pre+tf.charAt(0).toUpperCase()+tf.slice(1)+'.').replace(/^\n/,''); }
      else interim+=t+' '; }
    MEET_INT=interim; const ta=$('#mt_tx'); if(ta&&ta.dataset.id===id){ ta.value=meetTx(S.meetings[id]||{id}); ta.scrollTop=ta.scrollHeight; } const li=$('#mt_live'); if(li) li.textContent=interim; };
  r.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ toast('Kein Zugriff aufs Mikrofon – bitte im Browser erlauben.'); meetStop(); } };
  r.onend=()=>{ if(MEET_ON===id) try{ r.start(); }catch(e){} }; // Chrome beendet nach Pausen – weiter mitschreiben
  try{ r.start(); }catch(e){ toast('Mikrofon konnte nicht gestartet werden.'); MEET_ON=''; return; }
  clearInterval(MEET_SAVE); MEET_SAVE=setInterval(()=>meetSave(id,true),30000);
  toast('Mitschrift läuft – Mikrofon ist an.'); render();
}
function meetStop(){ const id=MEET_ON; MEET_ON=''; MEET_INT=''; clearInterval(MEET_SAVE); try{ MEET_REC&&MEET_REC.stop(); }catch(e){} MEET_REC=null; if(id) meetSave(id); render(); }
function vMeetings(){

function voicePlace(){ const t=VOICE_EL; if(!t||!document.body.contains(t)||!SRec){ if(!VOICE_REC) voiceBtn.hidden=true; return; }

Rohtext (Spracherkennung, ohne Satzzeichen, evtl. Hörfehler): """${raw.slice(0,4000)}"""
Mach daraus sauberen, sinnvollen Text: Satzzeichen und Groß-/Kleinschreibung, offensichtliche Hörfehler und Fachbegriffe/Namen/Projekte korrigieren, Füllwörter („äh“, „also“) weg, Zahlen, Daten und Uhrzeiten als Ziffern, Mitarbeiter als Kürzel wenn genannt. Nichts dazuerfinden, Inhalt nicht weglassen.${single?' Es ist ein einzeiliges Feld: kurz und knapp, eine Zeile.':' Mehrere Gedanken gern als kurze Sätze oder Stichpunkte.'} Antworte nur mit dem fertigen Text.`,{modelTier:'quick',cache:false});
      const c=fixNames(String(res&&res.text||'').trim().replace(/^["„]|["“]$/g,'')); if(c) out=c; }
    catch(e){} t.classList.remove('vm-busy'); voiceBtn.textContent='🎙'; }
  if(t.tagName!=='TEXTAREA') out=out.replace(/\s*\n+\s*/g,' ');
  t.value=voiceJoin(VOICE_BASE,VOICE_POS,out); const end=VOICE_POS+(t.value.length-VOICE_BASE.length);
  try{ t.focus(); t.setSelectionRange(end,end); }catch(e){}
  t.dispatchEvent(new Event('input',{bubbles:true})); t.dispatchEvent(new Event('change',{bubbles:true}));
  VOICE_EL=t; voicePlace();
}

/* ========== Projektverlauf: Notizen mit angehängten Updates und Themen-Wörtern ========== */
// Einträge bleiben Text in p.notes / p.updates. Zusätzlich je Eintrag (am Text-Hash):
//   p.threads[kind]=eltern   (Update hängt an einer Notiz)      p.threadsMan[kind]=1  (von Hand gesetzt → Claude ändert nicht)
//   p.noteTopics[h]=[Wörter] (von Claude)                       p.topicsMan[h]={add:[],del:[]} (von Hand)
//   p.vlDone[h]=1            (Claude hat den Eintrag ausgewertet)
const VL_NEW=new Set(); // in dieser Sitzung neu geschrieben → Claude schlägt Zuordnung vor statt sie selbst zu setzen
function vlEntries(p){
  const key=np=>{ const m=String(np.d||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/); if(!m) return ''; const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):TODAY().slice(0,4); return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')+' '+(np.tm||'00:00'); };
  return ['notes','updates'].flatMap(k=>noteBlocks(p[k]).map((b,i)=>{ const np=noteParts(b); return {k,i,b,np,h:strHash(np.text),key:key(np)}; })).filter(e=>e.np.text);
}
function vlTopics(p,h){ const ai=(p.noteTopics||{})[h]||[], man=(p.topicsMan||{})[h]||{}; return [...new Set(ai.filter(w=>!(man.del||[]).includes(w)).concat(man.add||[]))].filter(Boolean); }
// Baum: Wurzeln (eigene Notizen) mit ihren Updates; Ketten werden auf die oberste Notiz zusammengezogen
function vlTree(p){
  const es=vlEntries(p), byH={}; es.forEach(e=>{ if(!byH[e.h]) byH[e.h]=e; });
  const th=p.threads||{}, root=e=>{ let x=e, seen=0; while(th[x.h]&&byH[th[x.h]]&&byH[th[x.h]]!==x&&seen++<10) x=byH[th[x.h]]; return x; };
  const roots=[], kids={};
  es.forEach(e=>{ const r=root(e); if(r===e) roots.push(e); else (kids[r.h]=kids[r.h]||[]).push(e); });
  roots.forEach(r=>{ r.kids=(kids[r.h]||[]).sort((a,b)=>b.key.localeCompare(a.key)); r.last=[r.key,...r.kids.map(k=>k.key)].sort().pop(); });
  return roots.sort((a,b)=>b.last.localeCompare(a.last));
}
// Themen-Wörter im Text unterstreichen (anklickbar → Pop-up mit der Geschichte des Themas)
function vlMark(text,words){ let s=esc(shortMailRefs(text)); const ws=[...words].sort((a,b)=>b.length-a.length);
  ws.forEach(w=>{ const e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); s=s.replace(new RegExp('(^|[^\\wäöüÄÖÜß>])('+e+')(?![\\wäöüÄÖÜß])','i'),(m,a,b)=>a+`<span class="tw" data-act="vlTopic" data-w="${esc(w)}" title="Alles zum Thema „${esc(w)}“">${b}</span>`); });
  return s; }
function vlCard(p,e,adm,child){
  const hd=noteHead(p,e.b), np=e.np, meta=[np.d,np.tm,np.by].filter(Boolean).join(' · '), tp=vlTopics(p,e.h);
  const acts=`<span class="vl-acts">${child?'':`<button class="lnk" data-act="vlAdd" data-pid="${p.id}" data-h="${e.h}">Update dazu</button>`}<button class="lnk" data-act="vlLink" data-pid="${p.id}" data-h="${e.h}">Zuordnen</button><button class="lnk" data-act="vlTopicsEdit" data-pid="${p.id}" data-h="${e.h}">Themen</button>${adm?`<button class="icon-btn" title="Bearbeiten" data-act="editNoteBlock" data-pid="${p.id}" data-k="${e.k}" data-i="${e.i}">${ic('edit')}</button><button class="icon-btn" title="Löschen" data-act="delNoteBlock" data-pid="${p.id}" data-k="${e.k}" data-i="${e.i}">${ic('x')}</button>`:''}</span>`;
  if(child) return `<div class="vl-up"><div class="vl-um"><span class="nb-meta">${esc(meta)}</span>${acts}</div><div class="vl-ut">${vlMark(np.text,tp)}</div></div>`;
  const n=(e.kids||[]).length, open=UI.vlOpen&&UI.vlOpen[e.h];
  return `<div class="nb vl-nb"><div class="nb-h"><b class="${hd.ai?'':'nb-auto'}">${esc(hd.t)}</b><span class="nb-meta">${esc(meta)}${e.k==='notes'?' · Notiz':''}</span></div>
    <div class="nb-t">${vlMark(np.text,tp)}</div>
    <div class="vl-bar">${n?`<button class="lnk vl-tog" data-act="vlToggle" data-h="${e.h}">${open?'▾ ':'▸ '}${n} Update${n>1?'s':''} · zuletzt ${esc(e.kids[0].np.d.slice(0,6))}</button>`:''}${acts}</div>
    ${n&&open?`<div class="vl-ups">${e.kids.map(k=>vlCard(p,k,adm,true)).join('')}</div>`:''}</div>`;
}
function projVerlauf(p,adm){
  if(SAMPLE) setTimeout(()=>vlFill(p.id),400);
  const roots=vlTree(p), top=roots.slice(0,3), rest=roots.slice(3), sg=UI.vlSug&&UI.vlSug.pid===p.id?UI.vlSug:null;
  return `${sg?`<div class="vl-sug">✨ Gehört das zu „<b>${esc(sg.title)}</b>“ vom ${esc(sg.date)}? <button class="btn sm pri" data-act="vlSugYes" data-pid="${p.id}">Als Update anhängen</button><button class="btn sm" data-act="vlSugNo">Eigene Notiz</button></div>`:''}
    <div class="nb-list">${top.map(e=>vlCard(p,e,adm,false)).join('')||'<div class="empty">Noch keine Notizen.</div>'}</div>
    ${rest.length||p.questions||p.scope?`<details class="nb-more" ${UI.nbAll?'open':''} data-nball="1"><summary>${rest.length?`Ältere Notizen (${rest.length})`:'Weitere Einträge'}${p.questions?' · offene Fragen':''}${p.scope?' · Auftrag':''} anzeigen</summary>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px"><div class="nb-list">${rest.map(e=>vlCard(p,e,adm,false)).join('')}</div>
      ${p.questions?`<div><div class="eyebrow nb-eb"><span>Zu klärende Fragen</span></div><div class="longtext">${esc(p.questions)}</div></div>`:''}${p.scope?`<div><div class="eyebrow nb-eb"><span>Auftrag Inhalt</span></div><div class="longtext">${esc(p.scope)}</div></div>`:''}</div></details>`:''}`;
}
// Claude: Überschrift, Zuordnung (Update zu welcher Notiz?) und Themen-Wörter je Eintrag – einmal pro Eintrag
const VL_RUN={}, VL_TRIED={};
async function vlFill(pid){
  const p=S.projects[pid]; if(!p||!SAMPLE||VL_RUN[pid]) return;
  const es=vlEntries(p).sort((a,b)=>a.key.localeCompare(b.key)), done=p.vlDone||{}, heads=p.noteHeads||{};
  const todo=es.map((e,i)=>({e,i})).filter(({e})=>(!done[e.h]||!heads[e.h])&&!VL_TRIED[e.h]).slice(-30); if(!todo.length) return;
  VL_RUN[pid]=true; todo.forEach(({e})=>VL_TRIED[e.h]=1);
  const list=es.map((e,i)=>(i+1)+'. ['+e.key.slice(0,10)+'] '+e.np.text.slice(0,400)).join('\n').slice(-14000);
  try{ const r=await SAMPLE.json(`Projekt „${p.name}“ eines Solar-Installationsbetriebs. Alle Notizen/Updates, älteste zuerst:\n${list}
Für die Einträge Nr. ${todo.map(x=>x.i+1).join(', ')}:
- h: kurze Überschrift (2–5 Wörter, keine Personennamen)
- p: Nummer eines FRÜHEREN Eintrags, zu dem dieser Eintrag ein Update/Fortschritt/Erledigung ist (gleiche Sache) – sonst 0. Nur bei klarem Bezug.
- t: 1–3 Themen-Wörter, die GENAU so im Text vorkommen (z. B. „Westnetz“, „Kran-Firma“, „Zählerschrank“) – Firmen, Bauteile, Vorgänge; keine Personen, keine Allerweltswörter.
Antworte nur mit JSON: {"items":[{"n":Nummer,"h":"…","p":0,"t":["…"]}]}`,{modelTier:'quick',bg:true});
    const cur=clone(S.projects[pid]); if(!cur) return; const th={...(cur.threads||{})}, man=cur.threadsMan||{}, tp={...(cur.noteTopics||{})}, hd={...(cur.noteHeads||{})}, dn={...(cur.vlDone||{})};
    let sug=null;
    (r&&Array.isArray(r.items)?r.items:[]).forEach(it=>{ const e=es[(+it.n||0)-1]; if(!e) return; dn[e.h]=1;
      if(String(it.h||'').trim()) hd[e.h]=String(it.h).trim().slice(0,60);
      tp[e.h]=(Array.isArray(it.t)?it.t:[]).map(w=>String(w).trim()).filter(w=>w&&e.np.text.toLowerCase().includes(w.toLowerCase())).slice(0,3);
      const par=es[(+it.p||0)-1];
      if(par&&par.key<=e.key&&par.h!==e.h&&!man[e.h]){ if(VL_NEW.has(e.h)) sug={pid,h:e.h,parent:par.h,title:hd[par.h]||noteHead(cur,par.b).t,date:par.np.d}; else th[e.h]=par.h; } });
    const upd={threads:th,noteTopics:tp,noteHeads:hd,vlDone:dn}; Object.assign(S.projects[pid],upd);
    if(MODE==='cloud'&&DB&&mayWrite('projects')) DB.collection('projects').doc(pid).update(upd).catch(()=>{});
    if(sug) UI.vlSug=sug; scheduleRender(); }
  catch(e){} finally{ VL_RUN[pid]=false; }
}

   openSheet({title:'Themen-Wörter',html:`<div class="fld full"><div class="small muted" style="margin-bottom:8px">Unterstrichene Wörter öffnen beim Anklicken alles zu diesem Thema. Das Wort muss so im Text stehen.</div>
     <div id="vl_tp">${tp.map(w=>`<label class="mt-opt" style="padding:3px 0"><input type="checkbox" class="ck vl-keep" value="${esc(w)}" checked><span>${esc(w)}</span></label>`).join('')||'<div class="small muted">Noch keine Themen.</div>'}</div>
     <label for="vl_add" style="margin-top:10px;display:block">Weitere Wörter (mit Komma trennen)</label><input id="vl_add" class="inp" placeholder="z. B. Westnetz, Zählerschrank"></div>`,saveLabel:'Speichern',
     onSave:()=>{ const keep=[...document.querySelectorAll('.vl-keep')].filter(c=>c.checked).map(c=>c.value), drop=[...document.querySelectorAll('.vl-keep')].filter(c=>!c.checked).map(c=>c.value), add=($('#vl_add').value||'').split(',').map(s=>s.trim()).filter(Boolean);
       vlSet(d.pid,pp=>{ const m={...(pp.topicsMan||{})}, o=m[d.h]||{add:[],del:[]}; m[d.h]={add:[...new Set([...(o.add||[]).filter(w=>!drop.includes(w)),...add])],del:[...new Set([...(o.del||[]).filter(w=>!add.includes(w)),...drop])]}; pp.topicsMan=m; },'Themen gespeichert.'); }}); },
