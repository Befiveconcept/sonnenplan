<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sonnenplan">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='6' fill='%230B0B0B'/%3E%3Ccircle cx='15' cy='13' r='6' fill='%23F4DB02'/%3E%3Crect x='5' y='20' width='20' height='5' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<title>Sonnenplan Projektsteuerung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: schwarze Seitenleiste (Desktop) bzw. Tab-Leiste unten (Handy); Gestaltung nach nutz-die-sonne.de: Schwarz + Sonnengelb, Work Sans + Inter */
:root{
  --bg:#F6F6F3; --surface:#FFFFFF; --sunken:#EFEFEA; --line:#E2E2DA; --ink:#1A1A1A; --muted:#696969;
  --primary:#111111; --primary-ink:#FFFFFF; --sun:#F4DB02; --sun-ink:#111111; --sun-soft:#FBF4B8; --night:#0B0B0B; --night-2:#1A1A1A; --night-ink:#FFFFFF;
  --ok:#2E7D4A; --ok-soft:#E0F1E5; --warn:#A86A00; --warn-soft:#FBEFD2; --bad:#C0352B; --bad-soft:#F9E0DD;
  --t-ffa:#4E8A2E; --t-dach:#1D1D1D; --t-bess:#6A4C9C; --t-lade:#2A63C7;
  --f-display:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#171717; --sunken:#202020; --line:#2C2C2C; --ink:#F2F2F2; --muted:#A3A3A3;
  --primary:#F4DB02; --primary-ink:#111111; --sun:#F4DB02; --sun-ink:#111111; --sun-soft:#3A3410; --night:#000000; --night-2:#161616; --night-ink:#FFFFFF;
  --ok:#6CC28E; --ok-soft:#173022; --warn:#F0B04A; --warn-soft:#3A2C12; --bad:#F07C72; --bad-soft:#3B1C1A;
  --t-ffa:#8CC36A; --t-dach:#E6E6E6; --t-bess:#B49AE0; --t-lade:#7AA8F0; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#171717; --sunken:#202020; --line:#2C2C2C; --ink:#F2F2F2; --muted:#A3A3A3;
  --primary:#F4DB02; --primary-ink:#111111; --sun:#F4DB02; --sun-ink:#111111; --sun-soft:#3A3410; --night:#000000; --night-2:#161616; --night-ink:#FFFFFF;
  --ok:#6CC28E; --ok-soft:#173022; --warn:#F0B04A; --warn-soft:#3A2C12; --bad:#F07C72; --bad-soft:#3B1C1A;
  --t-ffa:#8CC36A; --t-dach:#E6E6E6; --t-bess:#B49AE0; --t-lade:#7AA8F0; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:30px} h2{font-size:21px} h3{font-size:17px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;padding:18px 12px;gap:3px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:6px 10px 18px}
.wordmark{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;font-size:15px;line-height:1;white-space:nowrap}
.wordmark .y{color:var(--sun)} .wordmark .g{color:#BDBDBD}
.brand small{display:block;font-size:11px;color:#9A9A9A;letter-spacing:.04em;margin-top:6px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 12px;border-radius:999px;cursor:pointer;text-align:left;color:rgba(255,255,255,.72);font-weight:500}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.on{background:var(--sun);color:#111;font-weight:600}
.nav-btn .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;background:rgba(255,255,255,.12);border-radius:10px;padding:0 7px}
.nav-btn.on .cnt{background:rgba(0,0,0,.12)}
.side .foot{margin-top:auto;font-size:12px;color:#9A9A9A;padding:8px}
.side .me-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff}
.main{min-width:0;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar .t{min-width:0}
.mobile-top,.tabbar{display:none}

/* Elements */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:600}
.btn.sun:hover{filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.card-b{padding:0 16px 16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.sun{background:var(--sun-soft);color:var(--warn)} .pill.pri{background:var(--sunken);color:var(--primary)}
.type{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--tc)}
.type::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--tc)}
.t-ffa{--tc:var(--t-ffa)} .t-dach{--tc:var(--t-dach)} .t-bess{--tc:var(--t-bess)} .t-lade{--tc:var(--t-lade)} .t-sonst{--tc:var(--muted)}
.mstrip{display:grid;grid-template-columns:repeat(var(--n,29),1fr);gap:1px;min-width:120px}
.mstrip i{height:7px;background:var(--sunken)} .mstrip i:first-child{border-radius:2px 0 0 2px} .mstrip i:last-child{border-radius:0 2px 2px 0}
.mstrip i.d{background:var(--ok)} .mstrip i.c{background:var(--sun)} .mstrip i.gap{margin-left:3px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;min-width:0;width:260px;max-width:100%}
.stage{border-top:1px solid var(--line);padding:10px 16px}
.stage h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.ms{display:grid;grid-template-columns:22px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:5px 0}
.ms .lb{min-width:0}
.ms.cur .lb{font-weight:600}
.ms.nx .lb::after{content:"  ← Next Step";color:var(--warn);font-size:12px;font-weight:600}
.ms input[type=date],.ms input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;width:100%;font-size:13px}
.longtext{white-space:pre-wrap;font-size:13.5px;max-height:420px;overflow-y:auto;background:var(--sunken);border-radius:6px;padding:10px 12px}
.catsel{border:1px solid var(--line);border-radius:20px;padding:4px 10px;background:var(--surface);font-weight:600}
.team{display:grid;grid-template-columns:170px repeat(5,minmax(140px,1fr));min-width:870px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.team>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;min-width:0;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.team .th{background:var(--sunken);font-weight:600;font-size:12px;color:var(--muted)}
.team .th.today{color:var(--ink);background:var(--sun-soft)}
.team .who{font-weight:600;background:var(--sunken)}
.team .en{border-left:3px solid var(--kc);background:var(--sunken);border-radius:3px;padding:3px 6px;cursor:pointer;line-height:1.35}
.team .en:hover{outline:1px solid var(--muted)}
.k-abw{--kc:var(--bad)}
.team .en .tag{display:inline-block;font-size:10.5px;border-radius:3px;padding:0 5px;margin:3px 4px 0 0;background:var(--surface);color:var(--muted)}
.team .en .tag.ok,.day-it .tag.ok{color:var(--ok)}
.en .tag{display:inline-block;font-size:10.5px;border-radius:3px;padding:0 5px;margin:3px 4px 0 0;background:var(--surface);color:var(--muted)}
.add-en{border:1px dashed var(--line);background:none;border-radius:4px;color:var(--muted);cursor:pointer;padding:1px 0;font-size:13px;opacity:.55}
.add-en:hover,.add-en:focus-visible{opacity:1;border-color:var(--muted)}
.team .who{display:flex;flex-direction:column}
.week-days{display:none}
.day-blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.day-blk.today{border-color:var(--sun)}
.day-h{display:flex;justify-content:space-between;align-items:center}
.day-it{display:flex;flex-direction:column;gap:2px}
.day-it .en{border-left:3px solid var(--kc);background:var(--sunken);border-radius:3px;padding:6px 8px;cursor:pointer;font-size:13px}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-decoration:none;min-width:0}
.doc span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc svg{width:18px;height:18px;color:var(--bad);flex:none}
.doc:hover{border-color:var(--muted)}
.rcv-list{display:flex;flex-direction:column}
.rcv{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.rcv.done{opacity:.6}
.rcv-t{flex:1 1 220px;min-width:0;display:flex;flex-direction:column}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg label input[type=radio]{position:absolute;opacity:0;width:1px;height:1px}
.seg label span{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500;background:var(--surface)}
.seg label input:focus-visible+span{outline:2px solid var(--sun);outline-offset:1px}
.seg label input[value=da]:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}
.seg label input[value=fehlt]:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
.seg label input[value=teil]:checked+span{background:var(--warn);border-color:var(--warn);color:#fff}
.seg .teil{width:84px;padding:6px 8px}
.seg .dmg{font-size:12.5px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.pos{display:flex;gap:6px;align-items:center;margin-bottom:2px}
.role{font-family:var(--f-mono);font-size:10.5px;font-weight:500;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.banner{background:var(--sun-soft);border:1px solid var(--sun);border-radius:var(--r);padding:10px 14px;font-size:13px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;cursor:pointer}
.kpi:hover{background:var(--sunken)}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .s{font-size:12px;margin-top:2px}

/* Phase strip */
.pstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;min-width:120px}
.pstrip i{height:7px;border-radius:2px;background:var(--sunken)}
.pstrip i.d{background:var(--ok)} .pstrip i.c{background:var(--sun)}
.plist{display:flex;flex-direction:column}
.stand{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal!important;font-size:13px;line-height:1.4}
.stand b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--muted)}
.tasks-line{display:flex!important;gap:4px;flex-wrap:wrap;margin-top:4px;white-space:normal!important}
.who-chip{font-family:var(--f-mono);font-size:11px;border-radius:4px;padding:1px 6px;background:var(--sun-soft);color:var(--ink)}
.who-chip.open{background:var(--sunken);color:var(--muted)}
[data-drag]:not([data-drag=""]){position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.rz{position:absolute;top:0;right:0;bottom:0;width:9px;cursor:ew-resize;border-radius:0 3px 3px 0;background:linear-gradient(90deg,transparent 3px,var(--kc,var(--muted)) 3px,var(--kc,var(--muted)) 5px,transparent 5px);opacity:.35}
[data-drag]:hover .rz{opacity:1}
.en.cont,.ev.cont{opacity:.75;border-left-style:dashed}
.drag-ghost{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:6px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.dragging-src{opacity:.4}
body.dragging,body.dragging *{cursor:grabbing!important}
.mg-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg-soft,transparent)}
.drop-hi{outline:2px dashed var(--sun)!important;outline-offset:-2px;background:var(--sun-soft)!important}
.team .cell{min-height:44px}
.sug-list{display:flex;flex-direction:column;gap:8px}
.sug{display:grid;grid-template-columns:22px minmax(0,1fr) 110px 140px 110px;gap:8px;align-items:center}
.quick-note{display:flex;flex-direction:column;gap:6px;background:var(--sunken);border-radius:8px;padding:8px}
.quick-note textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-height:64px;resize:vertical;width:100%}
.quick-note textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;min-height:96px}
.nb-list{padding:4px 6px;white-space:normal}
.nb{display:flex;gap:6px;align-items:flex-start;padding:5px 2px;border-bottom:1px dashed var(--line)}
.nb:last-child{border-bottom:0}
.nb-t{flex:1;min-width:0;white-space:pre-wrap}
.nb-a{display:flex;flex:none;opacity:.35}
.nb:hover .nb-a,.nb-a:focus-within{opacity:1}
@media (hover:none){.nb-a{opacity:.8}}
.trail{font-size:12.5px;color:var(--muted);background:var(--sunken);border-radius:6px;padding:6px 10px}
.trail summary{cursor:pointer;margin-top:4px}
.en .tag.by{font-family:var(--f-mono)}
.fld textarea.ro{background:var(--sunken);color:var(--muted);cursor:default}
.prev-notes{max-height:260px;font-size:13px}
.sug.sug-st{grid-template-columns:22px minmax(0,1fr) 140px;background:var(--sun-soft);border-radius:6px;padding:6px 8px}
@media (max-width:900px){.sug{grid-template-columns:22px minmax(0,1fr);}.sug select,.sug input[type=date]{grid-column:2}}
.hist-it{display:grid;grid-template-columns:42px auto minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hist-it a{color:var(--ink);font-weight:600;text-decoration:none}
.hist-it a:hover{text-decoration:underline}
.me-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;margin:10px 4px 0;cursor:pointer;font-size:12.5px;text-align:left;margin-top:auto}
.side .foot{margin-top:0}
.me-list{display:flex;flex-direction:column;gap:6px}
.me-opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.me-opt:has(input:checked){border-color:var(--primary);background:var(--sunken)}
.by-line{font-size:11.5px;color:var(--muted)}
/* Hero im Stil der Website: schwarz, Modulraster, gelbe Akzente */
.hero{position:relative;border-radius:18px;overflow:hidden;color:#fff;background:var(--night);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;
  background:
    linear-gradient(115deg,rgba(0,0,0,.92) 35%,rgba(0,0,0,.35) 100%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 56px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 34px),
    linear-gradient(160deg,#1d2733 0%,#0b0f14 60%,#000 100%)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(244,219,2,.55) 0%,rgba(244,219,2,.12) 45%,transparent 70%)}
.hero-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:18px 28px;padding:26px 28px;align-items:end}
.hero-ey{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);font-weight:600;margin-bottom:8px}
.hero h1{font-size:36px;font-weight:600;letter-spacing:-.035em;line-height:1.05;color:#fff}
.hero h1 span{color:var(--sun)}
.hero-sub{margin-top:8px;color:rgba(255,255,255,.75)}
.hero-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
@media (max-width:1180px){.hero:not(.hero-sm) .hero-in{grid-template-columns:minmax(0,1fr)}}

/* Agenda */
.ag{display:flex;flex-direction:column}
.ag-day{font-size:12px;font-weight:600;color:var(--muted);padding:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.ag-it{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ag-it:last-child{border-bottom:0}
.ag-it .bar{align-self:stretch;border-radius:2px;background:var(--kc,var(--muted))}

.ag-it .mt{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bau{--kc:var(--primary)} .k-kunde{--kc:var(--t-bess)} .k-evu{--kc:var(--t-ffa)} .k-lief{--kc:var(--sun)} .k-intern{--kc:var(--muted)} .k-todo{--kc:var(--bad)} .k-proj{--kc:var(--ink)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:flex-start;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .body{flex:1;min-width:0}
.li .tt{font-weight:500}
.li .mt{font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:2px}
.li.done .tt{text-decoration:line-through;color:var(--muted)}
.clickable{cursor:pointer}
.clickable:hover{background:var(--sunken)}
input[type=checkbox].ck{appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;flex:none;margin:1px 0 0;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
input[type=checkbox].ck:checked{background:var(--ok);border-color:var(--ok)}
input[type=checkbox].ck:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.grp-h{padding:10px 16px 6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunken);border-top:1px solid var(--line)}
.grp-h:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.overdue{color:var(--bad);font-weight:600}

/* Project detail */
.ph-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ph-step{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left;min-width:118px}

.ph-step .nm{font-size:12.5px;font-weight:600;white-space:nowrap}
.ph-step .mini{height:3px;background:var(--sunken);border-radius:2px;margin-top:5px;overflow:hidden}
.ph-step .mini i{display:block;height:100%;background:var(--ok)}
.ph-step.cur{border-color:var(--sun);background:var(--sun-soft)}
.ph-step.dn .n::after{content:" ✓";color:var(--ok)}
.phase{border-top:1px solid var(--line)}
.phase-h{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none}
.phase-h .no{font-family:var(--f-mono);font-size:12px;width:26px;height:26px;border-radius:50%;display:grid;place-content:center;background:var(--sunken);flex:none}

.phase.dn .phase-h .no{background:var(--ok);color:#fff}
.phase-h .nm{font-weight:600;flex:1;min-width:0}
.phase-h .fd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.phase-b{padding:0 16px 10px 54px}
.ci{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.ci:first-child{border-top:0}
.ci .tx{flex:1;min-width:0}
.ci.done .tx>span:first-child{color:var(--muted);text-decoration:line-through}
.ci .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.ci .acts{display:flex;gap:2px;flex:none}
.ci.kwp .tx>span:first-child::after{content:" · nach Anlagengröße";font-size:11.5px;color:var(--warn)}
.tpl{font-size:11.5px;color:var(--primary);cursor:pointer;border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:2px}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 18px}

.hint{background:var(--sunken);border-radius:6px;padding:10px 12px;font-size:13px}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:220px;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunken);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}

.bcard:hover{border-color:var(--muted)}
.bcard .nm{font-weight:600;font-size:13px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunken)}
.cal .dc{min-height:96px;padding:4px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px}

    if(loaded[coll]) return loaded[coll];
    loaded[coll] = (async()=>{ const m=new Map(); let from=0;

  let channel=null, chReady=false, fetchQ={}, fetchT=null;

  async function flushFetch(){ const q=fetchQ; fetchQ={};
    for(const [coll,ids] of Object.entries(q)){ const list=[...ids]; const {data,error}=await sb.from('docs').select('id,data,updated_at').eq('coll',coll).in('id',list); if(error||!cache[coll]) continue;
      const got=new Set(); (data||[]).forEach(r=>{ got.add(r.id); seen(r.updated_at); if(!busyDoc(coll,r.id)) cache[coll].set(r.id,r.data); }); list.forEach(id=>{ if(!got.has(id)&&!busyDoc(coll,id)) cache[coll].delete(id); }); emit(coll); } }

  async function catchUp(){ if(catching||!lastSync||!session) return; catching=true;
    try{ const colls=Object.keys(cache); if(!colls.length) return; const since=new Date(new Date(lastSync).getTime()-3000).toISOString();
      const {data,error}=await sb.from('docs').select('coll,id,data,updated_at').in('coll',colls).gt('updated_at',since).limit(1000); if(error||!data) return;
      const touched=new Set(); data.forEach(r=>{ if(!cache[r.coll]) return; const cur=cache[r.coll].get(r.id); seen(r.updated_at); if(busyDoc(r.coll,r.id)) return; if(cur&&JSON.stringify(cur)===JSON.stringify(r.data)) return; cache[r.coll].set(r.id,r.data); touched.add(r.coll); });

      .on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
        const row=p.new&&p.new.coll?p.new:p.old; if(!row||!row.coll||!cache[row.coll]) return;
        if(p.eventType==='DELETE'){ cache[row.coll].delete(row.id); emit(row.coll); return; }
        if(!p.new||p.new.data==null||(p.errors&&p.errors.length)) { queueFetch(row.coll,row.id); return; } // zu groß / gekürzt → nachladen
        seen(p.new.updated_at); if(busyDoc(row.coll,row.id)) return; cache[row.coll].set(row.id,p.new.data); emit(row.coll); })
      .subscribe(st=>{ const was=chReady; chReady=st==='SUBSCRIBED'; if(chReady&&was===false&&lastSync) catchUp(); // nach Neuverbindung Verpasstes holen

  // Ablauf je Projektart; „entfällt“-Schritte (p.skip) zählen nicht, optionale Schritte (z. B. Wartungsvertrag) nicht für 100 %
  const ms=p.ms||{}, fl=flowOf(p), seq=flowSeq(p), opt=new Set(fl.opt);
  let li=-1; seq.forEach((n,k)=>{ if(ms['m'+n]) li=k; });
  const last=li>=0?seq[li]:0, req=seq.filter(n=>!opt.has(n)), work=req.filter(n=>seq.indexOf(n)<=li).length;
  const after=seq.slice(li+1), nx=after.find(n=>!opt.has(n)), next=nx||null;
  const optLeft=!next&&after.find(n=>opt.has(n)&&!ms['m'+n]);
  return {last, li, seq, flow:fl, label:last?PIPE[last-1]:'', val:last?ms['m'+last]:'', next, nextLabel:next?PIPE_DO[next-1]:'', afterNext:next?(after.slice(after.indexOf(next)+1)[0]||0):0,
    work, total:req.length, pct:req.length?Math.round(work/req.length*100):0, opt:optLeft?PIPE[optLeft-1]+' (optional)':'', optStep:optLeft||0};
}

function kwpItems(p){
  const k = +p.kwp||0, out=[];
  if(!PV.includes(p.type)) return out;
  if(k>30){ out.push(['k_wandler','Wandlermessung vorgesehen (> 30 kWp)','PL']); out.push(['k_fre','Funkrundsteuerempfänger FRE (> 30 kWp)','BO']); }

  if(k>=135){ out.push(['k_ms','Mittelspannungsanschluss, Anlagenzertifikat B (ab 135 kWp)','PL']); }
  return out;
}
function phasesFor(p){
  // in „Vorlagen“ festgelegte Checkliste der Projektart hat Vorrang vor dem Projekttyp
  const cfg=((S.config||{}).checks||{})[flowId(p)], sel=Array.isArray(cfg)?new Set(cfg):null, all=sel?allCheckItems():null;
  return PHASES.map(ph=>{
    let items;
    if(sel) items=all.filter(i=>i.ph===ph.id&&sel.has(i.id)).map(i=>({id:i.id,t:i.t,r:i.r,tpl:i.tpl}));
    else { items = ph.it.filter(i=>!i[4]||i[4].includes(p.type)).map(i=>({id:i[0],t:i[1],r:i[2],tpl:i[3]}));
    const ex = (EXTRA[p.type]||{})[ph.id]||[];
    items = items.concat(ex.map(i=>({id:i[0],t:i[1],r:i[2],tpl:i[3]}))); }
    if(ph.id==='p5') items = items.concat(kwpItems(p).map(i=>({id:i[0],t:i[1],r:i[2],kwp:true})));
    (p.custom||[]).filter(c=>c.ph===ph.id).forEach(c=>items.push({id:c.id,t:c.t,r:c.r||'PL',custom:true}));
    return {id:ph.id,n:ph.n,fd:ph.fd,items};
  });
}
function progress(p){
  const phases = phasesFor(p);
  let tot=0,done=0,cur=null,next=null;
  phases.forEach(f=>{ f.done=f.items.filter(i=>isChecked(p,i.id)).length; tot+=f.items.length; done+=f.done;
    if(!cur && f.done<f.items.length){ cur=f; next=f.items.find(i=>!isChecked(p,i.id)); } });
  return {phases,tot,done,pct:tot?Math.round(done/tot*100):0,cur,next,idx:cur?phases.indexOf(cur):phases.length};
}

  arr('reports').filter(r=>r.pid&&r.status!=='vorbereitet').forEach(r=>(r.need||[]).forEach(n=>{ if(String(n.art||'').trim()&&!n.ordered) out.push({pid:r.pid,art:n.art,qty:n.qty,unit:n.unit||'Stk',src:'Rapport '+fmtD(r.date)}); }));
  return out; }

// Statusleiste der Projektakte: 29 Schritte, Bezeichnungen schräg nach oben, Klick springt zum Schritt
function stepRail(p){
  const ms=p.ms||{}, pp=pipe(p), starts=stageStarts(p); let h='';
  pp.seq.forEach((i,k)=>{ const v=ms['m'+i], st=v?'d':k<pp.li?'im':i===pp.next?'nx':'', isOpt=pp.flow.opt.includes(i);
    const lbl=PIPE[i-1]+(isOpt?' (optional)':'');
    h+=`<button type="button" class="rs ${st} ${i===pp.last?'cur':''} ${k&&starts.has(i)?'gap':''} ${isOpt?'opt':''}" data-act="railStep" data-pid="${p.id}" data-i="${i}" title="${esc(lbl)}${v?' · '+esc(msVal(v)):''}"><span class="rs-l">${esc(lbl)}</span><span class="rs-b"></span><span class="rs-n">${k+1}</span></button>`; });
  return `<div class="rail" role="list" aria-label="Statusschritte" style="--n:${pp.seq.length}">${h}</div>`;
}

function ordApprBanner(){ const P=ordPending(); if(!P.length) return '';

      <div class="small">${(o.items||[]).map(i=>`<div>${nf(i.qty)} ${esc(i.unit||'')} ${esc(i.art)}${i.price!=null&&i.price!==''?` <span class="muted">à ${euro(+i.price)}</span>`:''}</div>`).join('')||'<span class="muted">keine Positionen</span>'}${o.notes?`<div class="muted">Notiz: ${esc(o.notes)}</div>`:''}</div>
      <div class="row" style="gap:6px;margin-top:6px"><button type="button" class="btn sun sm" data-act="ordApprove" data-id="${o.id}">✓ Freigeben</button><button type="button" class="btn sm" data-act="ordEdit" data-id="${o.id}">Ändern</button><button type="button" class="btn ghost sm" data-act="ordStorno" data-id="${o.id}">Stornieren</button></div></div>`;

    <div class="row" style="margin-top:10px"><button type="button" class="btn ghost sm" data-act="ordApproveAll">Alle ${P.length} freigeben</button>${'Notification' in window&&Notification.permission==='default'?'<button type="button" class="btn ghost sm" data-act="ordNotifyOn">🔔 Browser-Benachrichtigung einschalten</button>':''}</div></div>`,saveLabel:'Schließen',onSave:()=>{}}); }
function ordSetAppr(id,appr,extra){ const o=clone(S.orders[id]); if(!o) return; o.appr=appr; if(appr==='ok'&&o.status==='entwurf') o.status='freigegeben'; o.apprBy=meK(); o.apprAt=new Date().toISOString(); Object.assign(o,extra||{}); put('orders',o); }
function ordRefresh(){ if(SHEET&&SHEET.title==='Bestellungen zur Freigabe'){ closeSheet(); if(ordPending().length) ordApprSheet(); } }
// Mehrere offene Bestellungen beim selben Lieferanten → eine; Projekt je Position vermerkt, wenn verschieden
function ordMerge(ids){ const os=ids.map(id=>S.orders[id]).filter(Boolean); if(os.length<2) return; const base=clone(os[0]), multi=new Set(os.map(o=>o.pid)).size>1;
  base.items=os.flatMap(o=>(o.items||[]).map(i=>({...i,art:multi&&o.pid&&!String(i.art).includes('['+projName(o.pid)+']')?i.art+' ['+projName(o.pid)+']':i.art})));
  base.notes=[...new Set(os.map(o=>o.notes).filter(Boolean))].join('\n'); base.mergedFrom=os.slice(1).map(o=>o.id); base.delivery=os.map(o=>o.delivery).filter(Boolean).sort()[0]||base.delivery;
  base.docs=os.flatMap(o=>o.docs||[]); base.appr='ok'; if(base.status==='entwurf') base.status='freigegeben'; base.apprBy=meK(); base.apprAt=new Date().toISOString();
  if(multi) base.pids=[...new Set(os.map(o=>o.pid).filter(Boolean))];
  put('orders',base); os.slice(1).forEach(o=>del('orders',o.id)); toast(os.length+' Bestellungen bei „'+(base.supplier||'')+'“ zusammengefasst und freigegeben.'); ordRefresh(); }

 ordMerge:d=>{ if(!ordApprover()) return; const ids=String(d.ids).split(','); confirmSheet(ids.length+' Bestellungen beim selben Lieferanten zu einer zusammenfassen und freigeben?',()=>ordMerge(ids)); },
 ordNotifyOn:()=>{ try{ Notification.requestPermission().then(p=>toast(p==='granted'?'Benachrichtigungen sind an.':'Benachrichtigungen wurden nicht erlaubt.')); }catch(e){} },
}));

const chipStep=(n,from,opt)=>`<div class="tchip" draggable="true" data-tdrag="${n}" data-from="${from}"><span class="ss-grip" aria-hidden="true">⋮⋮</span><span class="tc-t">${esc(PIPE[n-1])}${opt?' <span class="small muted">(optional)</span>':''}</span>${from==='pool'?`<button class="icon-btn sm" data-act="tplAddStep" data-n="${n}" title="Zum Ablauf hinzufügen" aria-label="${esc(PIPE[n-1])} hinzufügen">+</button>`:`<button class="icon-btn sm" data-act="tplOptStep" data-n="${n}" title="optional an/aus">☆</button><button class="icon-btn sm" data-act="tplRemStep" data-n="${n}" title="Aus dem Ablauf nehmen" aria-label="${esc(PIPE[n-1])} entfernen">–</button>`}</div>`;

// Ablauf ändern: Schritt n in Phase pi an Position idx (idx<0 = ans Ende); null = entfernen
function flowMove(n,pi,idx){ const fid=UI.tplFlow, f=JSON.parse(JSON.stringify(FLOWS[fid]));
  f.st.forEach(s=>{ s[1]=s[1].filter(x=>x!==n); }); if(pi!=null){ const l=f.st[pi][1]; if(idx<0||idx>l.length) l.push(n); else l.splice(idx,0,n); } else f.opt=f.opt.filter(x=>x!==n);
  flowSave(fid,f); }
function checkSet(id,on){ const fid=UI.tplFlow, s=checkSel(fid); if(on) s.add(id); else s.delete(id); const checks={...((S.config||{}).checks||{})}; checks[fid]=[...s]; saveTpl({checks}); }
document.addEventListener('dragstart',e=>{ const t=e.target.closest&&e.target.closest('[data-tdrag],[data-cdrag]'); if(!t) return; if(!isAdmin()){ e.preventDefault(); return toast('Nur Admins können Vorlagen ändern.'); }
  e.dataTransfer.setData('text/x-tpl',JSON.stringify({n:t.dataset.tdrag?+t.dataset.tdrag:null,c:t.dataset.cdrag||null})); e.dataTransfer.effectAllowed='move'; t.classList.add('dragging'); });
document.addEventListener('dragend',e=>{ document.querySelectorAll('.tchip.dragging,.tdrop-over').forEach(x=>x.classList.remove('dragging','tdrop-over')); });
document.addEventListener('dragover',e=>{ const z=e.target.closest&&e.target.closest('[data-tdrop]'); if(z&&[...e.dataTransfer.types].includes('text/x-tpl')){ e.preventDefault(); document.querySelectorAll('.tdrop-over').forEach(x=>x!==z&&x.classList.remove('tdrop-over')); z.classList.add('tdrop-over'); } });
document.addEventListener('drop',e=>{ const z=e.target.closest&&e.target.closest('[data-tdrop]'); const raw=e.dataTransfer.getData('text/x-tpl'); if(!z||!raw) return; e.preventDefault(); e.stopImmediatePropagation(); z.classList.remove('tdrop-over');
  const d=JSON.parse(raw), tz=z.dataset.tdrop;
  if(d.c){ if(tz==='csel') checkSet(d.c,true); else if(tz==='cpool') checkSet(d.c,false); return; }
  if(d.n==null) return;
  if(tz==='pool') return flowMove(d.n,null);
  const pi=+tz.split(':')[1]; const over=e.target.closest('[data-tdrag]'); let idx=-1;
  if(over&&over.dataset.from===tz){ const list=FLOWS[UI.tplFlow].st[pi][1].filter(x=>x!==d.n); idx=list.indexOf(+over.dataset.tdrag); const r=over.getBoundingClientRect(); if(e.clientY>r.top+r.height/2) idx++; }
  flowMove(d.n,pi,idx); },true);

function fieldHtml(f,v){
  const id='f_'+f.k, val=v??'';
  if(f.type==='sec') return `<div class="sec-t">${f.label}</div>`;
  if(f.type==='html') return `<div class="fld full"><label>${f.label}</label>${f.html}</div>`;
  let inp;
  if(f.type==='select') inp=`<select id="${id}">${f.options.map(o=>{ const [ov,ol]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else if(f.type==='textarea') inp=`<textarea id="${id}" placeholder="${esc(f.ph||'')}" ${f.ro?'readonly class="ro"':''}>${esc(val)}</textarea>`;
  else if(f.type==='lines') inp=linesHtml(f,val||[]);
  else inp=`<input id="${id}" type="${f.type||'text'}" value="${esc(val)}" ${f.list?`list="${f.list}"`:''} ${f.step?`step="${f.step}"`:''} placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`;
  // KI-Vorschlag für Freitextfelder (Textbereiche und Titel)
  const ai=SAMPLE&&!f.ro&&f.ai!==false&&(f.type==='textarea'||(!f.type||f.type==='text')&&['title','t','plan','why'].includes(f.k));
  return `<div class="fld ${f.full||f.type==='textarea'||f.type==='lines'?'full':''}"><label for="${id}">${f.label}${f.req?' *':''}${ai?` <button type="button" class="ai-b" data-act="aiFill" data-k="${f.k}" title="Claude schlägt einen Text vor">✨ Vorschlag</button>`:''}</label>${inp}</div>`;
}
// Kontext für KI-Vorschläge: Formular + Projekt (Notizen, Status, offene Aufgaben)
function aiContext(vals){

async function aiFill(k){
  if(!SAMPLE||!SHEET) return toast('KI-Vorschläge gehen nur in der veröffentlichten App.');
  const f=(SHEET.fields||[]).find(x=>x.k===k); const el=$('#f_'+k); if(!f||!el) return;
  const vals=readSheet(), others=(SHEET.fields||[]).filter(x=>x.k!==k&&x.label&&!['html','sec','lines'].includes(x.type)&&vals[x.k]).map(x=>`${x.label}: ${typeof vals[x.k]==='string'?vals[x.k].slice(0,400):vals[x.k]}`).join('\n');
  const btn=document.querySelector(`.ai-b[data-k="${k}"]`); if(btn){ btn.disabled=true; btn.textContent='✨ denkt …'; }
  const prompt=`Du hilfst Mitarbeitenden eines Solar-Installationsbetriebs (PV, Speicher, Ladesäulen) beim Ausfüllen eines Formulars in der Projekt-App.
Formular: „${SHEET.title}“
Feld, für das du einen Vorschlag machst: „${String(f.label).replace(/<[^>]+>/g,'')}“${f.ph?' (Beispiel: '+f.ph+')':''}
${el.value?'Bisheriger Inhalt des Feldes (verbessern/vervollständigen): '+el.value.slice(0,1500):''}
Weitere Angaben im Formular:\n${others||'-'}
${aiContext(vals)}
Schreibe einen kurzen, sachlichen Vorschlag auf Deutsch in der Sprache des Betriebs (knapp, stichpunktartig wo passend, keine Floskeln, nichts erfinden, was nicht aus dem Kontext folgt – Lücken mit „…“ lassen). ${f.type==='textarea'?'Höchstens 4 Zeilen.':'Höchstens 80 Zeichen, eine Zeile.'} Antworte nur mit dem Text für das Feld.`;
  try{ const r=await SAMPLE(prompt,{modelTier:'quick',cache:false}); const t=String(r&&r.text||'').trim().replace(/^["„]|["“]$/g,'');
    if(t&&$('#f_'+k)===el){ el.dataset.prev=el.value; el.value=t; el.dispatchEvent(new Event('input',{bubbles:true})); el.focus(); toast('Vorschlag eingefügt – bitte prüfen und anpassen.'); } }
  catch(e){ toast(SAMPLE_ERR[e&&e.code]||'Kein Vorschlag möglich.'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='✨ Vorschlag'; } }
}

function itemChip(it){
  if(it.extra) return '<span class="pill">Zusatz</span>';
  const q=+it.qty||0, r=+it.recv||0;
  if(q>0&&r>=q) return '<span class="pill ok">da</span>';
  if(it.miss&&r>0) return `<span class="pill bad">fehlt ${nf(q-r,1)}</span>`;
  if(it.miss) return '<span class="pill bad">nicht da</span>';
  if(r>0) return `<span class="pill warn">teilw. ${nf(r,1)}/${nf(q,1)}</span>`;
  return '<span class="pill">offen</span>';
}
// Lieferschein ↔ Bestellung: Artikelnummer zuerst, sonst Wortüberschneidung der Bezeichnung
const normNr=s=>String(s||'').replace(/[^0-9a-z]/gi,'').replace(/^0+/,'').toLowerCase();
const words=s=>new Set(String(s||'').toLowerCase().replace(/[^0-9a-zäöüß]+/g,' ').split(' ').filter(w=>w.length>1));
function simWords(a,b){ const A=words(a), B=words(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); return n/Math.min(A.size,B.size); }
function matchDelivery(order,dItems){
  const used=new Set(), res=[];
  (order.items||[]).forEach((it,i)=>{ if(!itemOpen(it)) return;
    const nr=normNr(it.artNr); let j=nr?dItems.findIndex((d,k)=>!used.has(k)&&normNr(d.artNr)===nr):-1;
    if(j<0){ let best=-1, bs=0; dItems.forEach((d,k)=>{ if(used.has(k)) return; const s=simWords(it.art,d.art)+(nr&&normNr(d.art).includes(nr)?1:0); if(s>bs){ bs=s; best=k; } }); if(bs>=0.6) j=best; }
    const openQ=(+it.qty||0)-(+it.recv||0);
    if(j<0){ res.push({i,st:'fehlt',n:0,open:openQ}); return; } used.add(j);
    const q=+dItems[j].qty||0; res.push(q>=openQ-1e-9?{i,st:'da',n:q,open:openQ}:q>0?{i,st:'teil',n:q,open:openQ}:{i,st:'fehlt',n:0,open:openQ}); });
  return {res,extra:dItems.filter((d,k)=>!used.has(k))};
}

async function readInvoiceFile(file){
  const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name);
  if(!isPdf) return {text:'', images:[file]};
  const lib=await pdfLib();
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false, isOffscreenCanvasSupported:false, useSystemFonts:true, disableFontFace:true}).promise;
  let text=''; const pages=Math.min(pdf.numPages,8);
  for(let i=1;i<=pages;i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent();
    let lastY=null, line=''; const lines=[];
    tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); if(lastY!==null&&Math.abs(y-lastY)>2){ lines.push(line); line=''; } line+=(line?' ':'')+it.str; lastY=y; }); lines.push(line);
    text+=`\n--- Seite ${i} ---\n`+lines.filter(l=>l.trim()).join('\n'); }
  const images=[];
  const canImg = SLIM&&SLIM.images;
  if(canImg && text.replace(/\s|---|Seite \d+/g,'').length<200){
    const max=Math.min(pdf.numPages, SLIM.images.maxCount||3, 4);
    for(let i=1;i<=max;i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:1.7}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      const ok=await Promise.race([pg.render({canvasContext:c.getContext('2d'),viewport:vp,intent:'print'}).promise.then(()=>true,()=>false), new Promise(r=>setTimeout(()=>r(false),20000))]);
      if(!ok) break; const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)); if(b) images.push(b); }
  }
  return {text:text.slice(0,60000), images};
}
async function extractInvoice(file,mailText){

Projektliste (ID | Name | Nummer | Adresse | Kunde):
${plist}
${(mailText||'').trim()?'\nE-Mail:\n'+mailText.slice(0,15000)+'\n':''}`+`
Extrahiere ALLE Waren- und Leistungspositionen in der Reihenfolge des Belegs.
Regeln:
- Keine Zwischensummen, Gesamtsummen, MwSt-, Rabatt- oder Skontozeilen als Position.
- Fracht/Versand/Palettenpfand nur, wenn als eigene Position mit Betrag aufgeführt (dann unit "psch").
- qty als Zahl (deutsches Komma in Punkt umwandeln). unit wie im Beleg (Stk, m, Pal, kg, Rolle, psch …), Standard "Stk".

Antworte nur mit JSON in genau dieser Form:
{"supplier":"","buyer":"","docNo":"","docType":"Rechnung|AB|Lieferschein|E-Mail","date":"YYYY-MM-DD","delivery":"","projectId":"","items":[{"qty":1,"unit":"Stk","art":"","artNr":"","price":null}]}
${text.trim()?'\nBelegtext (aus dem PDF gelesen):\n'+text:images.length?'\nDer Beleg ist in den angehängten Bildern.':''}`;
  const opts={modelTier:'default'}; if(images.length) opts.images=images;
  const r=await SAMPLE.json(prompt,opts);

// Positionen ohne Claude direkt aus dem Mailtext lesen (Großhändler-Format „Menge: … / PE: …“ und Zeilen wie „20 Stk Modul je 89,50 €“)
const deNum=s=>{ s=String(s||'').trim(); if(!s) return NaN; if(/,\d{1,3}$/.test(s)||/\.\d{3}(,|$)/.test(s)) s=s.replace(/\./g,'').replace(',','.'); return +s; };

const unitOf=u=>{ u=String(u||'').toLowerCase(); return /^(stk|stück|st|x)/.test(u)?'Stk':/^(m|meter|lfm)$/.test(u)?'m':/^pal/.test(u)?'Pal':/^(rolle|ring)/.test(u)?'Rolle':u?u.charAt(0).toUpperCase()+u.slice(1).replace(/\.$/,''):'Stk'; };
function parseMailLocal(text){

  for(let k=1;k<parts.length;k++){
    // Text vor „Menge:“ – ab dem letzten Preisfeld der Vorposition, damit nur die Bezeichnung bleibt
    const prev=parts[k-1].replace(/^[\s\S]*\b(?:Brutto|PE|Positionswert|Warenwert)\s*:\s*[\d.,]+\s*€?(?:\s*\/\s*[\d.,]+\s*[A-Za-zÄÖÜäöü.]*)?/i,'');

}
const SAMPLE_ERR={not_granted:'Claude-Zugriff wurde nicht erlaubt. Positionen bitte von Hand eintragen.',sampling_disabled:'Claude ist für dieses Konto nicht verfügbar.',rate_limited:'Gerade zu viele Anfragen. Bitte in ein paar Minuten erneut versuchen.',image_rejected:'Das Bild konnte nicht gelesen werden. Bitte ein schärferes Foto oder ein PDF nehmen.',images_unavailable:'Gescannte Belege kann diese Ansicht nicht an Claude schicken. Bitte ein PDF mit Text nehmen oder Positionen von Hand eintragen.',invalid_json:'Claude hat keine Positionen erkannt. Bitte erneut versuchen oder von Hand eintragen.',nothing:'Im Beleg wurde kein Text gefunden.',refused:'Claude hat diesen Beleg nicht verarbeitet.'};
async function handleInvoice(file,mail){
  if(!CUR_ORDER||!SHEET) return;
  const o=CUR_ORDER, st=t=>{ const el=$('#docStatus'); if(el) el.textContent=t; const b=document.querySelector('[data-act=pickInvoice]'); if(b) b.disabled=!!t; };
  Object.assign(o, readSheet());
  if(mail){ o.mail={subject:mail.subject||'',from:mail.from||'',date:mail.date||'',text:String(mail.text||'').slice(0,20000)}; }
  if(file&&file.size>20*1024*1024){ toast('Datei ist größer als 20 MB.'); return; }
  const fp=file?await fileFp(file):''; if(file){ const dup=findDup(fp,file.name,file.size); if(dup) dupWarn(file.name,dup); }
  if(file&&ASSETS){
    st('Wird hochgeladen …');
    try{ const type=file.type||(/\.pdf$/i.test(file.name)?'application/pdf':''); const r=await ASSETS.upload(file, type?{type}:undefined);
      o.docs=(o.docs||[]).concat([{id:r.id,name:file.name,type:r.contentType,date:TODAY(),fp,size:file.size||0}]); }
    catch(e){ toast(e&&e.code==='unsupported_type'?'Nur PDF, JPG, PNG oder WebP hochladen.':e&&e.code==='quota_or_state'?'Speicher voll: alte Belege löschen.':'Hochladen fehlgeschlagen ('+(e&&e.code||'Fehler')+').'); st(''); return; }
  }
  let found=0, info='';
  const mailText=mail?[mail.subject&&'Betreff: '+mail.subject,mail.from&&'Von: '+mail.from,mail.date&&'Datum: '+mail.date,mail.text].filter(Boolean).join('\n'):'';
  const loc=mail?parseMailLocal(mail.text):null;
  if(loc){ loc.supplier=String(mail.from||'').replace(/<[^>]*>|\S+@\S+/g,'').replace(/["']/g,'').trim().split(/\s{2,}/)[0]||loc.supplier; loc.delivery=''; }
  // lokale Erkennung nur nehmen, wenn sie plausibel ist (sonst Claude, falls verfügbar)
  const useLocal=loc&&loc.items.length&&!file&&(!SAMPLE||loc.items.every(i=>i.art.length<=90));
  if(SAMPLE||useLocal){
    if(!useLocal) st('Claude liest die Positionen aus … das dauert meist 20–60 Sekunden.');
    try{
      let r; if(useLocal) r=loc; else { try{ r=await extractInvoice(file,mailText); if(loc&&loc.items.length&&!(r.items||[]).length) r={...r,items:loc.items}; }catch(e){ if(loc&&loc.items.length) r=loc; else throw e; } }
      if(!o.pid&&r.projectId&&(S.projects[r.projectId]||r.projectId===INTERN)){ o.pid=r.projectId; info=' Projekt „'+projName(r.projectId)+'“ zugeordnet.'; }
      if(!o.delivery&&/^\d{4}-\d{2}-\d{2}$/.test(r.delivery||'')) o.delivery=r.delivery;
      const blank=!(o.items||[]).some(i=>String(i.art||'').trim());
      const known=new Set((o.items||[]).map(i=>(i.artNr||'')+'|'+String(i.art||'').toLowerCase()));
      const add=r.items.filter(i=>blank||!known.has((i.artNr||'')+'|'+i.art.toLowerCase()));
      o.items = blank? add : (o.items||[]).concat(add); found=add.length;
      if(!o.supplier&&r.supplier) o.supplier=String(r.supplier).slice(0,120);
      if(!o.buyer&&r.buyer) o.buyer=String(r.buyer).slice(0,120);
      if(!o.no&&r.docNo) o.no=String(r.docNo).slice(0,60);
      const last=o.docs&&o.docs[o.docs.length-1]; if(file&&last&&ASSETS){ last.kind=r.docType||''; last.docNo=r.docNo||''; }
      info=found+' Position'+(found===1?'':'en')+' übernommen'+(r.items.length>found?', '+(r.items.length-found)+' waren schon da':'')+'.'+info+(o.delivery?' Liefertermin '+fmtD(o.delivery)+'.':'')+' Bitte prüfen und speichern.';
    }catch(e){ info=SAMPLE_ERR[e&&e.code]||(e&&e.code==='cancelled'?'':'Auslesen fehlgeschlagen. Positionen bitte von Hand eintragen.'); }
  } else info=mail?'Im Mailtext wurden keine Positionen erkannt. Bitte von Hand eintragen.':'Beleg gespeichert. Positionen bitte von Hand eintragen.';
  if(mail&&!found){ info=(info?info+' ':'')+'Angekommen sind '+String(mail.text||'').length+' Zeichen Mailtext – unten unter „Gelesener Mailtext“ prüfen.'; }
  const wasNew=CUR_ORDER_NEW;
  if(!wasNew){ /* Beleg sofort an der gespeicherten Bestellung sichern */ const saved=S.orders[o.id]; if(saved){ const so=clone(saved); so.docs=o.docs; put('orders',so); } }
  closeSheet(); orderForm(o,null,wasNew);
  toast(info||'Beleg gespeichert.');
}

const latin1=buf=>new TextDecoder('latin1').decode(buf);
function decodeWords(s){ return String(s||'').replace(/=\?([^?]+)\?([BQ])\?([^?]*)\?=/gi,(m,cs,enc,txt)=>{ try{ let bytes; if(enc.toUpperCase()==='B'){ bytes=Uint8Array.from(atob(txt),c=>c.charCodeAt(0)); } else { const q=txt.replace(/_/g,' ').replace(/=([0-9A-F]{2})/gi,(x,h)=>String.fromCharCode(parseInt(h,16))); bytes=Uint8Array.from(q,c=>c.charCodeAt(0)); } return new TextDecoder(cs).decode(bytes); }catch(e){ return txt; } }).replace(/\s+/g,' ').trim(); }
function parseHeaders(h){ const o={}; h.replace(/\r?\n[ \t]+/g,' ').split(/\r?\n/).forEach(l=>{ const i=l.indexOf(':'); if(i>0){ const k=l.slice(0,i).trim().toLowerCase(); if(!(k in o)) o[k]=l.slice(i+1).trim(); } }); return o; }

/* ========== Datenablage: Dateien & Mails ablegen, Art und Projekt automatisch erkennen ========== */
const FILE_KINDS={angebot:'Angebot',rapport:'Tagesrapport',kommi:'Kommissionierliste',rechnung:'Rechnung',ab:'Auftragsbestätigung',bestellung:'Bestellung',lieferschein:'Lieferschein',mail:'Korrespondenz',vertrag:'Vertrag',plan:'Plan / Zeichnung',foto:'Foto',sonst:'Sonstiges'};
function guessKind(name,text,isMail,mime){
  const s=(name+' \n'+String(text||'').slice(0,2500)).toLowerCase();
  if(/lieferschein|delivery note/.test(s)) return 'lieferschein';
  if(/auftragsbest(ä|ae)tigung|bestelleingangsbest(ä|ae)tigung|\bab[- ]?nr/.test(s)) return 'ab';
  if(/\brechnung|invoice|gutschrift/.test(s)) return 'rechnung';
  if(/\bangebot|offerte|kostenvoranschlag|quotation/.test(s)) return 'angebot';
  if(/\bbestellung|purchase order/.test(s)) return 'bestellung';
  if(/vertrag|vereinbarung|contract/.test(s)) return 'vertrag';
  if(/\.(dwg|dxf)$|zeichnung|schaltplan|belegungsplan|modulplan|layout|lageplan/.test(s)) return 'plan';
  if(isMail) return 'mail';
  if(/^image\//.test(mime||'')||/\.(jpe?g|png|heic|webp)$/i.test(name)) return 'foto';
  return 'sonst';
}
// Einheitliche Dateinamen in der Datenablage: JJJJMMTT_Thema_Detail(.ext)
const nameSafe=s=>String(s||'').normalize('NFC').replace(/^(re|aw|fw|wg)\s*:\s*/gi,'').replace(/[\\/:*?"<>|]+/g,' ').replace(/[\s_]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,60);
function stdName(date,kind,detail,ext){ const d=String(date||TODAY()).replace(/-/g,'').slice(0,8), th=FILE_KINDS[kind]||kind||'Dokument';
  // Thema nicht im Detail wiederholen („Angebot_Angebot-…“), Füllwörter weg
  const det=String(detail||'').replace(new RegExp('^\\s*('+th.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'|bestelleingangsbestätigung für|auftragsbestätigung zu|ihre)\\s*','i'),'').trim();
  return d+'_'+nameSafe(th)+'_'+(nameSafe(det)||'ohne-Detail')+(ext||''); }
const extOf=n=>{ const m=String(n||'').match(/\.[a-z0-9]{2,5}$/i); return m?m[0].toLowerCase():''; };
const stemOf=n=>String(n||'').replace(/\.[a-z0-9]{2,5}$/i,'');
const STD_RX=/^(\d{8})_([^_]+)_(.+?)(\.[a-z0-9]{2,5})?$/i;
const GEN_W=new Set(['gmbh','co.','kg','gbr','gebäude','halle','dach','projekt','solarpark','energie','strasse','straße','haus','anlage','park','der','die','das','und','für','von','eph1','geb.']);
function matchProject(text){
  const T=String(text||'').toLowerCase(), tw=words(T), digits=T.replace(/[^0-9]/g,' ');
  const sc=arr('projects').filter(p=>catOf(p)!=='abgesagt').map(p=>{ let s=0; const why=[];
    const nr=String(p.nr||'').replace(/[^0-9]/g,''); if(nr.length>=4&&new RegExp('(^|\\D)'+nr+'(\\D|$)').test(digits)){ s+=6; why.push('Nr. '+p.nr); }
    const nw=[...words(p.name)].filter(w=>w.length>3&&!GEN_W.has(w)); const hit=nw.filter(w=>tw.has(w));
    if(hit.length){ s+=2*hit.length+(hit.length===nw.length?2:0); why.push(hit.join(', ')); }
    [...words(p.customer||'')].filter(w=>w.length>3&&!GEN_W.has(w)&&tw.has(w)&&!hit.includes(w)).forEach(w=>{ s+=1; why.push(w); });
    [...words(p.place||'')].filter(w=>w.length>3&&!GEN_W.has(w)&&tw.has(w)&&!hit.includes(w)).forEach(w=>{ s+=1; why.push(w); });
    if(s&&['laufend','planung'].includes(catOf(p))) s+=0.5;
    return {p,s,why}; }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(sc.length&&(sc[0].s>=3||sc.length===1&&sc[0].s>=2)&&(!sc[1]||sc[0].s-sc[1].s>=1.5)) return {pid:sc[0].p.id,why:sc[0].why.join(' · ')};
  return {pid:'',why:sc.length?'mehrdeutig: '+sc.slice(0,3).map(x=>x.p.name).join(' / '):''};
}
async function pdfText(file){
  try{ const lib=await pdfLib(); const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,isOffscreenCanvasSupported:false,disableFontFace:true}).promise; let t='';
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){ const tc=await (await pdf.getPage(i)).getTextContent(); t+=tc.items.map(x=>x.str).join(' ')+'\n'; } return t.slice(0,20000); }catch(e){ return ''; }
}
async function aiClassify(rec){
  if(!SAMPLE) return null;
  const plist=arr('projects').filter(p=>catOf(p)!=='abgesagt').map(p=>`${p.id} | ${p.name} | ${p.nr||''} | ${p.place||''} | ${p.customer||''}`).join('\n');
  const prompt=`Ordne dieses Dokument eines Solar-Installationsbetriebs einem Projekt zu und bestimme die Dokumentart.
Projekte (ID | Name | Nummer | Ort | Kunde):
${plist}
Dokument: ${rec.name}${rec.subject?'\nBetreff: '+rec.subject:''}${rec.from?'\nVon: '+rec.from:''}
Text:
"""${String(rec.text||'').slice(0,4000)}"""
Nur zuordnen, wenn Kommission, Projektname, Projektnummer, Adresse oder Kunde eindeutig passen. Material für Lager/Büro ohne Kundenbezug: "intern". Sonst "".
Antworte nur mit JSON: {"projectId":"","kind":"angebot|rechnung|ab|bestellung|lieferschein|mail|vertrag|plan|foto|sonst","why":"kurz"}`;
  try{ return await SAMPLE.json(prompt,{modelTier:'quick'}); }catch(e){ return null; }
}
// Doppelt hochgeladen? Fingerabdruck je Datei (SHA-256 des Inhalts) als fp am Datei-Eintrag bzw. Beleg;
// ältere Einträge ohne fp: gleicher Dateiname + gleiche Größe
async function fileFp(x){ try{ const buf=typeof x==='string'?new TextEncoder().encode(x.replace(/\s+/g,' ').trim()):await x.arrayBuffer(); const h=await crypto.subtle.digest('SHA-256',buf); return [...new Uint8Array(h)].slice(0,16).map(b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){ return ''; } }
function findDup(fp,name,size){
  const where=(f,src)=>src+(f.pid?' · '+projName(f.pid):'')+' · „'+f.name+'“'+(f.date?' vom '+fmtD(f.date):'')+(f.by?' ('+f.by+')':'');
  const f=arr('files').find(x=>fp&&x.fp===fp)||(name&&size?arr('files').find(x=>!x.fp&&x.size===size&&(x.orig===name||x.name===name)):null); if(f) return where(f,'Datenablage');
  for(const o of arr('orders')) for(const d of (o.docs||[])) if((fp&&d.fp===fp)||(name&&d.name===name&&!d.fp&&size&&d.size===size)) return where({...d,pid:o.pid},'Bestellung '+(o.supplier||''));
  return null; }
function dupWarn(name,where){ askPop('⚠️ <b>Schon einmal hochgeladen:</b> '+esc(name)+'<br><span style="opacity:.8">'+esc(where)+'</span>'); }
// Vor dem Ablegen nachfragen: doppelte überspringen oder trotzdem ablegen (Abbrechen = nichts ablegen)
function dupAsk(list,total){ return new Promise(res=>{ A.dupAll=()=>{ closeSheet(); res('all'); };
  openSheet({title:list.length>1?list.length+' Dateien gibt es schon':'Diese Datei gibt es schon',wide:1,html:`<div class="fld full"><div class="small muted" style="margin-bottom:8px">Diese Datei${list.length>1?'en wurden':' wurde'} bereits hochgeladen:</div>${list.map(d=>`<div class="sug"><div style="min-width:0"><b>${esc(d.name)}</b><div class="small muted">liegt schon in: ${esc(d.hit)}</div></div></div>`).join('')}</div>`,
    saveLabel:list.length<total?'Doppelte überspringen':'Nicht nochmal ablegen',extraBtn:`<button type="button" class="btn" data-act="dupAll">Trotzdem ablegen</button>`,onSave:()=>res('skip')}); }); }
async function ingestFiles(files,text,pidHint){
  const fl0=[...(files||[])], fps=await Promise.all(fl0.map(f=>fileFp(f)));
  const dups=fl0.map((f,i)=>({f,name:f.name||'Datei',hit:findDup(fps[i],f.name,f.size)})).filter(x=>x.hit);
  if(!fl0.length&&text&&text.trim().length>20){ const h=findDup(await fileFp(text)); if(h){ const ch=await dupAsk([{name:'Eingefügter Text',hit:h}],1); if(ch!=='all') return; } }
  if(dups.length){ const ch=await dupAsk(dups,fl0.length); if(ch!=='all'){ files=fl0.filter(f=>!dups.some(d=>d.f===f)); if(!files.length) return; } }
  const recs=[], stamp=new Date().toISOString();
  const mk=(o)=>({id:uid(),date:TODAY(),at:stamp,...o});
  const upload=async f=>{ if(!ASSETS) return null; try{ const type=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':''); const r=await ASSETS.upload(f,type?{type}:undefined); return {asset:r.id,mime:r.contentType}; }catch(e){ return {err:e&&e.code||'Fehler'}; } };
  const addFile=async(f,parent,ctx)=>{ const up=await upload(f); const isPdf=/pdf/.test(f.type)||/\.pdf$/i.test(f.name); const txt=isPdf?await pdfText(f):'';
    const rec=mk({name:f.name||'Datei',mime:f.type||'',size:f.size||0,text:txt.slice(0,6000),parent:parent||'',kind:guessKind(f.name||'',txt,false,f.type),fp:await fileFp(f)});
    if(parent){ const h=findDup(rec.fp,f.name,f.size); if(h) dupWarn('Anhang „'+(f.name||'Datei')+'“',h); }
    if(up&&up.asset){ rec.asset=up.asset; rec.mime=up.mime||rec.mime; } else if(up&&up.err) rec.note='Datei nicht hochgeladen ('+up.err+'), nur Eintrag';
    const m=matchProject([f.name,txt,ctx].join('\n')); rec.pid=m.pid; rec.why=m.why; recs.push(rec); return rec; };
  for(const f of [...(files||[])]){ const n=(f.name||'').toLowerCase();
    if(n.endsWith('.eml')||n.endsWith('.msg')||f.type==='message/rfc822'){
      const ab=await f.arrayBuffer(); let m=null;
      if(n.endsWith('.msg')){ try{ m=parseMsg(ab); }catch(e){} if(!m){ const l=parseMsgLoose(ab); m={...l,att:l.pdf?[{name:f.name.replace(/\.msg$/i,'')+'.pdf',type:'application/pdf',blob:l.pdf}]:[]}; } }
      else m=parseEml(ab);
      const ctx=[m.subject,m.from,m.text].join('\n');
      const mail=mk({name:m.subject||f.name,subject:m.subject||'',from:m.from||'',mime:'message/rfc822',text:String(m.text||'').slice(0,8000),kind:'mail',atts:(m.att||[]).map(a=>a.name),fp:await fileFp(f),size:f.size||0});
      // dieselbe Mail evtl. neu exportiert (andere Bytes): gleicher Betreff + Absender + Text
      const same=arr('files').find(x=>x.kind==='mail'&&x.fp!==mail.fp&&x.subject&&x.subject===mail.subject&&x.from===mail.from&&String(x.text||'').slice(0,300)===mail.text.slice(0,300));
      if(same) dupWarn('Mail „'+(mail.subject||f.name)+'“','Datenablage'+(same.pid?' · '+projName(same.pid):'')+' · „'+same.name+'“ vom '+fmtD(same.date));
      const mm=matchProject(ctx+'\n'+(m.att||[]).map(a=>a.name).join(' ')); mail.pid=mm.pid; mail.why=mm.why; mail.date=isoLocal(m.date||'').slice(0,10)||mail.date; recs.push(mail);
      // Original-Mail mit ablegen, damit jeder sie in Outlook öffnen kann
      const upM=await upload(new File([ab],f.name||'mail'+(n.endsWith('.eml')?'.eml':'.msg'),{type:n.endsWith('.eml')?'message/rfc822':'application/vnd.ms-outlook'}));
      if(upM&&upM.asset){ mail.orig=f.name; mail.origAsset=upM.asset; }
      for(const a of (m.att||[])){ if(/^image\/(gif|png)$/i.test(a.type)&&a.blob.size<15000) continue; // Logos/Signaturen überspringen
        const r=await addFile(new File([a.blob],a.name,{type:a.type}),mail.id,ctx); if(!r.pid){ r.pid=mail.pid; r.why=mail.why?'aus der Mail':''; } }
    } else await addFile(f,'','');
  }
  if(!recs.length&&text&&text.trim().length>20){ const lines=text.trim().split('\n'); const subj=(lines.find(l=>/^(Betreff|Subject)\s*:/i.test(l))||'').replace(/^[^:]+:\s*/,'')||lines[0].slice(0,90);
    const r=mk({name:subj,subject:subj,from:(lines.find(l=>/^(Von|From)\s*:/i.test(l))||'').replace(/^[^:]+:\s*/,''),mime:'text/plain',text:text.slice(0,8000),kind:'mail',fp:await fileFp(text)}); const m=matchProject(text); r.pid=m.pid; r.why=m.why; recs.push(r); }
  if(!recs.length){ toast('Bitte Dateien, E-Mails (.msg/.eml) oder kopierten Mailtext ablegen.'); return; }
  if(pidHint) recs.forEach(r=>{ r.pid=pidHint; r.why='in der Projektakte abgelegt'; });
  recs.forEach(r=>{ if(!STD_RX.test(r.name)){ r.orig=r.name; const isMail=r.mime==='message/rfc822'||r.mime==='text/plain'; r.name=stdName(r.date,r.kind,isMail?(r.subject||r.from||r.name):stemOf(r.name),isMail?'':extOf(r.name)); } });
  recs.forEach(r=>{ r.auto=r.pid?'regel':''; put('files',r); });
  const n=recs.filter(r=>r.pid).length;
  toast(recs.length+' Eintr'+(recs.length===1?'ag':'äge')+' abgelegt · '+n+' einem Projekt zugeordnet'+(recs.length-n&&SAMPLE?' · Claude prüft den Rest …':''));

    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88)); return new Uint8Array(await b.arrayBuffer()); } finally{ URL.revokeObjectURL(url); } }

const TODO_RX=/\b(muss|müssen|musst|sollte?n?|bitte|noch|fehlt|fehlen|offen|klären|nachfragen|nachhaken|anrufen|zurückrufen|bestellen|schicken|senden|versenden|erstellen|vereinbaren|abstimmen|prüfen|besorgen|organisieren|einreichen|beantragen|anmelden|melden|todo|to-do|erledigen|kümmern|abholen|liefern lassen|terminieren|warten auf)\b/i;
function localTodos(text){
  const byK={}; staff().forEach(s=>{ byK[shortWho(s.name).toLowerCase()]=shortWho(s.name); const fn=s.name.split(' ')[0].toLowerCase(); if(fn.length>2) byK[fn]=shortWho(s.name); });
  return String(text).split(/(?<=[.!?;])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>=8&&TODO_RX.test(s)).slice(0,5).map(s=>{
    const w=(s.match(/\b[\wÄÖÜäöüß]{2,12}\b/g)||[]).map(x=>byK[x.toLowerCase()]).find(Boolean)||'';
    return {title:s.replace(/^[-–•*\s]+/,'').slice(0,160),who:w,due:''}; });
}
async function suggestTodos(pid,text){

"""${text.slice(0,3000)}"""

${roster}

${done}

${open}

Aufgabe 2 – To-Dos: Erkenne alles, was noch jemand tun muss, auch wenn es versteckt formuliert ist: „X anrufen“, „Material bestellen (MK)“, „Termin vereinbaren“, „muss noch …“, „fehlt noch …“, „Kunde wartet auf Angebot“ (→ Angebot schicken), „warten auf Rückmeldung von Y“ (→ bei Y nachfragen), „Netzbetreiber hat noch nicht geantwortet“ (→ beim Netzbetreiber nachhaken). Reine Statusmeldungen ohne offene Handlung sind keine Aufgaben. Ordne einen Mitarbeiter nur zu, wenn er im Text genannt ist (Kürzel oder Name); sonst who "". due nur, wenn ein Termin genannt oder klar ableitbar ist (z. B. „bis Freitag“, „nächste Woche“ = Freitag der nächsten Woche), sonst "".

const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
function splitRef(ref){ const i=ref.indexOf(':'); return [ref.slice(0,i),ref.slice(i+1)]; }
function moveRef(ref,date,who){
  const [t,id]=splitRef(ref); const staffWho = who&&!who.startsWith('__')? who : null;
  if(!date){ // nur Zuständigkeit ändern (To-Do-Board, Personen-Chips)
    if(t!=='task') return; const k=clone(S.tasks[id]); if(!k) return; const nw=staffWho||'';
    if((k.who||'')===nw) return; k.who=nw; put('tasks',k); toast(nw?'Zugewiesen an '+shortWho(nw):'Zuständigkeit entfernt'); return; }
  if(t==='plan'){ const [wid,ix]=id.split('|'), w=S.plan[wid]; if(!w||!w.entries[+ix]) return; const e=clone(w.entries[+ix]);
    const delta=daysBetween(e.d,date); e.d=date; if(e.end) e.end=addDays(e.end,delta);
    if(who==='__abw'){ e.kind='abw'; e.who=''; } else if(who==='__none'){ e.who=''; } else if(staffWho){ e.who=staffWho; if(e.kind==='abw'&&w.entries[+ix].who==='') e.kind='abw'; }
    const ww=clone(w); ww.entries.splice(+ix,1); savePlanEntry(e,ww,true); }
  else if(t==='event'){ const e=clone(S.events[id]); if(!e) return; const delta=daysBetween(e.date,date); e.date=date; if(e.end) e.end=addDays(e.end,delta); if(staffWho) e.who=staffWho; put('events',e); }
  else if(t==='task'){ const k=clone(S.tasks[id]); if(!k) return; k.due=date; if(staffWho) k.who=staffWho; put('tasks',k); }
  else if(t==='order'){ const o=clone(S.orders[id]); if(!o) return; o.delivery=date; put('orders',o); }
  else if(t==='pstart'||t==='pend'){ const p=clone(S.projects[id]); if(!p) return; const n=t==='pstart'?11:23; p[t==='pstart'?'start':'end']=date; if(/^\d{4}-/.test((p.ms||{})['m'+n]||'')) p.ms={...p.ms,['m'+n]:date}; put('projects',p); }
  else return;
  toast('Verschoben auf '+fmtD(date)+(staffWho?' · '+shortWho(staffWho):''));
}
function resizeRef(ref,date){
  const [t,id]=splitRef(ref);
  const setEnd=(start,obj,key)=>{ if(date<start){ toast('Das Ende kann nicht vor dem Start liegen.'); return false; } if(date===start) delete obj[key]; else obj[key]=date; return true; };
  if(t==='plan'){ const [wid,ix]=id.split('|'), w=S.plan[wid]; if(!w||!w.entries[+ix]) return; const ww=clone(w), e=ww.entries[+ix]; if(!setEnd(e.d,e,'end')) return; e.updBy=meK(); e.updAt=new Date().toISOString(); e.log=(e.log||[]).concat([{at:e.updAt,by:meK()}]).slice(-30); put('plan',ww); toast(e.end?'Dauer: '+fmtD(e.d)+' – '+fmtD(e.end):'Eintrag auf einen Tag verkürzt.'); }
  else if(t==='event'){ const e=clone(S.events[id]); if(!e||!setEnd(e.date,e,'end')) return; put('events',e); toast(e.end?'Dauer: '+fmtD(e.date)+' – '+fmtD(e.end):'Termin auf einen Tag verkürzt.'); }
}
let DRAG=null, SUPPRESS_CLICK=false;
// Ein To-Do auf ein anderes To-Do ziehen → wird dort als Update übernommen
function dropTargetAt(x,y){ const el=document.elementFromPoint(x,y); if(!el) return null;
  if(DRAG&&String(DRAG.ref).startsWith('proj:')){ const pc=el.closest('[data-drop-proj]'); return pc&&'proj:'+pc.dataset.dropProj!==DRAG.ref?pc:null; }
  if(DRAG&&String(DRAG.ref).startsWith('task:')){ const tk=el.closest('[data-drop-task],[data-drop-note]'); if(tk&&(tk.dataset.dropNote||'task:'+tk.dataset.dropTask!==DRAG.ref)) return tk; }
  return el.closest('[data-drop-d],[data-drop-who]'); }
function mergeTask(srcId,dstId){
  const a=S.tasks[srcId], b=S.tasks[dstId]; if(!a||!b||a.id===b.id) return; if(!mayWrite('tasks')) return toast('Keine Berechtigung, To-Dos zu ändern.');
  const ups=(a.upd2||[]).length;
  openSheet({title:'Als Update übernehmen?',html:`<div class="fld full"><div class="mg-box"><div class="small muted">Dieses To-Do …</div><b>${esc(a.title)}</b>${a.who?` <span class="small muted">· ${esc(shortWho(a.who))}</span>`:''}${ups?`<div class="small muted">mit ${ups} Update${ups>1?'s':''}</div>`:''}</div>
    <div style="text-align:center;margin:6px 0">↓ wird Update in</div><div class="mg-box"><b>${esc(b.title)}</b>${b.who?` <span class="small muted">· ${esc(shortWho(b.who))}</span>`:''}${b.pid?`<div class="small muted">${esc(projName(b.pid))}</div>`:''}</div>
    <label class="mt-opt" style="margin-top:12px"><input type="checkbox" class="ck" id="mg_del" ${isAdmin()?'':'disabled'}><span>Ursprüngliches To-Do danach löschen${isAdmin()?'':' (nur EP/AvE)'} – sonst wird es als erledigt abgehakt</span></label></div>`,saveLabel:'Übernehmen',
    onSave:()=>{ const x=clone(S.tasks[dstId]), src=S.tasks[srcId]; if(!x||!src) return;

      x.upd2=[...(x.upd2||[]),...(src.upd2||[]).map(u=>({...u,t:'['+src.title+'] '+u.t})),{d:TODAY(),tm:now.slice(9),by:meK(),t:'Übernommen aus To-Do: '+src.title+(extra?' ('+extra+')':''),at:new Date().toISOString()}];
      if(src.prio&&PRIO[src.prio]&&PRIO[x.prio||'normal']&&PRIO[src.prio][1]>PRIO[x.prio||'normal'][1]) x.prio=src.prio;

function startDrag(){
  DRAG.started=true; const g=document.createElement('div'); g.className='drag-ghost';
  g.textContent=DRAG.mode==='resize'?'↔ Ende auf Tag ziehen':(DRAG.el.innerText||'').replace(/\s+/g,' ').trim().slice(0,48);
  document.body.appendChild(g); DRAG.ghost=g; DRAG.el.classList.add('dragging-src'); document.body.classList.add('dragging'); moveGhost(DRAG.x,DRAG.y);
}
function moveGhost(x,y){
  if(!DRAG||!DRAG.ghost) return; DRAG.ghost.style.left=(x+14)+'px'; DRAG.ghost.style.top=(y+14)+'px';
  const t=dropTargetAt(x,y); if(DRAG.hi&&DRAG.hi!==t) DRAG.hi.classList.remove('drop-hi'); if(t) t.classList.add('drop-hi'); DRAG.hi=t;
}
function endDrag(){ if(!DRAG) return; clearTimeout(DRAG.timer); if(DRAG.ghost) DRAG.ghost.remove(); if(DRAG.hi) DRAG.hi.classList.remove('drop-hi'); if(DRAG.el) DRAG.el.classList.remove('dragging-src'); document.body.classList.remove('dragging'); DRAG=null; }
document.addEventListener('pointerdown',e=>{
  if(e.button>0||READONLY) return; if(e.target.closest('select,input,textarea')) return; const it=e.target.closest('[data-drag]'); if(!it||!it.dataset.drag) return;
  const rz=!!e.target.closest('.rz');
  DRAG={ref:it.dataset.drag,mode:rz?'resize':'move',x:e.clientX,y:e.clientY,el:it,started:false,touch:e.pointerType!=='mouse'};
  if(rz){ e.preventDefault(); startDrag(); }
  else if(DRAG.touch){ DRAG.timer=setTimeout(()=>{ if(DRAG&&!DRAG.started){ startDrag(); if(navigator.vibrate) try{ navigator.vibrate(15); }catch(_){} } },380); }
});
document.addEventListener('pointermove',e=>{
  if(!DRAG) return; const dist=Math.hypot(e.clientX-DRAG.x,e.clientY-DRAG.y);
  if(!DRAG.started){ if(DRAG.touch){ if(dist>10) endDrag(); return; } if(dist<6) return; startDrag(); }
  e.preventDefault(); moveGhost(e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{ if(DRAG&&DRAG.started) e.preventDefault(); },{passive:false});
document.addEventListener('pointerup',e=>{
  if(!DRAG) return; const d=DRAG; if(!d.started){ endDrag(); return; }
  const t=dropTargetAt(e.clientX,e.clientY); endDrag(); SUPPRESS_CLICK=true; setTimeout(()=>{ SUPPRESS_CLICK=false; },60);
  if(!t) return; if(t.dataset.dropProj){ projReorder(String(d.ref).slice(5),t.dataset.dropProj); return; }
  if(t.dataset.dropNote){ linkTaskNote(t.dataset.pid,String(d.ref).slice(5),t.dataset.dropNote); return; }
  if(t.dataset.dropTask){ mergeTask(String(d.ref).slice(5),t.dataset.dropTask); return; }
  if(d.mode==='resize'){ if(t.dataset.dropD) resizeRef(d.ref,t.dataset.dropD); } else moveRef(d.ref,t.dataset.dropD||'',t.dataset.dropWho);
});
document.addEventListener('pointercancel',()=>endDrag());
document.addEventListener('click',e=>{ if(SUPPRESS_CLICK){ e.stopPropagation(); e.preventDefault(); } },true);

const mondayOf = s=>{ const d=new Date(s+'T12:00'); return addDays(s, -((d.getDay()+6)%7)); };
const weekStart = ()=>UI.week||mondayOf(TODAY());
function savePlanEntry(v,touched,silent){
  const wid='w-'+mondayOf(v.d);
  if(touched && touched.id!==wid) put('plan',touched);
  const w = touched && touched.id===wid ? touched : (S.plan[wid]?clone(S.plan[wid]):{id:wid,week:mondayOf(v.d),entries:[]});
  const e={d:v.d,t:v.t,who:v.who||'',kind:v.kind||'bau',by:v.by||meK(),at:v.at||new Date().toISOString()};
  if(v.by){ e.updBy=meK(); e.updAt=new Date().toISOString(); e.log=(v.log||[]).concat([{at:e.updAt,by:meK()}]).slice(-30); } ['time','pid','note'].forEach(k=>{ if(v[k]) e[k]=v[k]; }); if(v.end&&v.end>v.d) e.end=v.end; if(v.mat&&v.mat.length) e.mat=v.mat.map(m=>({ok:!!m.ok,qty:m.qty??'',unit:m.unit||'',art:m.art||''}));
  w.entries.push(e); put('plan',w); if(!silent) toast('Wochenplanung gespeichert.');
}
// Statusschritt (setzt/entfernt auch den verknüpften Checklistenpunkt und schließt zugehörige Aufgaben)
function applyMs(p,i,val){
  p.ms={...(p.ms||{})}; p.checks={...(p.checks||{})}; p.msBy={...(p.msBy||{})};
  if(val){ p.ms['m'+i]=val; p.msBy['m'+i]=meK()+' '+fmtD(TODAY()).slice(3); } else { delete p.ms['m'+i]; delete p.msBy['m'+i]; }
  const item=MS_LINK[i]; let msg='';
  if(item){ if(val) p.checks[item]=p.checks[item]||{d:/^\d{4}-/.test(val)?val:TODAY(),by:meK()}; else delete p.checks[item]; }
  const auto={30:'erledigt',31:'onhold',32:'abgesagt'}[i];
  if(val&&auto){ p.cat=auto; msg='Kategorie auf „'+CATS[auto]+'“ gesetzt.'; }
  else if(val&&catOf(p)==='planung'&&(()=>{ const s=flowSeq(p), k=s.indexOf(7); return i===7||(k>=0&&s.indexOf(i)>k)||(k<0&&s.indexOf(i)>=0&&flowId(p)==='service'); })()){ p.cat='laufend'; msg='Beauftragt: Projekt ist jetzt „Laufend“.'; }
  if(i===11&&/^\d{4}-/.test(val||'')) p.start=val; if(i===23&&/^\d{4}-/.test(val||'')) p.end=val;
  if(i===29) p.wartung=!!val;
  p.status={erledigt:'abgeschlossen',abgesagt:'abgeschlossen',onhold:'pausiert'}[catOf(p)]||'aktiv';
  if(val) arr('tasks').filter(t=>t.pid===p.id&&!t.done&&(+t.ms===i||(item&&t.item===item))).forEach(t=>put('tasks',{...clone(t),done:true,doneAt:TODAY()}));
  return msg;
}
function setMs(pid,i,val){ const p=clone(S.projects[pid]); const msg=applyMs(p,i,val); put('projects',p); if(msg) toast(msg); }

const prPage=(title,sub,body,landscape)=>`<div class="pr-doc ${landscape?'pr-land':''}"><div class="pr-head"><div><div class="pr-brand"><span>NUTZ DIE</span> SONNE</div><div class="pr-sub">nutz die Sonne GmbH</div></div><div class="pr-title">${esc(title)}<div class="pr-date">${esc(sub||'')}</div></div></div>${body}<div class="pr-foot">Gedruckt ${esc(fmtD(TODAY()))}${ME?' · '+esc(meK()):''}</div></div>`;
// pages: [[title,sub,body], …] → je Seite ein eigenes Blatt
function printDoc(title,sub,body,landscape,pages){
  const html=(pages||[[title,sub,body]]).map(([t,s,b])=>prPage(t,s,b,landscape)).join('');
  let el=$('#printArea'); if(!el){ el=document.createElement('div'); el.id='printArea'; document.body.appendChild(el); }
  el.innerHTML=html; document.body.classList.add('printing'); document.body.classList.toggle('print-land',!!landscape);

}

/* ========== To-Do-Updates mit Datum ========== */
// Update-Zeitpunkt: gewaehltes Datum + Uhrzeit (eingegeben oder Zeitpunkt des Eintragens, wenn am selben Tag)
const updTime=x=>{ if(x.tm) return x.tm; if(!x.at) return ''; const a=new Date(x.at); if(isNaN(a)||iso(a)!==x.d) return ''; return String(a.getHours()).padStart(2,'0')+':'+String(a.getMinutes()).padStart(2,'0'); };
const updStamp=x=>fmtD(x.d)+(updTime(x)?' · '+updTime(x):'');
const updKey=x=>(x.d||'')+' '+(updTime(x)||'00:00')+(x.at||'');
// Letzte Aktivität eines To-Dos: neuestes Update, sonst Anlagezeitpunkt (Format JJJJ-MM-TT HH:MM)
const isoLocal=s=>{ const a=new Date(s); return isNaN(a)?'':iso(a)+' '+String(a.getHours()).padStart(2,'0')+':'+String(a.getMinutes()).padStart(2,'0'); };
const taskActKey=t=>{ const u=(t.upd2||[]).map(x=>(x.d||'')+' '+(updTime(x)||'00:00')).sort().pop()||''; const c=t.at?isoLocal(t.at):''; return u>c?u:c; };
function taskUpdList(t){ const u=(t&&t.upd2)||[]; return u.length?u.slice().sort((a,b)=>updKey(b).localeCompare(updKey(a))).map(x=>`<div class="tu"><b class="mono">${esc(updStamp(x))}</b> <span class="who-chip">${esc(x.by||'?')}</span> ${esc(x.t)}</div>`).join(''):'<div class="small muted">Noch keine Updates.</div>'; }
function taskUpdHtml(t){
  return `<div class="tu-box"><div id="tu_list">${taskUpdList(S.tasks[t.id]||t)}</div>
    <div class="tu-new"><textarea class="inp" id="tu_t" rows="4" placeholder="Was ist passiert? z. B. Westnetz angerufen, Rückruf Freitag zugesagt, Unterlagen per Mail geschickt … (Strg+Enter fügt hinzu)" aria-label="Update"></textarea><input type="date" class="inp" id="tu_d" value="${TODAY()}" aria-label="Datum"><input type="time" class="inp" id="tu_h" value="${nowStamp().slice(9)}" aria-label="Uhrzeit"><button type="button" class="btn sm pri" data-act="taskUpdAdd" data-id="${t.id}">Update hinzufügen</button></div>
    ${t.pid&&S.projects[t.pid]?'<div class="small muted">Erscheint in den Projekt-Notizen unter „Updates zu To-Dos“.</div>':''}</div>`;
}
function todoUpdBlock(p){
  const ts=arr('tasks').filter(t=>t.pid===p.id&&(t.upd2||[]).length).sort((a,b)=>(a.done-b.done)||String(((b.upd2||[]).slice(-1)[0]||{}).d||'').localeCompare(String(((a.upd2||[]).slice(-1)[0]||{}).d||'')));
  if(!ts.length) return '';
  return `<div><div class="eyebrow" style="margin-bottom:4px"><span>Updates zu To-Dos</span></div>${ts.map(t=>{ const u=t.upd2.slice().sort((a,b)=>updKey(b).localeCompare(updKey(a)));
    return `<details class="tu-d"><summary><span>${t.done?'✓':'☐'} ${esc(t.title)}</span><span class="small muted">${u.length} Update${u.length>1?'s':''} · zuletzt ${esc(updStamp(u[0]))}${t.who?' · '+esc(shortWho(t.who)):''}</span></summary>${u.map(x=>`<div class="tu"><b class="mono">${esc(updStamp(x))}</b> <span class="who-chip">${esc(x.by||'?')}</span> ${esc(x.t)}</div>`).join('')}<button type="button" class="btn ghost sm" data-act="editTask" data-id="${t.id}">To-Do öffnen</button></details>`; }).join('')}</div>`;
}

  const cell=(pn,d)=>all.filter(x=>x.d===d&&whoOf(x)===pn).map(x=>{ const e=x.e||{}, pj=e.pid&&S.projects[e.pid]; return `<div class="pw-e">${e.time&&!(x.multi&&!x.first)?'<b>'+esc(e.time)+'</b> ':''}${x.multi&&!x.first?'↳ ':''}${pj?'<b>'+esc(pj.name)+'</b> ':''}${esc(x.t)}</div>`; }).join('');

  const tasks=arr('tasks').filter(t=>!t.done&&t.due&&t.due<=dd[dd.length-1]).sort(byDue);

    `<div class="pw-2"><div><h3>Fällige To-Dos (bis ${esc(fmtD(dd[dd.length-1]))})</h3>${tasks.length?`<table class="pr-tbl"><tr><th style="width:4%"></th><th>Aufgabe</th><th style="width:16%">Wer</th><th style="width:14%">Fällig</th></tr>${tasks.slice(0,25).map(t=>`<tr><td>☐</td><td>${esc(t.title)}${t.pid?'<br><small>'+esc(projName(t.pid))+'</small>':''}</td><td>${esc(t.ext?'extern: '+t.ext:t.who?shortWho(t.who):'offen')}</td><td>${esc(fmtD(t.due))}${t.due<TODAY()?' !':''}</td></tr>`).join('')}</table>`:'<p>Keine.</p>'}</div>

     <h3>Notizen</h3><div class="pr-line"></div><div class="pr-line"></div><div class="pr-line"></div></div></div>`;
  printDoc('Wochenplan KW '+kw,fmtD(ws)+' – '+fmtD(dd[dd.length-1]),body,true);
